<html lang="en">
<head>

<title>PDX</title>
<style>
  :root{
    --timber:#C08E4E; --terrazzo:#EFE9DD; --trimet:#1B4C8C;
    --amber:#F0A23C; --moss:#5C7A52; --ink:#1A1F26;
    --display: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    height:100%; width:100%; overflow:hidden; background:#C9A671; color:var(--terrazzo);
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none;
  }
  #c{ position:fixed; inset:0; display:block; touch-action:none;
      image-rendering:pixelated; image-rendering:-webkit-optimize-contrast; }
  /* the weather closes in the moment you step out from under the roof */
  #room{
    position:fixed; inset:0; pointer-events:none; z-index:2; opacity:0;
    transition:opacity .6s ease;
    background:radial-gradient(ellipse at 50% 46%, transparent 30%, rgba(10,14,22,.72) 100%);
  }
  #stick{
    position:fixed; z-index:5;
    left:calc(env(safe-area-inset-left,0px) + 22px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
    width:122px; height:122px; border-radius:50%;
    border:1px solid rgba(239,233,221,.3); background:rgba(30,40,54,.24);
    backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); touch-action:none;
  }
  #knob{
    position:absolute; left:50%; top:50%; width:50px; height:50px; margin:-25px 0 0 -25px;
    border-radius:50%; border:1px solid rgba(240,162,60,.6); background:rgba(240,162,60,.16);
    transition:background .2s;
  }
  #stick.on #knob{ background:rgba(240,162,60,.32); }
  #name{
    position:fixed; z-index:6; left:0; right:0;
    bottom:calc(env(safe-area-inset-bottom,0px) + 172px);
    text-align:center; pointer-events:none;
    font-family:var(--display); font-style:italic; font-size:1.5rem;
    opacity:0; text-shadow:0 2px 14px rgba(10,16,28,.7);
  }
  #name.show{ animation:nm 2s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes nm{
    0%{opacity:0; transform:translateY(8px);}
    14%{opacity:1; transform:translateY(0);}
    66%{opacity:1;}
    100%{opacity:0; transform:translateY(-10px);}
  }
  #back{
    position:fixed; z-index:6;
    left:calc(env(safe-area-inset-left,0px) + 18px);
    top:calc(env(safe-area-inset-top,0px) + 16px);
    padding:9px 17px; background:rgba(26,31,38,.52);
    border:1px solid rgba(239,233,221,.3); color:rgba(239,233,221,.9);
    font-family:var(--mono); font-size:.58rem; letter-spacing:.2em; text-transform:uppercase;
    text-decoration:none; -webkit-appearance:none; cursor:pointer;
  }
  #back:active{ background:rgba(239,233,221,.2); }
  #hud{
    transition:opacity .9s ease;
    position:fixed; z-index:5; right:calc(env(safe-area-inset-right,0px) + 22px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 34px); text-align:right;
    font-family:var(--mono); font-size:.58rem; letter-spacing:.18em;
    text-transform:uppercase; color:rgba(239,233,221,.5); pointer-events:none; line-height:2;
    text-shadow:0 1px 4px rgba(10,16,28,.6);
  }
  #clock{
    position:fixed; z-index:5; right:calc(env(safe-area-inset-right,0px) + 22px);
    top:calc(env(safe-area-inset-top,0px) + 18px);
    font-family:var(--mono); font-size:.72rem; letter-spacing:.22em;
    color:rgba(240,162,60,.72); pointer-events:none;
    text-shadow:0 0 12px rgba(240,162,60,.35);
  }
  #fade{
    position:fixed; inset:0; z-index:30; background:#fff;
    opacity:0; pointer-events:none; transition:opacity .9s ease;
  }
  #fade.on{ opacity:1; }
  #err{
    position:fixed; z-index:40; left:0; right:0; top:50%; transform:translateY(-50%);
    display:none; text-align:center; padding:0 30px; pointer-events:none;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:.62rem; letter-spacing:.18em; text-transform:uppercase; opacity:.72;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="room"></div>
<div id="name"></div>
<div id="clock"></div>
<a id="back" href="thehouse.html">&larr; the house</a>

<div id="fade"></div>

<div id="err"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
(function(){
if(typeof THREE==='undefined'){
  const e=document.getElementById('err');
  if(e){ e.textContent='three.js failed to load — check connection'; e.style.display='block'; }
  return;
}

function rnd(a,b){ return a+Math.random()*(b-a); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

/* ══════════════════════════════════════════════════════════════
   WHAT THE MACHINE CAN TAKE
   ══════════════════════════════════════════════════════════════ */
const QUAL=(function(){
  const touch=(navigator.maxTouchPoints||0)>1;
  const small=Math.min(screen.width||1280, screen.height||900)<860;
  const cores=navigator.hardwareConcurrency||4;
  const mem=navigator.deviceMemory||4;
  let t=(touch&&small)?0:2;
  if(t===0 && cores>=8 && mem>=6) t=1;
  if(t===2 && (cores<=4 || mem<=4)) t=1;
  return { tier:t,
    lights:[6,10,14][t],
    slatGap:[2.05,1.48,1.12][t],     /* centre to centre, in metres  */
    slatStep:[5.5,4.2,3.5][t],       /* how finely a slat is bent     */
    rain:  [600,1300,2400][t],
    people:[11,17,24][t],
    res:   [156,178,192][t],
    octaves:[3,4,5][t] };
})();

/* ══════════════════════════════════════════════════════════════
   WAVETABLES
   ══════════════════════════════════════════════════════════════ */
function spectrum(f,K){
  K=K||48; const real=[0], imag=[0];
  for(let k=1;k<=K;k++){ real.push(0); imag.push(f(k)); }
  return {real:real, imag:imag};
}
const WAVETABLES={
  roof:   spectrum(function(k){ const p=[1,2,3,5,7,11]; let v=0;
            for(let i=0;i<p.length;i++) if(k===p[i]) v=Math.pow(i+1,-0.85);
            return v; }),
  glass:  spectrum(function(k){ return Math.pow(k,-0.5)*Math.exp(-Math.pow((k-13)/9,2)); }),
  steel:  spectrum(function(k){ const p=[1,2.8|0,4,7,10,15]; let v=0;
            for(let i=0;i<p.length;i++) if(k===p[i]) v=Math.pow(i+1,-0.7);
            return v; }),
  tree:   spectrum(function(k){ return Math.pow(k,-1.6)*(k%2===1?1:0.55); }),
  sign:   spectrum(function(k){ return Math.pow(k,-0.9)*Math.exp(-Math.pow((k-6)/7,2)); }),
  max:    spectrum(function(k){ return Math.pow(k,-1.35)*(k<10?1:0.22); }),
  plane:  spectrum(function(k){ return Math.pow(k,-2.4); }),
  person: spectrum(function(k){ return Math.pow(k,-1.1)*Math.exp(-Math.pow((k-5)/8,2)); }),
  bag:    spectrum(function(k){ return Math.pow(k,-1.9)*(k%3===0?1:0.4); }),
  piano:  spectrum(function(k){ return Math.pow(k,-1.25)*(1-0.4*Math.cos(k*1.1)); }),
  carpet: spectrum(function(k){ return Math.pow(k,-2.0)*Math.exp(-Math.pow((k-3)/4,2)); }),
  coffee: spectrum(function(k){ return (k%2===1?1:0.25)*Math.pow(k,-0.9)*Math.exp(-Math.pow((k-9)/7,2)); }),
  books:  spectrum(function(k){ return Math.pow(k,-1.5)*(k<7?1:0.3); }),
  water:  spectrum(function(k){ return Math.pow(k,-1.7)*(k%2===1?1:0.6); }),
  light:  spectrum(function(k){ return Math.pow(k,-0.6)*Math.exp(-Math.pow((k-11)/9,2)); })
};
const PATCH={
  roof:   { semis:-12, dur:6.5, atk:0.05, cut:1500, q:1.3, gain:0.28, roll:40 },
  glass:  { semis: 12, dur:3.4, atk:0.01, cut:6200, q:1.4, gain:0.15, roll:12 },
  steel:  { semis: -5, dur:5.0, atk:0.01, cut:2100, q:1.8, gain:0.22, roll:20 },
  tree:   { semis:  7, dur:3.6, atk:0.16, cut:3000, q:1.5, gain:0.16, roll:12 },
  sign:   { semis:  5, dur:2.4, atk:0.02, cut:2800, q:2.0, gain:0.17, roll:14 },
  max:    { semis:-12, dur:5.0, atk:0.03, cut:1400, q:1.4, gain:0.30, roll:30 },
  plane:  { semis:-24, dur:7.0, atk:1.20, cut: 420, q:1.0, gain:0.32, roll:150 },
  person: { semis:  5, dur:2.4, atk:0.06, cut:2400, q:2.2, gain:0.16, roll:14 },
  bag:    { semis:  0, dur:1.8, atk:0.01, cut:2600, q:1.8, gain:0.16, roll:10 },
  piano:  { semis:  0, dur:4.5, atk:0.004,cut:3400, q:1.2, gain:0.22, roll:14 },
  carpet: { semis:-17, dur:2.8, atk:0.02, cut: 900, q:1.6, gain:0.24, roll:10 },
  coffee: { semis: 12, dur:2.2, atk:0.01, cut:5200, q:1.4, gain:0.13, roll:10 },
  books:  { semis:  0, dur:3.0, atk:0.03, cut:1900, q:1.5, gain:0.17, roll:11 },
  water:  { semis:  7, dur:3.4, atk:0.24, cut:3600, q:1.6, gain:0.15, roll:14 },
  light:  { semis: 19, dur:3.2, atk:0.04, cut:6400, q:1.4, gain:0.13, roll:9 }
};
const LABEL={
  roof:'nine acres of it', glass:'the weather, outside', steel:'one of the trees that holds it up',
  tree:'a tree that does not', sign:'the way out', max:'the Red Line',
  plane:'something leaving', person:'somebody', bag:'a bag with wheels',
  piano:'somebody playing', carpet:'the carpet', coffee:'coffee', books:'a bookshop',
  light:'a skylight', chandelier:'the chandelier', board:'departures',
  gate:'the counter, and an hour north of here'
};
const ROOT=48;
const DEG=[0,2,4,7,9,11,14,16];
function mtof(m){ return 440*Math.pow(2,(m-69)/12); }

/* ══════════════════════════════════════════════════════════════
   AUDIO
   A hall this size is mostly reverb. Everything indoors goes
   through one filter so that stepping out onto the platform can
   shut the building behind you.
   ══════════════════════════════════════════════════════════════ */
let ac=null, master=null, hallVerb=null, outVerb=null, waves={}, ready=false;
let hallLP=null, hallGain=null, outLP=null, outGain=null;
let hvacGain=null, crowdGain=null, rollBus=null, rollPan=null, rollGain=null;
let paBus=null, paGain=null, pianoBus=null, pianoPan=null;
let rainLo=null, rainHi=null, canopyGain=null, windGain=null, roadGain=null;
let railGain=null, railPan=null, escGain=null, escPan=null;

function impulse(sec,decay){
  const n=Math.floor(ac.sampleRate*sec), b=ac.createBuffer(2,n,ac.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d=b.getChannelData(ch);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay);
  }
  return b;
}
function noiseBuf(sec,smooth){
  const n=Math.floor(ac.sampleRate*sec), b=ac.createBuffer(1,n,ac.sampleRate);
  const d=b.getChannelData(0); let last=0;
  for(let i=0;i<n;i++){ last=last*smooth+(Math.random()*2-1)*(1-smooth); d[i]=last*(1/(1-smooth))*0.6; }
  return b;
}
function panner(x,y,z,ref){
  const p=ac.createPanner();
  p.panningModel='HRTF'; p.distanceModel='inverse';
  p.refDistance=ref||20; p.maxDistance=900; p.rolloffFactor=1;
  if(p.positionX){ p.positionX.value=x; p.positionY.value=y; p.positionZ.value=z; }
  else p.setPosition(x,y,z);
  return p;
}
function movePan(p,v){
  if(!p) return;
  if(p.positionX){
    const t=ac.currentTime;
    p.positionX.setTargetAtTime(v.x,t,0.05);
    p.positionY.setTargetAtTime(v.y,t,0.05);
    p.positionZ.setTargetAtTime(v.z,t,0.05);
  } else p.setPosition(v.x,v.y,v.z);
}
function noiseSrc(sec,smooth){
  const s=ac.createBufferSource(); s.buffer=noiseBuf(sec,smooth); s.loop=true; return s;
}
function band(type,f,q){
  const b=ac.createBiquadFilter(); b.type=type; b.frequency.value=f;
  if(q!==undefined) b.Q.value=q; return b;
}

function initAudio(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return false;
  ac=new AC();
  master=ac.createGain(); master.gain.value=0.0001;
  const comp=ac.createDynamicsCompressor();
  comp.threshold.value=-15; comp.knee.value=24; comp.ratio.value=5;
  comp.attack.value=0.005; comp.release.value=0.3;
  master.connect(comp); comp.connect(ac.destination);
  master.gain.setTargetAtTime(0.9, ac.currentTime, 0.7);

  /* the hall has a long tail. Outside has almost none. */
  const hc=ac.createConvolver(); hc.buffer=impulse(3.4,2.2);
  const hv=ac.createGain(); hv.gain.value=0.62;
  hallVerb=ac.createGain(); hallVerb.connect(hc); hc.connect(hv); hv.connect(master);
  const oc=ac.createConvolver(); oc.buffer=impulse(1.1,3.4);
  const ov=ac.createGain(); ov.gain.value=0.30;
  outVerb=ac.createGain(); outVerb.connect(oc); oc.connect(ov); ov.connect(master);

  for(const k in WAVETABLES){
    const w=WAVETABLES[k];
    waves[k]=ac.createPeriodicWave(Float32Array.from(w.real), Float32Array.from(w.imag),
                                   {disableNormalization:false});
  }

  hallLP=band('lowpass',15000,0.4);
  hallGain=ac.createGain(); hallGain.gain.value=1;
  hallLP.connect(hallGain); hallGain.connect(master);
  const hs=ac.createGain(); hs.gain.value=0.72; hallLP.connect(hs); hs.connect(hallVerb);

  outLP=band('lowpass',15000,0.4);
  outGain=ac.createGain(); outGain.gain.value=1;
  outLP.connect(outGain); outGain.connect(master);
  const os=ac.createGain(); os.gain.value=0.34; outLP.connect(os); os.connect(outVerb);

  /* the building breathing */
  const a1=noiseSrc(7,0.985), f1=band('lowpass',150,0.7);
  hvacGain=ac.createGain(); hvacGain.gain.value=0.10;
  a1.connect(f1); f1.connect(hvacGain); hvacGain.connect(hallLP); a1.start();
  [41.2,55.0,82.4].forEach(function(f,i){
    const o=ac.createOscillator(); o.type='sine'; o.frequency.value=f;
    const g=ac.createGain(); g.gain.value=0.020-i*0.005;
    o.connect(g); g.connect(hallLP); o.start();
  });

  /* several hundred people, none of them near you */
  const a2=noiseSrc(7,0.905), f2=band('bandpass',620,0.65);
  crowdGain=ac.createGain(); crowdGain.gain.value=0.052;
  a2.connect(f2); f2.connect(crowdGain); crowdGain.connect(hallLP); a2.start();

  /* one pair of wheels at a time, whichever pair is closest */
  const a3=noiseSrc(4,0.55), f3=band('bandpass',2100,1.1);
  rollGain=ac.createGain(); rollGain.gain.value=0.0001;
  rollPan=panner(0,0.3,0,8);
  a3.connect(f3); f3.connect(rollGain); rollGain.connect(rollPan);
  rollPan.connect(hallLP); a3.start();
  const a3b=noiseSrc(4,0.90), f3b=band('bandpass',260,1.4);
  rollBus=ac.createGain(); rollBus.gain.value=0.0001;
  a3b.connect(f3b); f3b.connect(rollBus); rollBus.connect(rollPan); a3b.start();

  /* the escalators, which never stop */
  const a4=noiseSrc(6,0.972), f4=band('bandpass',330,1.9);
  escGain=ac.createGain(); escGain.gain.value=0.030;
  escPan=panner(-70,3,34,14);
  a4.connect(f4); f4.connect(escGain); escGain.connect(escPan);
  escPan.connect(hallLP); a4.start();

  /* the public address, from everywhere at once */
  paBus=ac.createGain(); paBus.gain.value=1;
  const pf=band('lowpass',2600,0.7);
  const ph=band('highpass',280,0.7);
  paGain=ac.createGain(); paGain.gain.value=0.0001;
  paBus.connect(ph); ph.connect(pf); pf.connect(paGain);
  paGain.connect(hallLP);
  const pv=ac.createGain(); pv.gain.value=1.15; paGain.connect(pv); pv.connect(hallVerb);

  /* the piano, from wherever the piano is */
  pianoPan=panner(-26,1.2,26,16); pianoPan.connect(hallLP);
  const kv=ac.createGain(); kv.gain.value=1.0; pianoPan.connect(kv); kv.connect(hallVerb);
  pianoBus=ac.createGain(); pianoBus.gain.value=0.0001; pianoBus.connect(pianoPan);

  /* ── and everything on the other side of the glass ── */
  const r1=noiseSrc(7,0.74), rf1=band('lowpass',2000,0.5);
  rainLo=ac.createGain(); rainLo.gain.value=0.0001;
  r1.connect(rf1); rf1.connect(rainLo); rainLo.connect(outLP); r1.start();
  const r2=noiseSrc(7,0.24), rf2=band('bandpass',5200,0.45);
  rainHi=ac.createGain(); rainHi.gain.value=0.0001;
  r2.connect(rf2); rf2.connect(rainHi); rainHi.connect(outLP); r2.start();
  /* rain on a metal canopy is a different instrument entirely */
  const r3=noiseSrc(5,0.42), rf3=band('bandpass',1750,1.7);
  canopyGain=ac.createGain(); canopyGain.gain.value=0.0001;
  r3.connect(rf3); rf3.connect(canopyGain); canopyGain.connect(outLP); r3.start();

  const w1=noiseSrc(8,0.9885), wf=band('bandpass',430,2.6);
  windGain=ac.createGain(); windGain.gain.value=0.0001;
  w1.connect(wf); wf.connect(windGain); windGain.connect(outLP); w1.start();

  const d1=noiseSrc(6,0.968), df=band('lowpass',320,0.8);
  roadGain=ac.createGain(); roadGain.gain.value=0.0001;
  d1.connect(df); df.connect(roadGain); roadGain.connect(outLP); d1.start();

  const t1=noiseSrc(5,0.955), tf=band('bandpass',180,1.1);
  railGain=ac.createGain(); railGain.gain.value=0.0001;
  railPan=panner(118,2,0,26);
  t1.connect(tf); tf.connect(railGain); railGain.connect(railPan);
  railPan.connect(outLP); t1.start();
  return true;
}

/* ── the chime that means somebody is about to say something ── */
function paChime(){
  if(!ready) return;
  const t=ac.currentTime+0.02;
  [[784,0],[659,0.30],[523,0.60]].forEach(function(n){
    [1,2.01,3.02,4.9].forEach(function(h,i){
      const o=ac.createOscillator(); o.type='sine'; o.frequency.value=n[0]*h;
      const g=ac.createGain();
      const st=t+n[1];
      g.gain.setValueAtTime(0.0001,st);
      g.gain.linearRampToValueAtTime(0.13/(1+i*1.5),st+0.006);
      g.gain.exponentialRampToValueAtTime(0.0001,st+1.5-i*0.25);
      o.connect(g); g.connect(paBus); o.start(st); o.stop(st+1.6);
    });
  });
  if(paGain) paGain.gain.setTargetAtTime(0.9, t, 0.05);
}
/* ── and then somebody says it, and you do not catch a word ── */
const VOWELS=[[730,1090,2440],[530,1840,2480],[270,2290,3010],
              [570,840,2410],[300,870,2240],[640,1190,2390]];
function paVoice(delay){
  if(!ready) return;
  const t0=ac.currentTime+(delay||0);
  const src=ac.createOscillator(); src.type='sawtooth';
  const noi=noiseSrc(2,0.3);
  const ng=ac.createGain(); ng.gain.value=0.05;
  noi.connect(ng);
  const gate=ac.createGain(); gate.gain.value=0.0001;
  const F=[];
  for(let i=0;i<3;i++){
    const f=band('bandpass',700,7-i*1.6);
    const g=ac.createGain(); g.gain.value=[0.9,0.55,0.28][i];
    src.connect(f); ng.connect(f); f.connect(g); g.connect(gate);
    F.push(f);
  }
  gate.connect(paBus);
  const syl=13+(Math.random()*16|0);
  let t=t0, pitch=rnd(122,168);
  src.frequency.setValueAtTime(pitch,t0);
  for(let i=0;i<syl;i++){
    const v=VOWELS[(Math.random()*VOWELS.length)|0];
    const len=rnd(0.10,0.20);
    const last=(i===syl-1);
    pitch += last ? -rnd(14,26) : rnd(-7,7);
    pitch=clamp(pitch,96,196);
    src.frequency.setTargetAtTime(pitch,t,0.045);
    for(let k=0;k<3;k++) F[k].frequency.setTargetAtTime(v[k]*rnd(0.95,1.05),t,0.035);
    gate.gain.setTargetAtTime(rnd(0.55,1.0),t,0.022);
    gate.gain.setTargetAtTime(0.0001,t+len,0.030);
    t += len + (Math.random()<0.17 ? rnd(0.22,0.44) : rnd(0.035,0.085));
  }
  src.start(t0); src.stop(t+0.6); noi.start(t0); noi.stop(t+0.6);
  if(paGain){

  }
}

/* ── an upright somebody left out where anyone could use it ── */
function pianoNote(midi,when,amp,dur){
  if(!ready||!pianoBus) return;
  const f=mtof(midi);
  const o=ac.createOscillator();
  try{ o.setPeriodicWave(waves.piano); }catch(e){ o.type='triangle'; }
  o.frequency.value=f;
  const o2=ac.createOscillator(); o2.type='sine'; o2.frequency.value=f*2.0035;
  const g2=ac.createGain(); g2.gain.value=0.16;
  const lp=band('lowpass',Math.min(9000,f*11),0.9);
  lp.frequency.setValueAtTime(Math.min(9000,f*11),when);
  lp.frequency.exponentialRampToValueAtTime(Math.max(300,f*2.4),when+dur*0.7);
  const g=ac.createGain();
  g.gain.setValueAtTime(0.0001,when);
  g.gain.linearRampToValueAtTime(amp,when+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,when+dur);
  o.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); g.connect(pianoBus);
  o.start(when); o.stop(when+dur+0.05);
  o2.start(when); o2.stop(when+dur+0.05);
}
/* four bars that come round again, a little different each time */
const CHORDS=[[0,4,7,11],[-3,2,5,9],[-5,0,4,7],[2,5,9,12]];
let pnNext=0, pnStep=0;
function pianoPlay(){
  if(!ready||!pianoBus) return;
  const SPB=0.46;
  if(pnNext===0) pnNext=ac.currentTime+0.3;
  if(pnNext<ac.currentTime-1) pnNext=ac.currentTime+0.2;
  while(pnNext < ac.currentTime+0.7){
    const st=pnNext, bar=(pnStep>>3)%4, i=pnStep%8;
    const ch=CHORDS[bar];
    if(i===0){
      ch.forEach(function(n,k){
        pianoNote(ROOT+12+n, st+k*0.018, 0.055-k*0.006, rnd(3.4,4.6));
      });
      pianoNote(ROOT-12+ch[0], st, 0.075, 5.2);
    } else if(i%2===1 || Math.random()<0.5){
      const n=ch[(Math.random()*ch.length)|0] + (Math.random()<0.3?12:0);
      pianoNote(ROOT+24+n, st, rnd(0.030,0.055), rnd(2.2,3.4));
    }
    pnNext+=SPB; pnStep++;
  }
}

const uFogCol ={value:FOG_HALL.clone()};
const uFogNear={value:60}, uFogFar={value:280};
const SUN_DIR =new THREE.Vector3(-0.62,0.52,0.26).normalize();
const MOON_DIR=new THREE.Vector3(0.55,0.42,-0.30).normalize();

const uSunCol ={value:new THREE.Color(1,1,1)};
const uAmbCol ={value:new THREE.Color(1,1,1)};
const uSkyCol ={value:new THREE.Color(0.30,0.44,0.68)};
const uMoonCol={value:new THREE.Color(0,0,0)};
const uNight={value:0};
const uFill ={value:new THREE.Color(0.17,0.14,0.11)};  /* the lights are always on */

const uWet  ={value:0};

const uTimeG={value:0};

/* ── where daylight is allowed through the roof ──────────────
   Ten holes and one wall of glass. The shader traces every pixel
   back up the sun to see whether it can reach one of them, which
   is why a passenger walking under a skylight lights up.
   ──────────────────────────────────────────────────────────── */
const NAP=11;
const uAper ={value:new Float32Array(NAP*4)};   /* x, z, rx, rz */
const uRoofY={value:17.6};
const uWall ={value:new THREE.Vector4(96, 0, 52, 16)}; /* x, zc, zhalf, ytop */
const uSlat ={value:new THREE.Vector3(0.62,0.78,1.05)};/* dir.x, dir.z, frequency */

const SHARED=['uFogCol','uFogNear','uFogFar','uSun','uMoon','uSunCol','uSkyCol',
              'uAmbCol','uMoonCol','uNight','uWet','uRain','uBolt','uTime',
              'uLP','uLC','uAper','uRoofY','uWall','uSlat','uFill','uInAmb'];

/* ══════════════════════════════════════════════════════════════
   LAMPS
   ══════════════════════════════════════════════════════════════ */
const NL=QUAL.lights;
const uLP={value:new Float32Array(NL*4)};
const uLC={value:new Float32Array(NL*4)};
const LIGHTS=[];
function addLight(x,y,z,col,rad,o){
  o=o||{};
  const c=new THREE.Color(col);
  const L={ x:x, y:y, z:z, r:c.r, g:c.g, b:c.b, rad:rad,
            amp:o.amp===undefined?1:o.amp,
            night:o.night===undefined?0.4:o.night,
            flick:o.flick||0, ph:Math.random()*6.283,
            outside:!!o.outside, live:1 };
  LIGHTS.push(L); return L;
}
const _lo=[], _lk=[], _ld=[];
function packLights(t,outside){
  const nightK=Math.pow(uNight.value,0.62);
  let n=0;
  for(let i=0;i<LIGHTS.length;i++){
    const L=LIGHTS[i];
    if(L.live<=0.001) continue;
    let k=L.amp*L.live*(L.night>0 ? nightK*L.night+(1-L.night) : 1);
    if(L.flick>0){
      const f=Math.sin(t*7.3*L.flick+L.ph)*Math.sin(t*2.13*L.flick+L.ph*3.1);
      k*=1-L.flick*0.34*(0.5+0.5*f);
    }
    k*= L.outside ? (0.20+0.80*outside) : (1-0.62*outside);
    if(k<0.014) continue;
    const dx=L.x-cam.position.x, dy=L.y-cam.position.y, dz=L.z-cam.position.z;
    const d=dx*dx+dy*dy+dz*dz;
    const reach=L.rad+6;
    if(d>reach*reach) continue;
    _lo[n]=L; _lk[n]=k; _ld[n]=d; n++;
  }
  const P=uLP.value, C=uLC.value;
  for(let i=0;i<NL;i++){
    let bi=-1, bd=1e18;
    for(let j=i;j<n;j++) if(_ld[j]<bd){ bd=_ld[j]; bi=j; }
    if(bi<0){ P[i*4+3]=0; C[i*4]=C[i*4+1]=C[i*4+2]=0; continue; }
    const L=_lo[bi], k=_lk[bi];
    _lo[bi]=_lo[i]; _lk[bi]=_lk[i]; _ld[bi]=_ld[i];
    _lo[i]=L; _lk[i]=k; _ld[i]=bd;
    P[i*4]=L.x; P[i*4+1]=L.y; P[i*4+2]=L.z; P[i*4+3]=L.rad;
    C[i*4]=L.r*k; C[i*4+1]=L.g*k; C[i*4+2]=L.b*k; C[i*4+3]=1;
  }
}

/* ══════════════════════════════════════════════════════════════
   PS1 PIPELINE
   ══════════════════════════════════════════════════════════════ */
const allMats=[];
const PS1_VERT=[
  'uniform vec2 uRes; uniform float uJitter;',
  'uniform float uFogNear; uniform float uFogFar; uniform float uAff;',
  'varying vec2 vUv; varying float vW; varying float vFog;',
  'varying vec3 vN; varying vec3 vWP;',
  'void main(){',
  '  vec4 wp = modelMatrix * vec4(position,1.0);',
  '  vec4 mv = viewMatrix * wp;',
  '  vec4 cl = projectionMatrix * mv;',
  '  vec2 g = uRes*0.5;',
  '  cl.xy = mix(cl.xy, floor(cl.xy/cl.w*g + 0.5)/g*cl.w, uJitter);',
  '  vN = normalize(mat3(modelMatrix)*normal);',
  '  vWP = wp.xyz;',
  '  vFog = clamp((-mv.z-uFogNear)/(uFogFar-uFogNear),0.0,1.0);',
  '  vUv = mix(uv, uv*cl.w, uAff); vW = mix(1.0, cl.w, uAff);',
  '  gl_Position = cl;',
  '}'].join('\n');

const PS1_FRAG=[
  'uniform sampler2D uMap; uniform float uTime; uniform vec3 uFogCol;',
  'uniform vec3 uTint; uniform float uCut; uniform float uFlash; uniform float uGlow;',
  'uniform float uAlpha; uniform float uAmb;',
  'uniform vec3 uSun; uniform vec3 uMoon;',
  'uniform vec3 uSunCol; uniform vec3 uSkyCol; uniform vec3 uAmbCol; uniform vec3 uMoonCol;',
  'uniform float uNight; uniform float uWet; uniform float uRain; uniform float uBolt;',
  'uniform float uWetMax; uniform float uWin; uniform float uOut; uniform float uBounce;',
  'uniform float uStreak; uniform vec3 uFill; uniform float uInAmb;',
  'uniform vec4 uAper[NAPER]; uniform float uRoofY; uniform vec4 uWall; uniform vec3 uSlat;',
  'uniform vec4 uLP[NLIGHTS]; uniform vec4 uLC[NLIGHTS];',
  'varying vec2 vUv; varying float vW; varying float vFog;',
  'varying vec3 vN; varying vec3 vWP;',
  'float h21(vec2 p){',
  '  vec3 q = fract(vec3(floor(p).xyx)*vec3(0.1031,0.1030,0.0973));',
  '  q += dot(q, q.yzx+33.33);',
  '  return fract((q.x+q.y)*q.z);',
  '}',
  'float b2(vec2 a){ a=floor(a); return fract(dot(a, vec2(0.5, a.y*0.75))); }',
  'float b4(vec2 a){ return b2(0.5*a)*0.25 + b2(a); }',
  'void main(){',
  '  vec2 uv = vUv/vW;',
  '  vec4 tex = texture2D(uMap, uv);',
  '  if(uCut > 0.0 && tex.a < uCut) discard;',
  '  vec3 Nn = normalize(vN);',
  '  vec3 alb = tex.rgb * uTint;',
  '  float up = clamp(Nn.y, 0.0, 1.0);',
  '  /* only the platform ever gets rained on */',
  '  float wet = uWet*uWetMax*(0.26 + 0.74*up*up);',
  '  float pud = 0.0;',
  '  if(uWetMax > 0.5){',
  '    vec2 pc = vWP.xz*0.085;',
  '    float nn = h21(pc)*0.56 + h21(pc*2.13 + 19.0)*0.44;',
  '    pud = smoothstep(0.42, 0.84, nn)*smoothstep(0.88, 0.99, up)*uWet;',
  '  }',
  '  alb *= 1.0 - wet*0.40 - pud*0.26;',
  '  /* ── can the sun actually get here? ── */',
  '  float lit = uOut;',
  '  if(uOut < 0.5 && uSun.y > 0.004){',
  '    /* a very low sun throws its patches past the building',
  '       entirely, so the distance is capped rather than infinite */',
  '    float tUp = (uRoofY - vWP.y)/max(uSun.y, 0.06);',
  '    vec2 hit = vWP.xz + uSun.xz*tUp;',
  '    for(int i=0;i<NAPER;i++){',
  '      vec2 d = (hit - uAper[i].xy)/max(uAper[i].zw, vec2(0.001));',
  '      lit = max(lit, (1.0 - smoothstep(0.70,1.0,length(d)))*step(0.01,uAper[i].z));',
  '    }',
  '    /* and the slats lay their stripes over whatever it lands on */',
  '    float ph = dot(hit, uSlat.xy)*uSlat.z;',
  '    float st = fract(ph);',
  '    lit *= 0.40 + 0.60*smoothstep(0.10,0.34,st)*(1.0-smoothstep(0.66,0.90,st));',
  '    /* the wall of glass, whichever wall the sun is behind */',
  '    if(abs(uSun.x) > 0.02){',
  '      float tw = (uWall.x - vWP.x)/uSun.x;',
  '      if(tw > 0.0){',
  '        float hz = vWP.z + uSun.z*tw;',
  '        float hy = vWP.y + uSun.y*tw;',
  '        float inz = 1.0 - smoothstep(uWall.z*0.82, uWall.z, abs(hz-uWall.y));',
  '        float iny = (1.0-smoothstep(uWall.w*0.86,uWall.w,hy))*smoothstep(0.0,1.2,hy);',
  '        lit = max(lit, inz*iny*0.92);',
  '      }',
  '    }',
  '  }',
  '  /* ── the hour of the day ── */',
  '  float sd = max(dot(Nn, uSun), 0.0);',
  '  float md = max(dot(Nn, uMoon), 0.0);',
  '  vec3 light = uAmbCol*mix(uInAmb,1.0,uOut)*uAmb*(0.80 + 0.20*Nn.y)',
  '             + uSunCol*(1.0-uAmb)*sd*lit*mix(2.0,1.0,uOut)',
  '             + uMoonCol*(0.32 + 0.68*md)*max(lit,uOut);',
  '  /* timber gives back a lot of what falls on it */',
  '  light += uSunCol*uBounce*max(uSun.y,0.0)*(0.35+0.65*(1.0-up));',
  '  light += uFill*(1.0-uOut);',
  '  /* ── and every lamp near enough to matter ── */',
  '  vec3 V = normalize(cameraPosition - vWP);',
  '  vec3 Rv = reflect(-V, Nn);',
  '  vec3 lamp = vec3(0.0); vec3 gleam = vec3(0.0);',
  '  for(int i=0;i<NLIGHTS;i++){',
  '    float rr = uLP[i].w;',
  '    float on = step(0.001, rr);',
  '    vec3 dl = uLP[i].xyz - vWP;',
  '    float dd = length(dl);',
  '    float att = max(0.0, 1.0 - dd/max(rr,0.001));',
  '    float lam = 0.34 + 0.66*max(dot(Nn, dl/max(dd,0.001)), 0.0);',
  '    lamp += uLC[i].rgb*att*att*lam*on;',
  '    float sp = max(dot(Rv, dl/max(dd,0.001)), 0.0);',
  '    float s2 = sp*sp; float s4 = s2*s2; float s8 = s4*s4;',
  '    gleam += uLC[i].rgb*(s8*s4*1.7 + s2*sp*0.30)*att*on;',
  '  }',
  '  light += lamp;',
  '  vec3 col = alb * mix(light, vec3(1.0), uGlow);',
  '  if(uWin > 0.5){',
  '    vec2 cell = floor(uv*vec2(4.0,8.0)) + floor(vWP.xz*0.31);',
  '    float hs = h21(cell);',
  '    float on = step(0.42, hs)*(0.5 + 0.5*step(0.42, fract(hs*37.0 + floor(uTime*0.045))));',
  '    col += vec3(1.0,0.82,0.52)*on*uNight*0.80;',
  '  }',
  '  /* terrazzo is polished, and the platform is wet */',
  '  col += gleam*(pud*1.25 + wet*up*0.30 + uBounce*up*0.10);',
  '  col += uSkyCol*pud*0.40;',
  '  if(uRain > 0.02 && pud > 0.02){',
  '    vec2 g = vWP.xz*1.10;',
  '    vec2 gf = fract(g) - 0.5;',
  '    float ph2 = h21(floor(g));',
  '    float rt = fract(uTime*1.7 + ph2*7.0);',
  '    float dr = abs(length(gf) - rt*0.44);',
  '    col += (uSkyCol + gleam*0.6)*exp(-dr*dr*260.0)*(1.0-rt)*pud*uRain*0.95;',
  '  }',
  '  /* and the rain finds its way down the outside of the glass */',
  '  if(uStreak > 0.5 && uRain > 0.02){',
  '    float cl = floor(uv.x*44.0);',
  '    float sp = 0.35 + h21(vec2(cl,7.0))*1.5;',
  '    float yy = fract(uv.y*2.2 - uTime*sp - h21(vec2(cl,3.0))*9.0);',
  '    col += vec3(0.86,0.92,1.0)*exp(-yy*yy*30.0)*uRain*0.30;',
  '    col *= 1.0 - 0.14*uRain*h21(vec2(cl,11.0));',
  '  }',
  '  col += uFlash * vec3(1.0,0.86,0.6);',
  '  col += uBolt * vec3(0.70,0.76,0.96) * (0.30 + up*0.42 + sd*0.30) * max(lit,uOut);',
  '  col = mix(col, uFogCol, vFog*(1.0-uGlow));',
  '  float d = b4(gl_FragCoord.xy)/0.9375;',
  '  gl_FragColor = vec4(floor(col*31.0 + d)/31.0, tex.a*uAlpha);',
  '}'].join('\n')
      .replace(/NLIGHTS/g, String(NL))
      .replace(/NAPER/g, String(NAP));

function ps1(o){
  o=o||{};
  const uni={
    uMap:{value:o.map||null}, uRes:{value:new THREE.Vector2(320,240)},
    uTime:uTimeG, uJitter:{value:o.jitter===undefined?1:o.jitter},
    uFogCol:uFogCol, uTint:{value:o.tint||new THREE.Color(1,1,1)},
    uCut:{value:o.cutout===undefined?-1:o.cutout}, uFlash:{value:0},
    uFogNear:uFogNear, uFogFar:uFogFar,
    uSun:uSunDir, uMoon:uMoonDir, uSunCol:uSunCol, uSkyCol:uSkyCol,
    uAmbCol:uAmbCol, uMoonCol:uMoonCol,
    uAmb:{value:o.ambient===undefined?0.62:o.ambient},
    uGlow:{value:o.glow||0}, uNight:uNight,
    uWet:uWet, uRain:uRain, uBolt:uBolt,
    uWetMax:{value:o.wet===undefined?0:o.wet},
    uWin:{value:o.windows?1:0},
    uOut:{value:o.outdoor?1:0}, uStreak:{value:o.streak?1:0},
    uBounce:{value:o.bounce===undefined?0:o.bounce},
    uAper:uAper, uRoofY:uRoofY, uWall:uWall, uSlat:uSlat,
    uFill:uFill, uInAmb:uInAmb,
    uLP:uLP, uLC:uLC,
    uAff:{value:o.aff===undefined?1:o.aff}, uAlpha:{value:1}
  };
  const m=new THREE.ShaderMaterial({
    uniforms:uni, transparent:!!o.transparent,
    side:o.side||THREE.FrontSide,
    depthWrite:o.depthWrite===undefined?true:o.depthWrite,
    vertexShader:PS1_VERT, fragmentShader:PS1_FRAG
  });
  m.userData.uni=uni; allMats.push(m); return m;
}

  t.generateMipmaps=false; t.wrapS=t.wrapT=THREE.RepeatWrapping;
  return t;
}

function signTex(rows,wpx){
  wpx=wpx||256;
  const hpx=Math.max(64, rows.length*34+16);
  return tex(wpx,hpx,function(g,w,h){
    g.fillStyle='#1B4C8C'; g.fillRect(0,0,w,h);
    g.fillStyle='rgba(255,255,255,.10)'; g.fillRect(0,0,w,2);
    g.textBaseline='middle';
    rows.forEach(function(r,i){
      const y=14+i*34+8;
      const ar=r[0];
      g.fillStyle='#FFFFFF';
      /* the arrow, drawn rather than typed, so it is always there */
      const ax=16, ay=y, s=9;
      g.beginPath();
      if(ar==='up'){ g.moveTo(ax,ay-s); g.lineTo(ax+s*0.8,ay+s*0.2); g.lineTo(ax-s*0.8,ay+s*0.2); }
      else if(ar==='left'){ g.moveTo(ax-s,ay); g.lineTo(ax+s*0.2,ay-s*0.8); g.lineTo(ax+s*0.2,ay+s*0.8); }
      else { g.moveTo(ax+s,ay); g.lineTo(ax-s*0.2,ay-s*0.8); g.lineTo(ax-s*0.2,ay+s*0.8); }
      g.closePath(); g.fill();
      g.font='500 21px Helvetica, Arial, sans-serif';
      g.textAlign='left';
      g.fillText(r[1], 34, y+1);
    });
  });
}

/* ══════════════════════════════════════════════════════════════

   A whole day in about nine minutes. It opens late in the
   afternoon, because that is when this square is at its best, and
   the clock runs slow through the good light and quick through
   the small hours.
   ══════════════════════════════════════════════════════════════ */
const DAYLEN=10*60;
const MAXEL=1.13;                     /* how high it gets at noon, in radians */
/* The clock does not run evenly. It crawls whenever the sun is near
   the horizon, because that is the part worth watching, and hurries
   through the middle of the night, because that is not. */
function sunE(h){ return Math.sin(MAXEL*Math.cos((h-12)/12*Math.PI)); }
function hourRate(h){
  const e=sunE(h);
  const near=Math.exp(-(e/0.20)*(e/0.20));
  const deep=Math.max(0,-e-0.25)/0.75;
  return 0.42 + (1-near)*1.5 + deep*4.2;
}
const HBASE=(function(){
  let a=0; const N=480;
  for(let i=0;i<N;i++) a+=1/hourRate(i*24/N);
  return (a*24/N)/DAYLEN;                       /* hours per second */
})();

const DAYKEYS=[

 [-0.02,[0.720,0.360,0.256],[0.100,0.170,0.360],[1.00,0.40,0.20],0.95,[0.55,0.26,0.14],[0.400,0.360,0.420],[0.72,0.48,0.44],[0.240,0.200,0.280],0.32],
 [ 0.06,[0.980,0.660,0.380],[0.170,0.320,0.580],[1.00,0.58,0.26],1.00,[1.00,0.62,0.32],[0.620,0.580,0.600],[1.00,0.76,0.58],[0.400,0.340,0.400],0.07],

const _k3=[0,0,0];
function keyAt(e,out){
  let i=0;
  while(i<DAYKEYS.length-2 && DAYKEYS[i+1][0]<e) i++;
  const a=DAYKEYS[i], b=DAYKEYS[i+1];
  const k=Math.max(0,Math.min(1,(e-a[0])/(b[0]-a[0])));
  const sm=k*k*(3-2*k);
  for(let j=1;j<=9;j++){
    if(j===4 || j===9){ out[j]=a[j]+(b[j]-a[j])*sm; continue; }
    _k3[0]=a[j][0]+(b[j][0]-a[j][0])*sm;
    _k3[1]=a[j][1]+(b[j][1]-a[j][1])*sm;
    _k3[2]=a[j][2]+(b[j][2]-a[j][2])*sm;
    out[j]=[_k3[0],_k3[1],_k3[2]];

const SKY={
  h:15.05, e:0, run:1,
  shootT:rnd(20,60), shootK:0,
  setDir:function(v,hh,bias){
    const u=(hh-12)/12*Math.PI;
    const el=MAXEL*Math.cos(u)+(bias||0);
    const ce=Math.cos(el);
    v.set(-Math.sin(u)*ce, Math.sin(el), -Math.cos(u)*ce).normalize();
    return Math.sin(el);

  update:function(dt){
    this.h=(this.h + dt*HBASE*hourRate(this.h)*this.run)%24;
    if(this.h<0) this.h+=24;
    this.e=this.setDir(SUN_DIR, this.h, 0);
    /* the moon keeps its own hours, a little behind and off to one side */
    this.setDir(MOON_DIR, (this.h+12.7)%24, 0.18);

    uZenith.value.setRGB(K[2][0],K[2][1],K[2][2]);

/* ══════════════════════════════════════════════════════════════
   THE WEATHER
   You do not get a say in it. You watch it through the glass and
   find out from the board whether it is going to cost you.
   ══════════════════════════════════════════════════════════════ */
const WXSET=[
  { cloud:0.20, rain:0.00, wind:0.16, name:'clear over the Columbia' },
  { cloud:0.78, rain:0.42, wind:0.42, name:'rain moving in' },
  { cloud:0.99, rain:1.00, wind:0.95, name:'ground stop weather' }
];
const WX={
  mode:0, cloud:0.20, rain:0, wet:0, wind:0.16, gust:0, gph:0,
  boltQ:0, nextBolt:9, rainbow:0, rainbowT:0, hadRain:0, delayed:0,
  drift:rnd(90,170),
  set:function(m,quiet){
    m=((m%3)+3)%3;
    if(m===this.mode) return;
    this.mode=m;
    if(!quiet) flashName(WXSET[m].name, ['#CFE4F2','#AFC0CC','#8FA4C4'][m]);
    /* the board finds out before you do */
    const d=(m===2)?1:0;
    if(d!==this.delayed){ this.delayed=d; boardDraw(d); }
  },
  update:function(dt,t){
    const TG=WXSET[this.mode];
    this.cloud += (TG.cloud-this.cloud)*Math.min(1,dt*0.22);
    this.rain  += (TG.rain -this.rain )*Math.min(1,dt*0.16);
    this.wind  += (TG.wind -this.wind )*Math.min(1,dt*0.30);
    this.gph += dt*(0.35+this.wind*0.9);
    this.gust = 0.55+0.45*Math.sin(this.gph)*Math.sin(this.gph*0.37+1.2);
    const w=this.wind*(0.55+0.75*this.gust);
    const want=Math.min(1,this.rain*1.35);
    if(want>this.wet) this.wet+=Math.min(want-this.wet, dt*0.075);
    else              this.wet-=Math.min(this.wet-want, dt*0.030);
    uCloud.value=this.cloud;
    uWet.value=this.wet;
    uRain.value=this.rain;
    uCloudOff.value.x += dt*(0.010+w*0.055);
    uCloudOff.value.y += dt*(0.004+w*0.018);
    if(this.boltQ>0){
      this.boltQ-=dt*7.0;
      uBolt.value=Math.max(0,this.boltQ)*(Math.random()<0.35?0.35:1)*0.9;
    } else uBolt.value=0;
    if(this.rain>0.62){
      this.nextBolt-=dt;
      if(this.nextBolt<=0){
        const near=Math.random()<0.3;
        this.boltQ=near?1.5:0.85;
        this.nextBolt=rnd(near?10:6, near?28:16);
        (function(n){ setTimeout(function(){ thunder(n); }, n?rnd(300,900):rnd(2400,5200)); })(near);
      }
    } else { this.nextBolt=rnd(6,13); }
    if(this.rain>0.35) this.hadRain=1;
    if(this.hadRain && this.rain<0.10){
      this.hadRain=0;
      if(SKY.e>0.02 && SKY.e<0.60 && this.rainbowT<=0) this.rainbowT=34;
    }
    if(this.rainbowT>0){
      this.rainbowT-=dt;
      const k=Math.min(1,(34-this.rainbowT)/3.5)*Math.min(1,this.rainbowT/7);
      this.rainbow+=(k-this.rainbow)*Math.min(1,dt*1.6);
    } else this.rainbow+=(0-this.rainbow)*Math.min(1,dt*0.8);
    uRainbow.value=this.rainbow*(0.55+0.45*Math.min(1,this.wet*2.5));
    this.drift-=dt;
    if(this.drift<=0){
      this.drift=rnd(150,300);
      const r=Math.random();
      this.set(r<0.44?0:(r<0.76?1:2));
    }
    return w;
  }
};
function thunder(near){
  if(!ready) return;
  const t=ac.currentTime+0.02;
  const dur=near?4.2:6.0;
  const n=Math.floor(ac.sampleRate*dur), b=ac.createBuffer(1,n,ac.sampleRate);
  const d=b.getChannelData(0); let last=0;
  for(let i=0;i<n;i++){
    last=last*0.9875+(Math.random()*2-1)*0.0125;
    const k=i/n;
    d[i]=last*20*Math.pow(1-k,1.5)*(0.30+0.70*Math.abs(Math.sin(k*11.0+Math.sin(k*29.0)*1.6)));
  }
  const src=ac.createBufferSource(); src.buffer=b;
  const lp=band('lowpass',near?520:150,0.7);
  const g=ac.createGain(); g.gain.value=near?0.75:0.48;
  src.connect(lp); lp.connect(g); g.connect(master);
  const rv=ac.createGain(); rv.gain.value=0.5; g.connect(rv); rv.connect(hallVerb);
  src.start(t);
}

/* ══════════════════════════════════════════════════════════════
   RAIN
   A box of it that travels with you. Four roofs are cut out of it,
   so it stops at the glass and starts again past the doors.
   ══════════════════════════════════════════════════════════════ */
const SHELTER=[
  [  8.0,  0.0, 104.0, 58.0],   /* nine acres of Oregon timber      */
  [120.0,  0.0,   9.0, 26.0],   /* the platform canopy              */
  [ 99.0,  0.0,   7.0, 42.0],   /* the overhang past the doors      */
  [-96.0,  0.0,  14.0, 40.0]    /* the concourse portals            */
];
const SHELTOP=new THREE.Vector4(19.6, 7.4, 9.4, 12.0);
const RAIN=(function(){
  const N=QUAL.rain, BOX=new THREE.Vector3(84,34,84);
  const pos=new Float32Array(N*6), aR=new Float32Array(N*2), aE=new Float32Array(N*2);
  for(let i=0;i<N;i++){
    const x=rnd(-42,42), y=rnd(-17,17), z=rnd(-42,42), r=Math.random();
    for(let k=0;k<2;k++){
      const o=(i*2+k)*3;
      pos[o]=x; pos[o+1]=y; pos[o+2]=z;
      aR[i*2+k]=r; aE[i*2+k]=k;
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aR',new THREE.BufferAttribute(aR,1));
  g.setAttribute('aE',new THREE.BufferAttribute(aE,1));
  const shel=new Float32Array(16);
  for(let i=0;i<4;i++){
    shel[i*4]=SHELTER[i][0]; shel[i*4+1]=SHELTER[i][1];
    shel[i*4+2]=SHELTER[i][2]; shel[i*4+3]=SHELTER[i][3];
  }
  const uni={
    uCam:{value:new THREE.Vector3()}, uBox:{value:BOX}, uT:{value:0},
    uWind:{value:new THREE.Vector2(0.3,0.1)}, uAmt:{value:0},
    uLen:{value:1.5}, uCol:{value:new THREE.Color(0.80,0.86,0.94)},
    uShel:{value:shel}, uShelT:{value:SHELTOP}
  };
  const m=new THREE.ShaderMaterial({
    uniforms:uni, transparent:true, depthWrite:false,
    vertexShader:[
      'attribute float aR; attribute float aE;',
      'uniform vec3 uCam; uniform vec3 uBox; uniform float uT;',
      'uniform vec2 uWind; uniform float uAmt; uniform float uLen;',
      'uniform vec4 uShel[4]; uniform vec4 uShelT;',
      'varying float vA;',
      'void main(){',
      '  vec3 hf = uBox*0.5;',
      '  vec3 p = position;',
      '  p.y -= uT*(15.0+aR*13.0);',
      '  p.xz += uWind*uT*(2.2+aR*2.4);',
      '  p = mod(p - uCam + hf, uBox) - hf + uCam;',
      '  float a = uAmt;',
      '  vec4 tops = uShelT;',
      '  for(int i=0;i<4;i++){',
      '    vec2 d = abs(p.xz - uShel[i].xy) - uShel[i].zw;',
      '    float in2 = (1.0-step(0.0,d.x))*(1.0-step(0.0,d.y));',
      '    float top = i==0 ? tops.x : (i==1 ? tops.y : (i==2 ? tops.z : tops.w));',
      '    a *= 1.0 - in2*(1.0 - step(top, p.y));',
      '  }',
      '  vec3 dir = normalize(vec3(uWind.x*0.42, -1.0, uWind.y*0.42));',
      '  vec3 wp = p + dir*uLen*(0.5+aR*1.0)*aE;',
      '  vec4 mv = viewMatrix*vec4(wp,1.0);',
      '  float d2 = -mv.z;',
      '  a *= smoothstep(1.2,4.5,d2)*(1.0-smoothstep(30.0,44.0,d2));',
      '  vA = a*(0.30+aR*0.70);',
      '  gl_Position = projectionMatrix*mv;',
      '}'].join('\n'),
    fragmentShader:[
      'uniform vec3 uCol; varying float vA;',
      'void main(){ if(vA<0.006) discard; gl_FragColor=vec4(uCol, vA*0.55); }'
    ].join('\n')
  });
  const mesh=new THREE.LineSegments(g,m);
  mesh.frustumCulled=false; mesh.renderOrder=8; mesh.visible=false;
  scene.add(mesh);
  return { mesh:mesh, uni:uni };
})();

/* ══════════════════════════════════════════════════════════════
   THE ROOF
   Nine acres of it. The slats run the short way and would be
   straight, except that eleven holes have been pushed through
   them, and everything near a hole has had to go round.
   ══════════════════════════════════════════════════════════════ */
const HALL={ x0:-98, x1:98, z0:-52, z1:52 };
const ROOF={ x0:-102, x1:102, z0:-57, z1:57 };
const SKYL=[
  {x: 58, z:  0, rx:15.0, rz:10.5, lift:2.6, oculus:true},
  {x: 20, z: -2, rx:12.0, rz: 8.0, lift:1.9},
  {x:-20, z:  3, rx:12.0, rz: 8.0, lift:1.9},
  {x:-58, z: -1, rx:11.0, rz: 7.5, lift:1.7},
  {x: 40, z: 32, rx: 9.0, rz: 6.0, lift:1.4},
  {x: 40, z:-32, rx: 9.0, rz: 6.0, lift:1.4},
  {x:  0, z: 34, rx: 9.0, rz: 6.0, lift:1.4},
  {x:  0, z:-34, rx: 9.0, rz: 6.0, lift:1.4},
  {x:-42, z: 32, rx: 8.0, rz: 5.5, lift:1.3},
  {x:-42, z:-32, rx: 8.0, rz: 5.5, lift:1.3},
  {x:-80, z:  0, rx: 8.5, rz: 6.0, lift:1.3}
];
const INF=3.1;                 /* how far out a hole still bends things */
SKYL.forEach(function(S,i){
  uAper.value[i*4]=S.x; uAper.value[i*4+1]=S.z;
  uAper.value[i*4+2]=S.rx*0.94; uAper.value[i*4+3]=S.rz*0.94;
});
uSlat.value.set(1,0,1/QUAL.slatGap);

function roofY(x,z){
  let y = 17.6
    + Math.sin(x*0.0295)*2.05
    + Math.cos(z*0.0520)*1.45
    + Math.sin(x*0.0190 + z*0.0310)*0.95;
  for(let i=0;i<SKYL.length;i++){
    const S=SKYL[i];
    const dx=(x-S.x)/S.rx, dz=(z-S.z)/S.rz;
    const r=Math.sqrt(dx*dx+dz*dz);
    if(r<2.4) y += S.lift*(1-r/2.4)*(1-r/2.4);
  }
  return y;
}
uRoofY.value=17.6;

/* push a point out of every hole it happens to be inside */
const _w={x:0,z:0,ok:true};
function warp(x,z){
  let ok=true;
  for(let i=0;i<SKYL.length;i++){
    const S=SKYL[i];
    let dx=(x-S.x)/S.rx, dz=(z-S.z)/S.rz;
    const r=Math.sqrt(dx*dx+dz*dz);
    if(r>=INF) continue;
    if(r<0.26){ ok=false; break; }          /* dead centre: the slat just stops */
    const nr=Math.sqrt(r*r+1.0);
    const t=r/INF, sm=t*t*(3-2*t);
    const k=(nr*(1-sm)+r*sm)/r;
    x = S.x + dx*k*S.rx;
    z = S.z + dz*k*S.rz;
  }
  _w.x=x; _w.z=z; _w.ok=ok; return _w;
}

/* ── a slat is a long thin ribbon with a bottom and two sides ── */
function ribbon(runs, halfW, depth){
  let segs=0;
  for(let i=0;i<runs.length;i++) segs += Math.max(0, runs[i].length/3 - 1);
  const V=segs*18;
  const pos=new Float32Array(V*3), nor=new Float32Array(V*3), uvs=new Float32Array(V*2);
  let o=0, uo=0;
  const nx=[0,0,0];
  function put(x,y,z, a,b,c, u,v){
    pos[o]=x; pos[o+1]=y; pos[o+2]=z;
    nor[o]=a; nor[o+1]=b; nor[o+2]=c;
    uvs[uo]=u; uvs[uo+1]=v;
    o+=3; uo+=2;
  }
  function quad(p0,p1,p2,p3, a,b,c, u0,u1){
    put(p0[0],p0[1],p0[2],a,b,c,u0,0); put(p1[0],p1[1],p1[2],a,b,c,u0,1);
    put(p2[0],p2[1],p2[2],a,b,c,u1,1);
    put(p0[0],p0[1],p0[2],a,b,c,u0,0); put(p2[0],p2[1],p2[2],a,b,c,u1,1);
    put(p3[0],p3[1],p3[2],a,b,c,u1,0);
  }
  for(let ri=0;ri<runs.length;ri++){
    const P=runs[ri], n=P.length/3;
    if(n<2) continue;
    let dist=0;
    for(let i=0;i<n-1;i++){
      const ax=P[i*3], ay=P[i*3+1], az=P[i*3+2];
      const bx=P[(i+1)*3], by=P[(i+1)*3+1], bz=P[(i+1)*3+2];
      let tx=bx-ax, tz=bz-az;
      const tl=Math.hypot(tx,tz)||1; tx/=tl; tz/=tl;
      nx[0]=tz; nx[2]=-tx;
      const u0=dist/2.4; dist+=tl; const u1=dist/2.4;
      const lax=ax+nx[0]*halfW, laz=az+nx[2]*halfW;
      const rax=ax-nx[0]*halfW, raz=az-nx[2]*halfW;
      const lbx=bx+nx[0]*halfW, lbz=bz+nx[2]*halfW;
      const rbx=bx-nx[0]*halfW, rbz=bz-nx[2]*halfW;
      const ayb=ay-depth, byb=by-depth;
      /* the face you actually look at */
      quad([lax,ayb,laz],[lbx,byb,lbz],[rbx,byb,rbz],[rax,ayb,raz], 0,-1,0, u0,u1);
      /* and the two you see when you look along it */
      quad([lax,ayb,laz],[lax,ay,laz],[lbx,by,lbz],[lbx,byb,lbz], nx[0],0,nx[2], u0,u1);
      quad([rax,ayb,raz],[rbx,byb,rbz],[rbx,by,rbz],[rax,ay,raz], -nx[0],0,-nx[2], u0,u1);
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal',  new THREE.BufferAttribute(nor,3));
  g.setAttribute('uv',      new THREE.BufferAttribute(uvs,2));
  return g;
}

const roofMats=[
  ps1({map:tiled(T.timber,1,1),   ambient:0.68, bounce:0.44, jitter:0.5}),
  ps1({map:tiled(T.timberLt,1,1), ambient:0.70, bounce:0.48, jitter:0.5}),
  ps1({map:tiled(T.timberDk,1,1), ambient:0.64, bounce:0.38, jitter:0.5})
];
(function slats(){
  const GAP=QUAL.slatGap, STEP=QUAL.slatStep;
  const buckets=[[],[],[]];
  let k=0;
  for(let x=ROOF.x0; x<=ROOF.x1; x+=GAP){
    const runs=[]; let cur=[];
    for(let z=ROOF.z0; z<=ROOF.z1; z+=STEP){
      const p=warp(x,z);
      if(!p.ok){ if(cur.length>=6) runs.push(cur); cur=[]; continue; }
      cur.push(p.x, roofY(p.x,p.z), p.z);
    }
    if(cur.length>=6) runs.push(cur);
    if(runs.length) buckets[k%3].push(runs);
    k++;
  }
  buckets.forEach(function(b,i){
    const all=[];
    b.forEach(function(runs){ runs.forEach(function(r){ all.push(r); }); });
    if(!all.length) return;
    const m=new THREE.Mesh(ribbon(all, 0.14+i*0.012, 0.46+ (i===1?0.10:0)), roofMats[i]);
    m.frustumCulled=false; scene.add(m);
  });
})();

/* ── the dark it all hangs from, with the holes cut out ── */
(function plenum(){
  const STEP=4.0;
  const items=[];
  const g0=new THREE.PlaneGeometry(STEP,STEP);
  for(let x=ROOF.x0; x<ROOF.x1; x+=STEP){
    for(let z=ROOF.z0; z<ROOF.z1; z+=STEP){
      const cx=x+STEP/2, cz=z+STEP/2;
      let hole=false;
      for(let i=0;i<SKYL.length;i++){
        const S=SKYL[i];
        const dx=(cx-S.x)/(S.rx*1.02), dz=(cz-S.z)/(S.rz*1.02);
        if(dx*dx+dz*dz < 1){ hole=true; break; }
      }
      if(hole) continue;
      items.push({geo:g0, m:mat(cx, roofY(cx,cz)+0.22, cz, Math.PI/2, 0, 0)});
    }
  }
  bake(items, ps1({map:tiled(T.plenum,1,1), ambient:0.30, jitter:0.4}));
})();

/* ── the oculus: a drum of slats standing on the roof, and a

const OC=SKYL[0];
(function oculus(){

/* ══════════════════════════════════════════════════════════════
   THE FLOOR
   Terrazzo, poured with the rivers running through it.
   ══════════════════════════════════════════════════════════════ */
function flatStrip(pts, halfW, y, uScale){
  const n=pts.length/2;
  const V=(n-1)*6;
  const pos=new Float32Array(V*3), nor=new Float32Array(V*3), uvs=new Float32Array(V*2);
  let o=0, uo=0, dist=0;
  function put(x,z,u,v){
    pos[o]=x; pos[o+1]=y; pos[o+2]=z;
    nor[o]=0; nor[o+1]=1; nor[o+2]=0;
    uvs[uo]=u; uvs[uo+1]=v; o+=3; uo+=2;
  }
  for(let i=0;i<n-1;i++){
    const ax=pts[i*2], az=pts[i*2+1], bx=pts[(i+1)*2], bz=pts[(i+1)*2+1];
    let tx=bx-ax, tz=bz-az; const tl=Math.hypot(tx,tz)||1; tx/=tl; tz/=tl;
    const nx=tz, nz=-tx;
    const u0=dist/uScale; dist+=tl; const u1=dist/uScale;
    put(ax+nx*halfW, az+nz*halfW, u0,0); put(bx+nx*halfW, bz+nz*halfW, u1,0);
    put(bx-nx*halfW, bz-nz*halfW, u1,1);
    put(ax+nx*halfW, az+nz*halfW, u0,0); put(bx-nx*halfW, bz-nz*halfW, u1,1);
    put(ax-nx*halfW, az-nz*halfW, u0,1);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal',  new THREE.BufferAttribute(nor,3));
  g.setAttribute('uv',      new THREE.BufferAttribute(uvs,2));
  return g;
}
function slab(w,d,x,z,y,m,sx,sy){
  const s=new THREE.Mesh(new THREE.PlaneGeometry(w,d,sx||1,sy||1),m);
  s.rotation.x=-Math.PI/2; s.position.set(x,y||0,z); scene.add(s); return s;
}
slab(700,700,0,0,-0.02, ps1({map:tiled(T.concrete,120,120), ambient:0.62, aff:0, jitter:0.3,
                             outdoor:true, wet:0.9}), 40,40);
slab(212,116,0,0,0.0, ps1({map:tiled(T.terrazzo,52,29), ambient:0.66, aff:0, jitter:0.3,
                           bounce:0.09}), 34,20);
(function rivers(){
  const rm=ps1({map:tiled(T.river,1,1), cutout:0.05, transparent:true,
                ambient:0.8, aff:0, depthWrite:false, jitter:0.3});

  for(let k=0;k<5;k++){

    const g=flatStrip(pts, 2.6+k*0.4, 0.012, 26);
    const mm=new THREE.Mesh(g,rm); mm.frustumCulled=false; mm.renderOrder=1; scene.add(mm);
  }
})();

const steelMat=ps1({map:tiled(T.steel,1,3), ambient:0.62});

const COLS=[];
(function yColumns(){

  [-70,-34,4,40,74].forEach(function(x){

function Lane(pts){ this.p=pts; this.len=[]; let L=0;
  for(let i=1;i<pts.length;i++){ L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
    this.len.push(L); }
  this.total=L;
}
Lane.prototype.at=function(s){
  s=Math.max(0,Math.min(this.total,s));
  let i=0; while(i<this.len.length-1 && this.len[i]<s) i++;
  const a=this.p[i], b=this.p[i+1], s0=i?this.len[i-1]:0, seg=this.len[i]-s0;
  const t=seg>0?(s-s0)/seg:0;
  return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, Math.atan2(b[0]-a[0],b[1]-a[1])];
};

  this.g.rotation.y=head;
  this.travel+=this.speed*dt;
  const R=this.g.userData_rig;
  const sw=Math.sin(this.travel*3.4)*Math.min(1,this.speed*0.55);
  R.legs[0].rotation.x= sw;  R.legs[1].rotation.x=-sw;

      }
    }
  }
};

function collide(p){
  for(let i=0;i<BOXES.length;i++){
    const b=BOXES[i];
    const dx=p.x-b[0], dz=p.z-b[1];
    const ex=b[2]+0.42, ez=b[3]+0.42;
    if(Math.abs(dx)<ex && Math.abs(dz)<ez){
      const px=ex-Math.abs(dx), pz=ez-Math.abs(dz);
      if(px<pz) p.x += (dx<0?-1:1)*px;
      else      p.z += (dz<0?-1:1)*pz;
    }
  }
  for(let i=0;i<CIRC.length;i++){
    const c=CIRC[i];
    const dx=p.x-c.x, dz=p.z-c.z;
    const d=Math.hypot(dx,dz), rr=c.r+0.42;
    if(d<rr){
      if(d>0.0001){ p.x=c.x+dx/d*rr; p.z=c.z+dz/d*rr; }
      else{ p.x=c.x+rr; p.z=c.z; }
    }
  }
}

  if(keys['a']||keys['arrowleft']) ix-=1;
  if(keys['d']||keys['arrowright'])ix+=1;
  const mag=Math.min(1,Math.hypot(ix,iy));
  if(mag>0.04 && !boarding){
    const sp=12.5*dt*mag, den=Math.hypot(ix,iy)||1;
    const nx=ix/den, ny=iy/den;
    const fx=-Math.sin(yaw), fz=-Math.cos(yaw);
    const rx= Math.cos(yaw), rz=-Math.sin(yaw);
    cam.position.x+=(fx*(-ny)+rx*nx)*sp;
    cam.position.z+=(fz*(-ny)+rz*nx)*sp;
    bob+=sp*0.9;
  }
  collide(cam.position);
  cam.position.x=clamp(cam.position.x,-94,130);
  cam.position.z=clamp(cam.position.z,-49,49);
  cam.position.y=2.3+Math.sin(bob*1.9)*0.055*mag;
  cam.rotation.y=yaw; cam.rotation.x=pitch;
  sky.position.copy(cam.position);

  /* your own shoes, which this floor is very pleased about */
  if(ready && mag>0.25){
    const ph=Math.sin(bob*1.9);
    if(ph<-0.6 && lastStep>0){ step(outside<0.5); lastStep=-1; }
    if(ph>0.2) lastStep=1;
  }

  SKY.update(dt);
  const wind=WX.update(dt,t);
  /* the sun rises over the curb and sets over the airfield */
  uWall.value.x = SUN_DIR.x>0 ? 96 : -96;

  /* in or out — the doors are at x = 98 */
  const want = cam.position.x>100 ? 1 : 0;
  outside += (want-outside)*Math.min(1,dt*2.6);

  /* the hall's own haze, and the sky's, crossfaded at the door */
  _sk.copy(uHorizon.value).lerp(uZenith.value,0.45);
  const wash=0.32*(1-uNight.value);
  _sk.setRGB(_sk.r+(1-_sk.r)*wash, _sk.g+(1-_sk.g)*wash, _sk.b+(1-_sk.b)*wash);
  _sk.lerp(uCloudDrk.value, WX.cloud*0.42+WX.rain*0.26);
  _fog.setRGB(0.30+_sk.r*0.30, 0.25+_sk.g*0.26, 0.19+_sk.b*0.24);
  _fog.lerp(_sk, outside);
  uFogCol.value.copy(_fog);
  const vis=1-WX.rain*0.55-WX.cloud*0.09;
  uFogNear.value=44*(1-outside)+(30+50*vis)*outside;
  uFogFar.value =300*(1-outside)+(150+370*vis)*outside;
  renderer.setClearColor(uFogCol.value,1);
  /* the interior is lit whatever the sky is doing; it just gets
     relatively warmer as the daylight goes */
  const nk=uNight.value;
  uFill.value.setRGB(0.150+nk*0.075, 0.120+nk*0.058, 0.092+nk*0.040);
  uInAmb.value=0.60-nk*0.16;
  roomEl.style.opacity=(outside*(0.34+nk*0.34)).toFixed(3);

  packLights(t, outside);
  for(let i=0;i<GLOWERS.length;i++){
    const G=GLOWERS[i];
    G.u.uGlow.value=Math.min(1, G.a + G.b*nk);
  }
  /* the skylights are whatever colour the sky is */
  const sb=clamp(0.30+Math.max(0,SKY.e)*1.15,0.10,1.35)*(1-WX.cloud*0.30);
  for(let i=0;i<skyPanes.length;i++){
    const P=skyPanes[i];
    P.m.uTint.value.setRGB(
      clamp((uHorizon.value.r*0.45+uZenith.value.r*0.55)*sb*2.1+nk*0.06,0,2),
      clamp((uHorizon.value.g*0.45+uZenith.value.g*0.55)*sb*2.1+nk*0.06,0,2),
      clamp((uHorizon.value.b*0.45+uZenith.value.b*0.55)*sb*2.1+nk*0.08,0,2));
    P.m.uAlpha.value=clamp(0.20+sb*0.22,0.14,0.52);
  }

  /* rain, which only exists past the glass */
  RAIN.mesh.visible=WX.rain>0.012;
  if(RAIN.mesh.visible){
    RAIN.uni.uT.value=t;
    RAIN.uni.uCam.value.set(cam.position.x, cam.position.y+7, cam.position.z);
    RAIN.uni.uAmt.value=Math.min(1,WX.rain*1.15);
    RAIN.uni.uLen.value=0.9+WX.rain*1.5;
    RAIN.uni.uWind.value.set(Math.cos(0.7)*wind*2.2, Math.sin(0.7)*wind*2.2);
    RAIN.uni.uCol.value.setRGB(
      Math.min(1,uAmbCol.value.r*0.55+uSkyCol.value.r*0.7+0.20),
      Math.min(1,uAmbCol.value.g*0.55+uSkyCol.value.g*0.7+0.22),
      Math.min(1,uAmbCol.value.b*0.55+uSkyCol.value.b*0.7+0.26));
  }

  /* ── the train ── */
  (function(){
    const M=TRAIN;
    if(M.state==='run'){
      M.v+=(15-M.v)*Math.min(1,dt*0.5);
      if(M.z>PLAT_Z-40) M.state='brake';
    } else if(M.state==='brake'){
      /* brake against the distance left, so it always lands on the mark */
      const rem=PLAT_Z-M.z;
      M.v=Math.min(M.v, Math.max(0, rem*0.85+0.12));
      if(rem<=0.12){
        M.z=PLAT_Z; M.v=0; M.state='dwell'; M.timer=17;
        _tp.set(TRACK_X,3,PLAT_Z); maxChime(_tp);
      }
    } else if(M.state==='dwell'){
      M.timer-=dt;
      if(M.timer<=0){ M.state='leave'; _tp.set(TRACK_X,3,M.z); maxChime(_tp); }
    } else {
      M.v+=(17-M.v)*Math.min(1,dt*0.45);
      if(M.z>250){ M.z=-230; M.v=0; M.state='run'; }
    }
    if(ready){
      M.bell-=dt;
      const coming=(M.state==='run'||M.state==='brake') && M.z>PLAT_Z-170 && M.z<PLAT_Z-6;
      const going =(M.state==='leave') && M.z<PLAT_Z+120;
      if((coming||going) && M.bell<=0){ crossingBell(TRACK_X, M.z); M.bell=coming?1.2:1.4; }
    }
    M.z+=M.v*dt;
    M.g.position.z=M.z; M.hit.position.set(TRACK_X,2.6,M.z);
    const lead=(M.state==='leave')?1:-1;
    M.lampA.z=M.z+lead*30; M.lampB.z=M.z-lead*30;
    if(railGain){
      railGain.gain.setTargetAtTime(Math.min(0.16,M.v*0.012), ac.currentTime, 0.2);
      _tp.set(TRACK_X,2,M.z); movePan(railPan,_tp);
    }
  })();

  agents.forEach(function(a){ a.update(dt); });
  sitters.forEach(function(s){ s.g.rotation.y=s.base+Math.sin(t*s.spd+s.ph)*0.05; });
  standers.forEach(function(s){
    s.g.rotation.y=s.base+Math.sin(t*0.4+s.ph)*0.07;
    s.g.position.y=Math.sin(t*0.8+s.ph)*0.012;
    const R2=s.g.userData_rig;
    R2.arms[0].rotation.x=Math.sin(t*0.6+s.ph)*0.05;
    R2.arms[1].rotation.x=Math.sin(t*0.6+s.ph+2)*0.05;
  });
  /* indoors the trees only move because of the air handling */
  const gust=0.006+wind*0.10*WX.gust;
  trees.forEach(function(T2){
    const out=T2.g.position.x<-100?1:0;
    T2.g.rotation.z=Math.sin(t*(0.5+wind*1.6)+T2.ph)*(out?gust*2.6:0.008);
  });
  puffs.forEach(function(p){
    if(!p.m.visible) return;
    p.t+=dt;
    const k=p.t/p.life;
    if(k>=1){ p.m.visible=false; return; }
    p.m.position.y+=dt*0.7;
    const s=p.s*(0.6+k*1.8); p.m.scale.set(s,s,1);
    p.m.quaternion.copy(cam.quaternion);
    p.m.material.userData.uni.uAlpha.value=(1-k)*(1-k)*0.5;
  });

  /* ── what you can hear ── */
  if(ready){
    const now=ac.currentTime;
    hallLP.frequency.setTargetAtTime(15000-outside*13200, now, 0.14);
    hallGain.gain.setTargetAtTime(1-outside*0.62, now, 0.3);
    outLP.frequency.setTargetAtTime(15000-(1-outside)*12600, now, 0.14);
    outGain.gain.setTargetAtTime(0.30+outside*0.70, now, 0.3);
    hvacGain.gain.setTargetAtTime(0.10*(1-outside*0.5), now, 0.4);
    crowdGain.gain.setTargetAtTime((0.050-nk*0.020)*(1-outside*0.55), now, 0.5);
    pianoBus.gain.setTargetAtTime(nk>0.9?0.0001:0.30*(1-outside*0.9), now, 0.8);
    const rn=WX.rain;
    rainLo.gain.setTargetAtTime(Math.max(0.0001, rn*0.13*(0.28+0.72*outside)), now, 0.7);
    rainHi.gain.setTargetAtTime(Math.max(0.0001, rn*rn*0.062*outside), now, 0.7);
    canopyGain.gain.setTargetAtTime(
      Math.max(0.0001, rn*0.085*outside*clamp(1-Math.abs(cam.position.x-118)/22,0,1)), now, 0.5);
    windGain.gain.setTargetAtTime(
      Math.max(0.0001,(0.008+WX.wind*0.060*WX.gust)*(0.2+0.8*outside)), now, 0.9);
    roadGain.gain.setTargetAtTime(Math.max(0.0001,0.032*outside), now, 0.6);
    escGain.gain.setTargetAtTime(0.030*(1-outside*0.8), now, 0.5);
    if(nk<0.92 && outside<0.6) pianoPlay();
    /* one pair of wheels, whichever pair is closest */
    nextClack-=dt;
    if(nextClack<=0){
      nextClack=1.4;
      let best=null, bd=1e9;
      for(let i=0;i<agents.length;i++){
        const A=agents[i]; if(!A.g.userData_rig.bag) continue;
        const d=Math.hypot(A.g.position.x-cam.position.x, A.g.position.z-cam.position.z);
        if(d<bd){ bd=d; best=A; }
      }
      if(best){
        movePan(rollPan, best.g.position);
        const k=clamp(1-bd/22,0,1)*clamp(best.speed/1.6,0,1)*(1-outside);
        rollGain.gain.setTargetAtTime(Math.max(0.0001,k*0.055), now, 0.5);
        rollBus.gain.setTargetAtTime(Math.max(0.0001,k*0.030), now, 0.5);
      }
    }
    /* somebody has something to tell you every so often */
    nextPA-=dt;
    if(nextPA<=0){
      nextPA=WX.rain>0.6 ? rnd(16,34) : rnd(28,62);
      if(outside<0.7) announce();
    }
  }

  targets.forEach(function(o){
    const u=o.userData;
    if(u.flash>0){
      u.flash=Math.max(0,u.flash-dt*2.3);
      o.traverse(function(m){
        if(m.material&&m.material.userData&&m.material.userData.uni)
          m.material.userData.uni.uFlash.value=u.flash*0.5;
      });
    }
  });

  /* the clock, which is the one thing everyone in here is watching */
  if(clockEl){
    const hh=Math.floor(SKY.h), mm=Math.floor((SKY.h%1)*60);
    const s2=(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
    if(s2!==clockEl.textContent) clockEl.textContent=s2;
  }
  nextHud-=dt;
  if(nextHud<=0){
    nextHud=18;
    const el=document.getElementById('hud');
    if(el){
      el.style.opacity='0';
      setTimeout(function(){
        hudN=(hudN+1)%HUDLINES.length;
        el.innerHTML=HUDLINES[hudN][0]+'<br>'+HUDLINES[hudN][1];
        el.style.opacity='1';
      },900);
    }
  }

  updateListener(cam);
  renderer.render(scene,cam);
}

/* Sound cannot start until the browser has seen a gesture, so it
   waits here for the first touch, click or key instead of behind a
   door you have to open. */
(function(){
  let woken=false;
  function wake(){
    if(woken) return;
    woken=true;
    if(!ready){ try{ ready=initAudio(); }catch(e){ ready=false; }
      if(ready && ac.state==='suspended') ac.resume(); }
    if(ready) setTimeout(announce, 4200);
  }
  ['pointerdown','mousedown','touchstart','keydown'].forEach(function(ev){
    addEventListener(ev, wake, {capture:true, passive:true});
  });
})();
document.addEventListener('visibilitychange',function(){
  if(!ac) return;
  if(document.hidden) ac.suspend(); else ac.resume();
});

boardDraw(0);
fit(); tick();
})();
</script>
</body>
