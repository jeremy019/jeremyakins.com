<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Card Switch">
<meta name="theme-color" content="#F1F3EE">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Card Switch</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

:root {
  --paper:#F1F3EE; --surface:#FFFFFF; --ink:#16221C; --muted:#6B7A70;
  --hair:#DDE3D9; --card:#0E6B50; --debit:#4E6180;
  --debit-soft:#DDE3EE; --gain:#5E7A16;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { background:var(--paper); }
body {
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'IBM Plex Sans',-apple-system,system-ui,sans-serif;
  padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 48px);
  -webkit-font-smoothing:antialiased;
}
.wrap { max-width:460px; margin:0 auto; }
button { font:inherit; cursor:pointer; border:none; background:none; color:inherit;
  -webkit-user-select:none; user-select:none; }
button:focus-visible, input:focus-visible { outline:2px solid var(--card); outline-offset:2px; border-radius:4px; }

.nav { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:18px; }
.month { font-family:Fraunces,Georgia,serif; font-size:31px; font-weight:600; letter-spacing:-.015em; line-height:1; }
.year { font-size:13px; color:var(--muted); margin-left:7px; font-family:'IBM Plex Sans',sans-serif; font-weight:400; }
.arrow { width:34px; height:34px; border-radius:50%; border:1px solid var(--hair);
  background:var(--surface); color:var(--muted); font-size:15px; line-height:1; flex:none; }

.tot { display:flex; align-items:baseline; gap:9px; margin-bottom:12px; }
.tot-n { font-family:Fraunces,Georgia,serif; font-size:38px; font-weight:600; line-height:1;
  letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.tot-l { font-size:13px; color:var(--muted); }
.bar { height:14px; border-radius:7px; overflow:hidden; display:flex; background:var(--debit-soft); }
.seg { display:block; height:100%; transition:width .35s cubic-bezier(.4,0,.2,1); }
.seg.c { background:var(--card); }
.seg.d { background:var(--debit); }
.legend { display:flex; justify-content:space-between; margin-top:9px; font-size:13px; }
.legend b { font-weight:600; font-variant-numeric:tabular-nums; }
.caption { font-size:13px; color:var(--muted); margin:14px 0 0; line-height:1.5; }
.gain { color:var(--gain); font-weight:600; font-variant-numeric:tabular-nums; }
.lost { color:var(--debit); font-weight:600; font-variant-numeric:tabular-nums; }
.void { text-decoration:line-through; color:var(--muted); }

.paid { display:flex; align-items:center; gap:9px; margin-top:12px; font-size:13px; color:var(--muted); text-align:left; }
.check { width:19px; height:19px; border-radius:4px; border:1.5px solid var(--hair);
  background:var(--surface); flex:none; display:flex; align-items:center; justify-content:center;
  font-size:12px; color:#fff; }
.check.on { background:var(--card); border-color:var(--card); }

.grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:26px; }
.dow { text-align:center; font-size:11px; color:var(--muted); padding-bottom:6px; }
.day { aspect-ratio:1/1.06; border-radius:7px; background:var(--surface); border:1px solid var(--hair);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  padding:4px 2px 5px; position:relative; }
.day.blank { background:transparent; border-color:transparent; }
.day.sel { border-color:var(--ink); box-shadow:0 0 0 1px var(--ink); }
.day.today .dnum { text-decoration:underline; text-underline-offset:2px; }
.dnum { font-size:13px; font-variant-numeric:tabular-nums; }
.day.quiet .dnum { color:#A9B4AD; }
.damt { font-size:9px; color:var(--muted); font-variant-numeric:tabular-nums; line-height:1; }
.stripe { position:absolute; left:5px; right:5px; bottom:4px; height:3px; border-radius:2px;
  overflow:hidden; display:flex; background:var(--debit); }
.stripe i { background:var(--card); display:block; }

.panel { margin-top:22px; background:var(--surface); border:1px solid var(--hair); border-radius:10px; padding:16px; }
.phead { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; }
.pday { font-family:Fraunces,Georgia,serif; font-size:19px; font-weight:600; }
.ptot { font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
.row { display:flex; align-items:center; gap:9px; padding:8px 0; border-top:1px solid var(--hair); }
.chip { width:7px; height:7px; border-radius:50%; flex:none; }
.mer { flex:1; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.amt { font-size:14px; font-variant-numeric:tabular-nums; font-weight:500; }
.del { color:#B9C2BB; font-size:17px; padding:0 2px; line-height:1; }
.none { font-size:13px; color:var(--muted); padding:6px 0 10px; margin:0; }

.form { margin-top:12px; padding-top:14px; border-top:1px solid var(--hair); }
.inputs { display:flex; gap:8px; }
.in { border:1px solid var(--hair); border-radius:7px; padding:10px 11px; font-family:inherit;
  font-size:16px; color:var(--ink); background:var(--paper); width:100%; }
.in::placeholder { color:#A9B4AD; }
.in.amt-in { width:104px; flex:none; font-variant-numeric:tabular-nums; font-weight:500; }
.sel { width:100%; margin-top:8px; border:1px solid var(--hair); border-radius:7px;
  padding:11px 34px 11px 11px; font-family:inherit; font-size:16px; color:var(--ink);
  background-color:var(--paper); -webkit-appearance:none; appearance:none;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='11' height='7' viewBox='0 0 11 7'%3E%3Cpath d='M1 1l4.5 4.5L10 1' stroke='%236B7A70' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat; background-position:right 12px center; }
.mer small { display:block; font-size:11.5px; color:var(--muted); margin-top:1px; }
.cats { margin-top:28px; }
.catg { margin-top:19px; }
.catg-h { display:flex; align-items:baseline; justify-content:space-between;
  padding-bottom:8px; border-bottom:1px solid var(--hair); }
.catg-n { font-size:11.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
.catg-n em { font-style:normal; margin-left:7px; color:#A9B4AD; letter-spacing:0; }
.catg-t { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; }
.catr { display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:8px 0; font-size:13.5px; border-bottom:1px solid #EEF1EC; }
.catr-a { font-variant-numeric:tabular-nums; font-weight:500; flex:none; }
.rails { display:flex; gap:8px; margin-top:8px; }
.rail { flex:1; padding:11px 8px; border-radius:7px; border:1.5px solid var(--hair);
  font-size:13.5px; font-weight:500; color:var(--muted); background:var(--paper); }
.rail.on.card { background:var(--card); border-color:var(--card); color:#fff; }
.rail.on.debit { background:var(--debit); border-color:var(--debit); color:#fff; }
.add { width:100%; margin-top:8px; padding:12px; border-radius:7px; background:var(--ink);
  color:var(--paper); font-size:14px; font-weight:500; }
.add:disabled { background:var(--hair); color:var(--muted); cursor:default; }

.trend { margin-top:26px; }
.thead { font-size:13px; color:var(--muted); margin-bottom:11px; }
.trow { display:flex; align-items:center; gap:10px; width:100%; padding:6px 0; text-align:left; }
.tm { font-size:13px; width:52px; flex:none; }
.tbar { flex:1; height:7px; border-radius:4px; background:var(--debit-soft); overflow:hidden; }
.tbar i { display:block; height:100%; background:var(--card); }
.tp { font-size:13px; width:40px; text-align:right; flex:none; font-variant-numeric:tabular-nums; font-weight:500; }
.trow.cur .tm, .trow.cur .tp { font-weight:600; }

.foot { margin-top:30px; font-size:12.5px; color:var(--muted); line-height:1.6; }
.dlink { margin-top:14px; font-size:12px; color:#A9B4AD; text-decoration:underline; }
.iobox { width:100%; height:104px; margin-top:10px; border:1px solid var(--hair); border-radius:7px;
  padding:10px; font-family:ui-monospace,Menlo,monospace; font-size:11px; line-height:1.4;
  background:var(--surface); color:var(--muted); resize:vertical; }
.iobtns { display:flex; gap:8px; margin-top:8px; }
.iobtn { flex:1; padding:10px; border-radius:7px; border:1px solid var(--hair);
  background:var(--surface); font-size:13px; }
.iobtn.warn { color:#B4453A; }
.iobtn.go { background:var(--ink); color:var(--paper); border-color:var(--ink); font-weight:500; }
.iobox::placeholder { color:#B9C2BB; }
.iohint { font-size:12px; color:var(--muted); margin:9px 0 0; line-height:1.55; }

@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function () {
  "use strict";

  var KEY = "cardswitch:v1", RATE = 0.02;
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var MSHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var DOW = ["S","M","T","W","T","F","S"];

  var GROUPS = [
    { name: "Essential", cats: ["Groceries", "Gas", "Car Maintenance", "Cat Food and Litter"] },
    { name: "Non-Essential", cats: ["Restaurants", "Coffee", "Bars", "Household Items", "Clothing",
      "Personal Items", "Home & Hardware / Yard", "Convenience Stores", "Entertainment",
      "Online Shopping"] },
    { name: "Other", cats: ["Cash Withdrawals", "Bank & ATM Fees", "Business / Advertising",
      "New Lens", "Unidentified / Needs Review"] }
  ];
  var FALLBACK = "Unidentified / Needs Review";
  var VALID = {};
  GROUPS.forEach(function (g) { g.cats.forEach(function (c) { VALID[c] = 1; }); });


  function seed() { return []; }

  var money = function (n) {
    return n.toLocaleString("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2 });
  };
  var compact = function (n) { return Math.round(Math.abs(n)).toLocaleString("en-US"); };
  var pad2 = function (n) { return String(n).padStart(2, "0"); };
  var mKey = function (y, m) { return y + "-" + pad2(m + 1); };
  var dKey = function (y, m, d) { return mKey(y, m) + "-" + pad2(d); };
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };

  var today = new Date();
  var S = {
    entries: [], paid: {},
    y: today.getFullYear(), m: today.getMonth(),
    sel: null, rail: "card", cat: "Groceries", warn: null, io: false
  };

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        S.entries = d.entries || [];
        S.paid = d.paid || {};
        return;
      }
    } catch (e) {
      S.warn = "This browser is blocking storage, so nothing you add will be kept.";
    }
    S.entries = seed();
    save();
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ entries: S.entries, paid: S.paid }));
    } catch (e) {
      S.warn = "That didn't save — storage is full or blocked.";
    }
  }

  function monthStats() {
    var by = {};
    S.entries.forEach(function (e) {
      var k = e.date.slice(0, 7);
      if (!by[k]) by[k] = { card: 0, debit: 0 };
      by[k][e.rail] += e.amount;
    });
    return by;
  }

  function dayStats(mk) {
    var by = {};
    S.entries.forEach(function (e) {
      if (e.date.slice(0, 7) !== mk) return;
      var d = Number(e.date.slice(8));
      if (!by[d]) by[d] = { card: 0, debit: 0, items: [] };
      by[d][e.rail] += e.amount;
      by[d].items.push(e);
    });
    return by;
  }

  function catSelect() {
    var s = '<select class="sel" id="cat">';
    GROUPS.forEach(function (g) {
      s += '<optgroup label="' + g.name + '">';
      g.cats.forEach(function (c) {
        s += '<option' + (S.cat === c ? " selected" : "") + '>' + esc(c) + '</option>';
      });
      s += '</optgroup>';
    });
    return s + '</select>';
  }

  function render() {
    var mk = mKey(S.y, S.m);
    var stats = monthStats();
    var cur = stats[mk] || { card: 0, debit: 0 };
    var total = cur.card + cur.debit;
    var pct = total > 0 ? (cur.card / total) * 100 : 0;
    var isPaid = !!S.paid[mk];
    var days = dayStats(mk);
    var h = "";

    h += '<div class="nav">' +
         '<button class="arrow" data-step="-1" aria-label="Previous month">&lsaquo;</button>' +
         '<div class="month">' + MONTHS[S.m] + '<span class="year">' + S.y + '</span></div>' +
         '<button class="arrow" data-step="1" aria-label="Next month">&rsaquo;</button></div>';

    var pc = Math.max(0, cur.card), pd = Math.max(0, cur.debit), pt = pc + pd;
    h += '<div class="tot"><span class="tot-n">' + money(total) + '</span>' +
         '<span class="tot-l">spent in ' + MONTHS[S.m] + '</span></div>';
    h += '<div class="bar">' + (pt > 0
      ? '<i class="seg c" style="width:' + (pc / pt * 100) + '%"></i>' +
        '<i class="seg d" style="width:' + (pd / pt * 100) + '%"></i>'
      : '') + '</div>';

    h += '<div class="legend">' +
         '<span style="color:var(--card)"><b>' + money(cur.card) + '</b> Fidelity</span>' +
         '<span style="color:var(--debit)"><b>' + money(cur.debit) + '</b> debit</span></div>';

    h += '<p class="caption">' + (total === 0
      ? "Tap a day to log what you spent, which card it went on, and what it was for."
      : '<span class="gain' + (isPaid ? "" : " void") + '">' + money(cur.card * RATE) + '</span> back at 2%' +
        (isPaid ? "" : " &mdash; only if the balance clears") + '.'
      ) + '</p>';

    h += '<button class="paid" data-paid="1"><span class="check' + (isPaid ? " on" : "") + '">' +
         (isPaid ? "&#10003;" : "") + '</span>Paid the Fidelity balance in full this month</button>';

    h += '<div class="grid">';
    DOW.forEach(function (d) { h += '<div class="dow">' + d + '</div>'; });
    var first = new Date(S.y, S.m, 1).getDay();
    var dim = new Date(S.y, S.m + 1, 0).getDate();
    for (var i = 0; i < first; i++) h += '<div class="day blank"></div>';
    for (var d = 1; d <= dim; d++) {
      var dd = days[d];
      var t = dd ? dd.card + dd.debit : 0;
      var share = t > 0 ? Math.max(0, Math.min(100, (dd.card / t) * 100)) : 0;
      var isToday = d === today.getDate() && S.m === today.getMonth() && S.y === today.getFullYear();
      h += '<button class="day' + (S.sel === d ? " sel" : "") + (dd ? "" : " quiet") +
           (isToday ? " today" : "") + '" data-day="' + d + '">' +
           '<span class="dnum">' + d + '</span>' +
           (dd ? '<span class="damt">' + compact(t) + '</span>' : '') +
           (dd ? '<span class="stripe"><i style="width:' + share + '%"></i></span>' : '') +
           '</button>';
    }
    h += '</div>';

    if (S.sel != null) {
      var sd = days[S.sel];
      var st = sd ? sd.card + sd.debit : 0;
      h += '<div class="panel"><div class="phead"><span class="pday">' + MSHORT[S.m] + " " + S.sel +
           '</span>' + (st !== 0 ? '<span class="ptot">' + money(st) + '</span>' : '') + '</div>';
      if (sd) {
        sd.items.forEach(function (e) {
          h += '<div class="row"><span class="chip" style="background:var(--' +
               (e.rail === "card" ? "card" : "debit") + ')"></span>' +
               '<span class="mer">' + esc(e.merchant) +
               '<small>' + esc(e.cat || FALLBACK) + '</small></span>' +
               '<span class="amt">' + money(e.amount) + '</span>' +
               '<button class="del" data-del="' + e.id + '" aria-label="Delete">&times;</button></div>';
        });
      } else {
        h += '<p class="none">Nothing logged for this day.</p>';
      }
      h += '<div class="form"><div class="inputs">' +
           '<input class="in amt-in" id="amt" inputmode="decimal" placeholder="0.00">' +
           '<input class="in" id="mer" placeholder="Where"></div>' +
           catSelect() +
           '<div class="rails">' +
           '<button class="rail card' + (S.rail === "card" ? " on" : "") + '" data-rail="card">Fidelity</button>' +
           '<button class="rail debit' + (S.rail === "debit" ? " on" : "") + '" data-rail="debit">Debit</button>' +
           '</div><button class="add" id="add" disabled>Log it</button></div></div>';
    }

    var byCat = {}, grpTot = {};
    S.entries.forEach(function (e) {
      if (e.date.slice(0, 7) !== mk) return;
      var c = VALID[e.cat] ? e.cat : FALLBACK;
      byCat[c] = (byCat[c] || 0) + e.amount;
    });
    GROUPS.forEach(function (g) {
      grpTot[g.name] = g.cats.reduce(function (a, c) { return a + (byCat[c] || 0); }, 0);
    });

    if (total !== 0) {
      h += '<div class="cats">';
      GROUPS.forEach(function (g) {
        var rows = g.cats.filter(function (c) { return byCat[c]; })
                         .sort(function (a, b) { return byCat[b] - byCat[a]; });
        if (!rows.length) return;
        var share = total > 0 ? Math.round(grpTot[g.name] / total * 100) : 0;
        h += '<div class="catg"><div class="catg-h"><span class="catg-n">' + g.name +
             '<em>' + share + '%</em></span>' +
             '<span class="catg-t">' + money(grpTot[g.name]) + '</span></div>';
        rows.forEach(function (c) {
          h += '<div class="catr"><span>' + esc(c) + '</span>' +
               '<span class="catr-a">' + money(byCat[c]) + '</span></div>';
        });
        h += '</div>';
      });
      h += '</div>';
    }

    var keys = Object.keys(stats).sort().slice(-7);
    if (keys.length > 1) {
      h += '<div class="trend"><div class="thead">Share on the card, month by month</div>';
      keys.forEach(function (k) {
        var s = stats[k], t = s.card + s.debit;
        var p = t > 0 ? (s.card / t) * 100 : 0;
        var parts = k.split("-");
        h += '<button class="trow' + (k === mk ? " cur" : "") + '" data-goto="' + k + '">' +
             '<span class="tm">' + MSHORT[Number(parts[1]) - 1] + " " + parts[0].slice(2) + '</span>' +
             '<span class="tbar"><i style="width:' + p + '%"></i></span>' +
             '<span class="tp">' + Math.round(p) + '%</span></button>';
      });
      h += '</div>';
    }

    h += '<p class="foot">' + (S.warn ? esc(S.warn) :
      "The 2% only counts if the statement balance clears each month. Carry a balance and the grace " +
      "period is gone &mdash; new purchases start accruing interest the day you make them, which costs " +
      "far more than 2% pays.") + '</p>';
    h += '<button class="dlink" data-io="1">' + (S.io ? "Hide backup" : "Back up or restore") + '</button>';
    if (S.io) {
      h += '<textarea class="iobox" id="iobox" spellcheck="false" ' +
           'placeholder="Paste new transactions, or a full backup, here."></textarea>' +
           '<div class="iobtns">' +
           '<button class="iobtn go" data-append="1">Add these</button>' +
           '<button class="iobtn" data-replace="1">Replace all</button></div>' +
           '<div class="iobtns">' +
           '<button class="iobtn" data-copy="1">Copy backup</button>' +
           '<button class="iobtn warn" data-clear="1">Clear</button></div>' +
           '<p class="iohint">Add these keeps what&rsquo;s already logged and appends. Replace all ' +
           'swaps everything out. Copy backup puts your whole history on the clipboard &mdash; do ' +
           'that now and then, because clearing Safari&rsquo;s website data wipes this.</p>';
    }

    document.getElementById("app").innerHTML = h;
    wire();
  }

  function addEntry() {
    var a = document.getElementById("amt");
    var mEl = document.getElementById("mer");
    var v = parseFloat(a.value);
    if (!isFinite(v) || v === 0 || S.sel == null) return;
    var cEl = document.getElementById("cat");
    if (cEl) S.cat = cEl.value;
    S.entries.push({
      id: "e-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7),
      date: dKey(S.y, S.m, S.sel),
      merchant: (mEl.value || "").trim() || "Purchase",
      amount: v,
      rail: S.rail,
      cat: VALID[S.cat] ? S.cat : FALLBACK
    });
    save();
    render();
    var na = document.getElementById("amt");
    if (na) na.focus();
  }

  function wire() {
    document.querySelectorAll("[data-step]").forEach(function (b) {
      b.onclick = function () {
        var d = new Date(S.y, S.m + Number(b.dataset.step), 1);
        S.y = d.getFullYear(); S.m = d.getMonth(); S.sel = null; render();
      };
    });
    document.querySelectorAll("[data-day]").forEach(function (b) {
      b.onclick = function () {
        var d = Number(b.dataset.day);
        S.sel = S.sel === d ? null : d;
        render();
      };
    });
    document.querySelectorAll("[data-rail]").forEach(function (b) {
      b.onclick = function () { S.rail = b.dataset.rail; render(); };
    });
    document.querySelectorAll("[data-del]").forEach(function (b) {
      b.onclick = function () {
        S.entries = S.entries.filter(function (e) { return e.id !== b.dataset.del; });
        save(); render();
      };
    });
    document.querySelectorAll("[data-goto]").forEach(function (b) {
      b.onclick = function () {
        var p = b.dataset.goto.split("-");
        S.y = Number(p[0]); S.m = Number(p[1]) - 1; S.sel = null; render();
      };
    });
    var pd = document.querySelector("[data-paid]");
    if (pd) pd.onclick = function () {
      var k = mKey(S.y, S.m);
      S.paid[k] = !S.paid[k];
      save(); render();
    };
    var io = document.querySelector("[data-io]");
    if (io) io.onclick = function () { S.io = !S.io; render(); };

    var cp = document.querySelector("[data-copy]");
    if (cp) cp.onclick = function () {
      var out = JSON.stringify({ entries: S.entries, paid: S.paid });
      var box = document.getElementById("iobox");
      box.value = out; box.select(); box.setSelectionRange(0, 999999);
      try { navigator.clipboard.writeText(out); } catch (e) { document.execCommand("copy"); }
      cp.textContent = "Copied";
      setTimeout(function () { cp.textContent = "Copy backup"; }, 1500);
    };

    function parseBox() {
      var raw = document.getElementById("iobox").value.trim();
      if (!raw) return null;
      raw = raw.replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
      var d = JSON.parse(raw);
      var list = Array.isArray(d) ? d : d.entries;
      if (!Array.isArray(list)) throw 0;
      var out = list.map(function (e, i) {
        var amt = typeof e.amount === "number" ? e.amount : parseFloat(String(e.amount).replace(/[$,]/g, ""));
        if (!/^\d{4}-\d{2}-\d{2}$/.test(e.date) || !isFinite(amt)) throw 0;
        var rail = e.rail === "debit" ? "debit" : "card";
        var cat = VALID[e.cat] ? e.cat : FALLBACK;
        return {
          cat: cat,
          id: e.id || "i-" + Date.now() + "-" + i + "-" + Math.random().toString(36).slice(2, 6),
          date: e.date,
          merchant: (e.merchant || "Purchase").toString().slice(0, 60),
          amount: amt,
          rail: rail
        };
      });
      return { entries: out, paid: (d && d.paid) || null };
    }

    function flash(btn, msg) {
      var was = btn.textContent;
      btn.textContent = msg;
      setTimeout(function () { btn.textContent = was; }, 1700);
    }

    var app = document.querySelector("[data-append]");
    if (app) app.onclick = function () {
      var d;
      try { d = parseBox(); } catch (e) { return flash(app, "Not valid"); }
      if (!d || !d.entries.length) return flash(app, "Nothing to add");
      var have = {};
      S.entries.forEach(function (e) { have[e.id] = 1; });
      var fresh = d.entries.filter(function (e) { return !have[e.id]; });
      S.entries = S.entries.concat(fresh);
      var first = fresh[0];
      if (first) { S.y = Number(first.date.slice(0, 4)); S.m = Number(first.date.slice(5, 7)) - 1; }
      S.sel = null;
      save(); render();
    };

    var rep = document.querySelector("[data-replace]");
    if (rep) rep.onclick = function () {
      var d;
      try { d = parseBox(); } catch (e) { return flash(rep, "Not valid"); }
      if (!d) return flash(rep, "Box is empty");
      if (!confirm("Replace everything currently logged?")) return;
      S.entries = d.entries; S.paid = d.paid || {}; S.sel = null;
      save(); render();
    };

    var clr = document.querySelector("[data-clear]");
    if (clr) clr.onclick = function () {
      if (!confirm("Delete every month you've logged? Copy your backup first.")) return;
      S.entries = []; S.paid = {}; S.sel = null; S.io = false; save(); render();
    };
    var addBtn = document.getElementById("add");
    var amtEl = document.getElementById("amt");
    var merEl = document.getElementById("mer");
    if (addBtn && amtEl) {
      var sync = function () { addBtn.disabled = !parseFloat(amtEl.value); };
      amtEl.oninput = sync;
      addBtn.onclick = addEntry;
      var onKey = function (ev) { if (ev.key === "Enter") { ev.preventDefault(); addEntry(); } };
      amtEl.onkeydown = onKey;
      if (merEl) merEl.onkeydown = onKey;
      sync();
    }
  }

  load();
  render();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
