<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Douglas">
<meta name="theme-color" content="#7E8E93">
<title>Douglas</title>
<style>
  :root{
    --cold:#26343A; --ice:#B8D4E0; --ember:#FF9A3C; --moss:#7FA890; --pale:#DCE6E8;
    --display: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    height:100%; width:100%; overflow:hidden; background:var(--cold); color:var(--pale);
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none;
  }
  #c{ position:fixed; inset:0; display:block; touch-action:none;
      image-rendering:pixelated; image-rendering:-webkit-optimize-contrast; }

  #stick{
    position:fixed; z-index:5;
    right:calc(env(safe-area-inset-right,0px) + 22px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
    width:122px; height:122px; border-radius:50%;
    border:1px solid rgba(220,230,232,.24); background:rgba(38,52,58,.28);
    backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); touch-action:none;
  }
  #knob{
    position:absolute; left:50%; top:50%; width:50px; height:50px; margin:-25px 0 0 -25px;
    border-radius:50%; border:1px solid rgba(184,212,224,.55); background:rgba(184,212,224,.15);
    transition:background .2s;
  }
  #stick.on #knob{ background:rgba(184,212,224,.3); }

  #name{
    position:fixed; z-index:6; left:0; right:0;
    bottom:calc(env(safe-area-inset-bottom,0px) + 172px);
    text-align:center; pointer-events:none;
    font-family:var(--display); font-style:italic; font-size:1.5rem;
    opacity:0; text-shadow:0 0 22px currentColor;
  }
  #name.show{ animation:nm 2s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes nm{
    0%{opacity:0; transform:translateY(8px);} 14%{opacity:1; transform:translateY(0);}
    66%{opacity:1;} 100%{opacity:0; transform:translateY(-10px);}
  }

  #back{
    position:fixed; z-index:6;
    left:calc(env(safe-area-inset-left,0px) + 18px);
    top:calc(env(safe-area-inset-top,0px) + 16px);
    padding:9px 17px; background:rgba(38,52,58,.42);
    border:1px solid rgba(220,230,232,.24); color:rgba(220,230,232,.8);
    font-family:var(--mono); font-size:.58rem; letter-spacing:.2em; text-transform:uppercase;
    text-decoration:none; -webkit-appearance:none; cursor:pointer;
  }
  #back:active{ background:rgba(220,230,232,.16); }

  #hud{
    position:fixed; z-index:5; left:calc(env(safe-area-inset-left,0px) + 20px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 34px);
    font-family:var(--mono); font-size:.58rem; letter-spacing:.18em;
    text-transform:uppercase; color:rgba(220,230,232,.3); pointer-events:none; line-height:2;
  }

  #start{
    position:fixed; inset:0; z-index:20; background:var(--cold);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:0 34px; transition:opacity 1s ease;
  }
  #start.gone{ opacity:0; pointer-events:none; }
  #start h1{
    font-family:var(--display); font-weight:400; font-size:clamp(2.8rem,15vw,4.2rem);
    letter-spacing:-.02em; color:var(--ice); text-shadow:0 0 60px rgba(184,212,224,.26);
  }
  #start .rule{ width:52px; height:1px; background:rgba(127,168,144,.6); margin:24px 0 22px; }
  #start p{
    font-family:var(--display); font-size:1rem; line-height:1.65;
    color:rgba(220,230,232,.7); text-align:center; max-width:19.5rem;
  }
  #go{
    margin-top:38px; padding:15px 42px; background:transparent; color:var(--ice);
    border:1px solid rgba(184,212,224,.4); border-radius:999px;
    font-family:var(--display); font-size:1.05rem; letter-spacing:.06em;
    cursor:pointer; -webkit-appearance:none;
  }
  #go:active{ background:rgba(184,212,224,.12); }
  #go:focus-visible{ outline:2px solid var(--ice); outline-offset:4px; }
  #load{
    position:absolute; bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
    font-family:var(--mono); font-size:.6rem; letter-spacing:.2em;
    text-transform:uppercase; color:rgba(127,168,144,.85);
  }
  #fade{
    position:fixed; inset:0; z-index:30; background:#fff;
    opacity:0; pointer-events:none; transition:opacity .8s ease;
  }
  #fade.on{ opacity:1; }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="name"></div>
<a id="back" href="thehouse.html">&larr; the house</a>
<div id="hud">drag to look<br>tap what you see</div>
<div id="stick"><div id="knob"></div></div>
<div id="fade"></div>

<div id="start">
  <h1>Douglas</h1>
  <div class="rule"></div>
 
  <button id="go" disabled>Loading</button>
  <div id="load">Fetching three.js</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
(function(){
if(typeof THREE==='undefined'){
  document.getElementById('load').textContent='three.js failed to load — check connection';
  return;
}
document.getElementById('go').disabled=false;
document.getElementById('go').textContent='Step out';
document.getElementById('load').textContent='Sound begins on touch';

/* ══════════════════════════════════════════════════════════════
   WAVETABLES — same block as Shoal. Paste extractor output over
   any entry to swap in your own Zebra2 material.
   ══════════════════════════════════════════════════════════════ */
function spectrum(f,K){
  K=K||48; const real=[0], imag=[0];
  for(let k=1;k<=K;k++){ real.push(0); imag.push(f(k)); }
  return {real:real, imag:imag};
}
const WAVETABLES={
  fire:    spectrum(function(k){ return Math.pow(k,-1.2)*(k%2===1?1:0.7); }),
  water:   spectrum(function(k){ return Math.pow(k,-2.2)*(k<8?1:0.12); }),
  plant:   spectrum(function(k){ return Math.pow(k,-0.95)*Math.exp(-Math.pow((k-7)/9,2)); }),
  star:    spectrum(function(k){
             const p=[1,4,7,11,17,24]; let v=0;
             for(let i=0;i<p.length;i++) if(k===p[i]) v=Math.pow(i+1,-1.0);
             return v; }),
  anemone: spectrum(function(k){ return k<=2?Math.pow(k,-0.7):Math.pow(k,-2.9); }),
  stone:   spectrum(function(k){ return k<=3?Math.pow(k,-1.5):Math.pow(k,-3.4); }),
  /* a trunk struck with the flat of a hand — hollow, odd-harmonic */
  tree:    spectrum(function(k){ return (k%2===1?1:0.22)*Math.pow(k,-1.35)
                                        *Math.exp(-Math.pow((k-3)/6,2)); }),
  /* a slow diesel: strong fundamental, a stack of low partials */
  boat:    spectrum(function(k){ return Math.pow(k,-1.6)*(k<6?1:0.14); }),
  /* humpback — almost a sine, with just enough throat to carry */
  whale:   spectrum(function(k){
             const p=[1,2,3,5]; let v=0;
             for(let i=0;i<p.length;i++) if(k===p[i]) v=Math.pow(i+1,-1.6);
             return v; })
};
/* ── TUNING ────────────────────────────────────────────────────
   The loop is in D (a D pedal with G and A over it, A=440, and a C
   natural rather than C#, so D mixolydian rather than plain major).
   Everything you can touch is therefore pinned to D major pentatonic
   — D E F# A B — which is the set common to D major, D mixolydian
   and G major, and contains no semitone that can sour against the
   record. `semis` is only ever a whole number of octaves, so a patch
   can pick its register without leaving the scale.
   ────────────────────────────────────────────────────────────── */
const PATCH={
  fire:    { semis:-12, dur:6.0, atk:0.90, cut:1300, q:1.1, gain:0.30, roll:26 },
  water:   { semis:-24, dur:7.5, atk:1.70, cut: 600, q:1.0, gain:0.30, roll:110 },
  plant:   { semis: 12, dur:3.0, atk:0.05, cut:3800, q:1.6, gain:0.15, roll:16 },
  star:    { semis: 24, dur:4.4, atk:0.01, cut:6800, q:1.0, gain:0.14, roll:12 },
  anemone: { semis:  0, dur:1.5, atk:0.004,cut:1100, q:6.0, gain:0.24, roll:11 },
  stone:   { semis:-24, dur:2.6, atk:0.004,cut: 480, q:1.6, gain:0.32, roll:16 },
  tree:    { semis:-12, dur:5.4, atk:0.02, cut: 900, q:1.8, gain:0.26, roll:15 },
  boat:    { semis:-24, dur:6.6, atk:0.30, cut: 420, q:1.2, gain:0.30, roll:90 },
  whale:   { semis:-24, dur:9.0, atk:1.30, cut: 340, q:1.1, gain:0.34, roll:120 }
};
const LABEL={ fire:'the fire', water:'the inlet', plant:'beach rye',
              star:'an ochre star', anemone:'an anemone', stone:'a stone',
              tree:'a sitka spruce', boat:'the troller', whale:'a humpback' };
const ROOT=50;                            // D3 — the pedal the record sits on
const DEG=[0,2,4,7,9,12,14,16];           // D major pentatonic: D E F# A B
function mtof(m){ return 440*Math.pow(2,(m-69)/12); }

/* the loop is 13.035s of 4/4 at 73.65bpm — sixteen beats exactly, so
   the echo on everything you touch can fall on the beat */
const LOOP_SEC=13.035, LOOP_BEATS=16, BEAT=LOOP_SEC/LOOP_BEATS;

/* ══════════════════════════════════════════════════════════════
   AUDIO
   ══════════════════════════════════════════════════════════════ */
let ac=null, master=null, verbIn=null, waves={}, ready=false;
let surfGain=null, windGain=null, fireGain=null, firePan=null;
let tapEcho=null, musicBed=null, musicGain=null;
let boatGain=null, boatPan=null, boatFilt=null;

function impulse(sec,decay){
  const n=Math.floor(ac.sampleRate*sec), b=ac.createBuffer(2,n,ac.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d=b.getChannelData(ch);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay);
  }
  return b;
}
function noiseBuf(sec,smooth){
  const n=Math.floor(ac.sampleRate*sec), b=ac.createBuffer(1,n,ac.sampleRate);
  const d=b.getChannelData(0); let last=0;
  for(let i=0;i<n;i++){ last=last*smooth+(Math.random()*2-1)*(1-smooth); d[i]=last*(1/(1-smooth))*0.6; }
  return b;
}
function panner(x,y,z,ref){
  const p=ac.createPanner();
  p.panningModel='HRTF'; p.distanceModel='inverse';
  p.refDistance=ref||20; p.maxDistance=900; p.rolloffFactor=1;
  if(p.positionX){ p.positionX.value=x; p.positionY.value=y; p.positionZ.value=z; }
  else p.setPosition(x,y,z);
  return p;
}
/* for the things that move while they are sounding */
function movePan(p,v){
  if(!p) return;
  if(p.positionX){
    const t=ac.currentTime;
    p.positionX.setTargetAtTime(v.x,t,0.06);
    p.positionY.setTargetAtTime(v.y,t,0.06);
    p.positionZ.setTargetAtTime(v.z,t,0.06);
  } else p.setPosition(v.x,v.y,v.z);
}

const FIRE=new THREE.Vector3(9, 0, 15);

function initAudio(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return false;
  ac=new AC();
  master=ac.createGain(); master.gain.value=0.0001;
  const comp=ac.createDynamicsCompressor();
  comp.threshold.value=-15; comp.knee.value=24; comp.ratio.value=5;
  comp.attack.value=0.005; comp.release.value=0.3;
  master.connect(comp); comp.connect(ac.destination);
  master.gain.setTargetAtTime(0.9, ac.currentTime, 0.7);

  const conv=ac.createConvolver(); conv.buffer=impulse(4.6,2.0);
  const lv=ac.createGain(); lv.gain.value=0.62;
  verbIn=ac.createGain(); verbIn.connect(conv); conv.connect(lv); lv.connect(master);

  for(const k in WAVETABLES){
    const w=WAVETABLES[k];
    waves[k]=ac.createPeriodicWave(Float32Array.from(w.real), Float32Array.from(w.imag),
                                   {disableNormalization:false});
  }

  /* surf on gravel — coarser than sand */
  const s1=ac.createBufferSource(); s1.buffer=noiseBuf(5,0.80); s1.loop=true;
  const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=820; bp.Q.value=0.5;
  surfGain=ac.createGain(); surfGain.gain.value=0.07;
  s1.connect(bp); bp.connect(surfGain); surfGain.connect(master);
  const sv=ac.createGain(); sv.gain.value=0.5; surfGain.connect(sv); sv.connect(verbIn);
  const l1=ac.createOscillator(); l1.frequency.value=0.075;
  const g1=ac.createGain(); g1.gain.value=300; l1.connect(g1); g1.connect(bp.frequency); l1.start();
  s1.start();

  /* wind through the spruce */
  const s2=ac.createBufferSource(); s2.buffer=noiseBuf(6,0.93); s2.loop=true;
  const hp=ac.createBiquadFilter(); hp.type='bandpass'; hp.frequency.value=1900; hp.Q.value=0.35;
  windGain=ac.createGain(); windGain.gain.value=0.05;
  s2.connect(hp); hp.connect(windGain); windGain.connect(master);
  const l2=ac.createOscillator(); l2.frequency.value=0.043;
  const g2=ac.createGain(); g2.gain.value=0.035; l2.connect(g2); g2.connect(windGain.gain); l2.start();
  s2.start();

  /* the fire, in its actual spot on the beach */
  const s3=ac.createBufferSource(); s3.buffer=noiseBuf(4,0.62); s3.loop=true;
  const fb=ac.createBiquadFilter(); fb.type='bandpass'; fb.frequency.value=1500; fb.Q.value=0.8;
  fireGain=ac.createGain(); fireGain.gain.value=0.16;
  firePan=panner(FIRE.x, 1.0, FIRE.z, 9);
  s3.connect(fb); fb.connect(fireGain); fireGain.connect(firePan);
  firePan.connect(master);
  const fv=ac.createGain(); fv.gain.value=0.34; firePan.connect(fv); fv.connect(verbIn);
  s3.start();

  /* the troller's engine, carried across the water and moved with her.
     Two detuned saws through a narrow lowpass is what a slow diesel
     sounds like from half a mile off. */
  boatFilt=ac.createBiquadFilter();
  boatFilt.type='lowpass'; boatFilt.frequency.value=210; boatFilt.Q.value=3.2;
  boatGain=ac.createGain(); boatGain.gain.value=0.0001;
  boatPan=panner(0,1,-60,120);
  boatFilt.connect(boatGain); boatGain.connect(boatPan); boatPan.connect(master);
  const bv=ac.createGain(); bv.gain.value=0.5; boatPan.connect(bv); bv.connect(verbIn);
  [36.0,36.3,72.4].forEach(function(f,i){
    const o=ac.createOscillator(); o.type='sawtooth'; o.frequency.value=f;
    const g=ac.createGain(); g.gain.value=i===2?0.10:0.22;
    o.connect(g); g.connect(boatFilt); o.start();
  });
  /* the chug — the engine is not perfectly smooth */
  const chug=ac.createOscillator(); chug.type='sine'; chug.frequency.value=4.6;
  const chugG=ac.createGain(); chugG.gain.value=42;
  chug.connect(chugG); chugG.connect(boatFilt.frequency); chug.start();

  /* Everything you touch also goes down a delay pinned to the record's
     beat, so two or three taps in a row come back as a phrase instead
     of a pile. Filtered, because a bright echo would sit on top of the
     music rather than behind it. */
  tapEcho=ac.createGain(); tapEcho.gain.value=0.34;
  const dl=ac.createDelay(2.5); dl.delayTime.value=BEAT;
  const dlLP=ac.createBiquadFilter();
  dlLP.type='lowpass'; dlLP.frequency.value=1800; dlLP.Q.value=0.6;
  const fbk=ac.createGain(); fbk.gain.value=0.38;
  tapEcho.connect(dl); dl.connect(dlLP); dlLP.connect(fbk); fbk.connect(dl);
  const dlOut=ac.createGain(); dlOut.gain.value=0.5;
  dlLP.connect(dlOut); dlOut.connect(master);
  const dv=ac.createGain(); dv.gain.value=0.5; dlOut.connect(dv); dv.connect(verbIn);

  /* the floor of the whole thing — D, A and E, so the room itself is
     already in the key the record is in */
  musicBed=ac.createGain(); musicBed.gain.value=1;
  [[36.71,0.020],[55.00,0.017],[55.28,0.013],[82.41,0.013]].forEach(function(f){
    const o=ac.createOscillator(); o.type='sine'; o.frequency.value=f[0];
    const g=ac.createGain(); g.gain.value=f[1];
    o.connect(g); g.connect(musicBed); o.start();
  });
  musicBed.connect(master);
  return true;
}

/* ══════════════════════════════════════════════════════════════
   THE RECORD
   Douglas.mp3, carried in the page so it works off a disk with no
   server behind it. Two things have to be done to it before it will
   loop: the encoder leaves about fifty milliseconds of silence at the
   head, which would tick once every pass, and the tail does not meet
   the head, which would thump. So the padding is measured off and the
   last quarter-second is folded back over the start on an equal-power
   curve. What comes out is a buffer that can run all night.
   ══════════════════════════════════════════════════════════════ */
const MUSIC=(function(){
  let buffer=null, source=null, pending=false;

  function decodeB64(b64){
    const bin=atob(b64), n=bin.length, a=new Uint8Array(n);
    for(let i=0;i<n;i++) a[i]=bin.charCodeAt(i);
    return a.buffer;
  }

  function seamless(dec){
    const sr=dec.sampleRate, ch=dec.numberOfChannels, N=dec.length;
    const chans=[];
    for(let c=0;c<ch;c++) chans.push(dec.getChannelData(c));

    /* where does the sound actually start? */
    let peak=0;
    for(let i=0;i<N;i+=7) peak=Math.max(peak,Math.abs(chans[0][i]));
    const thr=Math.max(peak*0.012, 1e-4);
    let lead=0;
    for(let i=0;i<N;i++){
      let m=0;
      for(let c=0;c<ch;c++){ const v=Math.abs(chans[c][i]); if(v>m) m=v; }
      if(m>thr){ lead=i; break; }
    }
    /* and does it stop early? */
    let tail=N;
    for(let i=N-1;i>lead;i--){
      let m=0;
      for(let c=0;c<ch;c++){ const v=Math.abs(chans[c][i]); if(v>m) m=v; }
      if(m>thr){ tail=i+1; break; }
    }
    const L=tail-lead;
    if(L<sr*0.5) return dec;                       /* nothing worth looping */
    const X=Math.min(Math.floor(sr*0.25), Math.floor(L/4));   /* crossfade */
    const M=L-X;                                              /* loop length */
    const out=ac.createBuffer(ch,M,sr);
    for(let c=0;c<ch;c++){
      const s=chans[c], d=out.getChannelData(c);
      for(let i=0;i<M;i++) d[i]=s[lead+i];
      /* fold the true tail back over the opening */
      for(let i=0;i<X;i++){
        const k=i/X;
        d[i]=s[lead+i]*Math.sin(k*Math.PI*0.5) + s[lead+M+i]*Math.cos(k*Math.PI*0.5);
      }
    }
    return out;
  }

  function build(){
    if(!ac || buffer) return;
    let arr;
    try{ arr=decodeB64(MP3_B64); }catch(e){ return; }
    const done=function(dec){
      try{ buffer=seamless(dec); }catch(e){ buffer=dec; }
      if(pending){ pending=false; play(); }
    };
    try{
      const p=ac.decodeAudioData(arr, done, function(){});
      if(p && p.then) p.then(done).catch(function(){});
    }catch(e){}
  }

  function play(){
    if(!ac || !musicGain) return;
    if(!buffer){ pending=true; build(); return; }
    if(source) return;
    source=ac.createBufferSource();
    source.buffer=buffer; source.loop=true;
    source.connect(musicGain);
    source.start(ac.currentTime+0.05);
    musicGain.gain.setValueAtTime(0.0001, ac.currentTime);
    musicGain.gain.linearRampToValueAtTime(0.44, ac.currentTime+3.5);
  }

  function start(){
    if(!ac) return;
    musicGain=ac.createGain(); musicGain.gain.value=0.0001;
    musicGain.connect(master);
    /* a little of it into the same room as everything else */
    const mv=ac.createGain(); mv.gain.value=0.18;
    musicGain.connect(mv); mv.connect(verbIn);
    build(); play();
  }
  return { start:start, get ready(){ return !!buffer; } };
})();

/* a log popping */
function crackle(){
  if(!ready) return;
  const t=ac.currentTime;
  const n=Math.floor(ac.sampleRate*0.09), b=ac.createBuffer(1,n,ac.sampleRate);
  const d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,9);
  const s=ac.createBufferSource(); s.buffer=b;
  const f=ac.createBiquadFilter(); f.type='bandpass';
  f.frequency.value=900+Math.random()*2600; f.Q.value=2.5;
  const g=ac.createGain(); g.gain.value=0.09+Math.random()*0.16;
  s.connect(f); f.connect(g); g.connect(firePan); s.start(t);
}

/* the local bird, unavoidable */
function raven(){
  if(!ready) return;
  const t=ac.currentTime+0.02;
  const p=panner((Math.random()-0.5)*90, 26, 40+Math.random()*70, 55);
  p.connect(master);
  const pv=ac.createGain(); pv.gain.value=0.7; p.connect(pv); pv.connect(verbIn);
  const n=2+(Math.random()*2|0);
  for(let i=0;i<n;i++){
    const st=t+i*0.30;
    const o=ac.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(232+Math.random()*26, st);
    o.frequency.exponentialRampToValueAtTime(122, st+0.19);
    const f=ac.createBiquadFilter(); f.type='bandpass';
    f.frequency.value=1250; f.Q.value=3.4;
    const g=ac.createGain();
    g.gain.setValueAtTime(0.0001,st);
    g.gain.linearRampToValueAtTime(0.2,st+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,st+0.22);
    o.connect(f); f.connect(g); g.connect(p);
    o.start(st); o.stop(st+0.25);
  }
}

let voices=0;
function touchSound(kind,pos,degree){
  if(!ready || voices>14) return;
  const P=PATCH[kind], t=ac.currentTime+0.01;
  voices++;
  const o=ac.createOscillator();
  o.setPeriodicWave(waves[kind]);
  o.frequency.value=mtof(ROOT+P.semis+DEG[degree%DEG.length]);
  const f=ac.createBiquadFilter(); f.type='lowpass'; f.Q.value=P.q;
  f.frequency.setValueAtTime(P.cut*0.32,t);
  f.frequency.linearRampToValueAtTime(P.cut, t+Math.max(P.atk,0.1));
  f.frequency.exponentialRampToValueAtTime(P.cut*0.28, t+P.dur);
  const g=ac.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(P.gain, t+P.atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+P.dur);
  const p=panner(pos.x,pos.y,pos.z,P.roll);
  o.connect(f); f.connect(g); g.connect(p); p.connect(master);
  const s=ac.createGain(); s.gain.value=0.5; p.connect(s); s.connect(verbIn);
  /* the dry note keeps its place in the scene; the repeats come back
     on the beat, from the room rather than from the thing you touched */
  if(tapEcho){ const e=ac.createGain(); e.gain.value=0.55; p.connect(e); e.connect(tapEcho); }
  o.start(t); o.stop(t+P.dur+0.1);
  o.onended=function(){ voices--; };
}

function updateListener(cam){
  if(!ac) return;
  const l=ac.listener;
  const f=new THREE.Vector3(0,0,-1).applyQuaternion(cam.quaternion);
  const u=new THREE.Vector3(0,1,0).applyQuaternion(cam.quaternion);
  if(l.positionX){
    const t=ac.currentTime;
    l.positionX.setTargetAtTime(cam.position.x,t,0.02);
    l.positionY.setTargetAtTime(cam.position.y,t,0.02);
    l.positionZ.setTargetAtTime(cam.position.z,t,0.02);
    l.forwardX.setTargetAtTime(f.x,t,0.02); l.forwardY.setTargetAtTime(f.y,t,0.02);
    l.forwardZ.setTargetAtTime(f.z,t,0.02);
    l.upX.setTargetAtTime(u.x,t,0.02); l.upY.setTargetAtTime(u.y,t,0.02);
    l.upZ.setTargetAtTime(u.z,t,0.02);
  } else {
    l.setPosition(cam.position.x,cam.position.y,cam.position.z);
    l.setOrientation(f.x,f.y,f.z,u.x,u.y,u.z);
  }
}

/* ══════════════════════════════════════════════════════════════
   PS1 PIPELINE — with firelight, because the fire is the only
   warm thing in this scene and it should light what's near it
   ══════════════════════════════════════════════════════════════ */
const FOG_COL=new THREE.Color(0.694, 0.757, 0.780);
const FOG_NEAR=26, FOG_FAR=280;
const SUN_DIR=new THREE.Vector3(-0.25,0.72,-0.62).normalize();
const uFirePos={value:new THREE.Vector3(FIRE.x,1.2,FIRE.z)};
const uFireI  ={value:1.0};

const allMats=[];
function ps1(o){
  o=o||{};
  const uni={
    uMap:{value:o.map||null}, uRes:{value:new THREE.Vector2(320,240)},
    uTime:{value:0}, uJitter:{value:o.jitter===undefined?1:o.jitter},
    uFogCol:{value:FOG_COL}, uTint:{value:o.tint||new THREE.Color(1,1,1)},
    uCut:{value:o.cutout===undefined?-1:o.cutout}, uFlash:{value:0},
    uFogNear:{value:FOG_NEAR}, uFogFar:{value:o.fogFar||FOG_FAR},
    uSun:{value:SUN_DIR}, uAmb:{value:o.ambient===undefined?0.62:o.ambient},
    uGlow:{value:o.glow||0}, uFirePos:uFirePos, uFireI:uFireI,
    uFireR:{value:o.fireReach===undefined?16.0:o.fireReach},
    uAlpha:{value:1}
  };
  const m=new THREE.ShaderMaterial({
    uniforms:uni, transparent:!!o.transparent,
    side:o.side||THREE.FrontSide,
    depthWrite:o.depthWrite===undefined?true:o.depthWrite,
    vertexShader:[
      'uniform vec2 uRes; uniform float uJitter; uniform float uTime;',
      'uniform float uFogNear; uniform float uFogFar;',
      'uniform vec3 uSun; uniform float uAmb;',
      'uniform vec3 uFirePos; uniform float uFireI; uniform float uFireR;',
      'varying vec2 vUv; varying float vW; varying float vFog;',
      'varying float vLit; varying float vFire;',
      o.vertexHead||'',
      'void main(){',
      '  vec3 p = position;',
      '  vec3 n = normal;',
      o.vertexBody||'',
      '  vec4 wp = modelMatrix * vec4(p,1.0);',
      '  vec4 mv = viewMatrix * wp;',
      '  vec4 cl = projectionMatrix * mv;',
      '  vec2 g = uRes*0.5;',
      '  cl.xy = mix(cl.xy, floor(cl.xy/cl.w*g + 0.5)/g*cl.w, uJitter);',
      '  vec3 wn = normalize(mat3(modelMatrix)*n);',
      '  vLit = uAmb + (1.0-uAmb)*max(dot(wn,uSun),0.0);',
      '  float fd = distance(wp.xyz, uFirePos);',
      '  vFire = uFireI * pow(clamp(1.0 - fd/uFireR, 0.0, 1.0), 2.0);',
      '  vFog = clamp((-mv.z-uFogNear)/(uFogFar-uFogNear),0.0,1.0);',
      '  vUv = uv*cl.w; vW = cl.w;',
      '  gl_Position = cl;',
      '}'].join('\n'),
    fragmentShader:[
      'uniform sampler2D uMap; uniform float uTime; uniform vec3 uFogCol;',
      'uniform vec3 uTint; uniform float uCut; uniform float uFlash; uniform float uGlow;',
      'uniform float uAlpha;',
      'varying vec2 vUv; varying float vW; varying float vFog;',
      'varying float vLit; varying float vFire;',
      'float b2(vec2 a){ a=floor(a); return fract(dot(a, vec2(0.5, a.y*0.75))); }',
      'float b4(vec2 a){ return b2(0.5*a)*0.25 + b2(a); }',
      o.fragHead||'',
      'void main(){',
      '  vec2 uv = vUv/vW;',
      o.fragBody||'  vec4 tex = texture2D(uMap, uv);',
      '  if(uCut > 0.0 && tex.a < uCut) discard;',
      '  vec3 col = tex.rgb * uTint * mix(vLit, 1.0, uGlow);',
      '  col += vFire * vec3(1.05, 0.52, 0.16);',
      '  col += uFlash * vec3(1.0,0.9,0.7);',
      '  col = mix(col, uFogCol, vFog*(1.0-uGlow));',
      '  float d = b4(gl_FragCoord.xy)/0.9375;',
      '  gl_FragColor = vec4(floor(col*31.0 + d)/31.0, tex.a*uAlpha);',
      '}'].join('\n')
  });
  m.userData.uni=uni; allMats.push(m); return m;
}

function tex(w,h,draw){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h);

  t.magFilter=t.minFilter=THREE.NearestFilter;
  t.generateMipmaps=false; t.wrapS=t.wrapT=THREE.RepeatWrapping;
  return t;
}

   A temperate rainforest floor is not brown, it is loud green, and

T.fern=tex(64,64,function(g,w,h){
  g.clearRect(0,0,w,h);
  for(let f=0;f<5;f++){
    const bx=rnd(10,w-10), lean=rnd(-0.62,0.62), len=rnd(h*0.62,h*0.94);
    const tip=[bx+Math.sin(lean)*len*0.55, h-len];
    g.strokeStyle='rgba('+(rnd(74,104)|0)+','+(rnd(128,166)|0)+','+(rnd(52,84)|0)+',.95)';
    g.lineWidth=1.4;

    g.quadraticCurveTo(bx+Math.sin(lean)*len*0.18, h-len*0.55, tip[0], tip[1]);

      const t=i/N;

/* ── ground ──────────────────────────────────────────────── */
function terrainH(x,z){
  if(z<0.5) return -0.2;
  let h=z*0.048;
  h+=Math.sin(x*0.07)*0.72+Math.cos(z*0.055)*0.5;
  h+=Math.sin(x*0.19+z*0.14)*0.3;
  return h*Math.min(1,Math.max(0,(z-0.5)/7));
}
/* the boardwalk curves as it comes down out of the trees */
function walkX(z){ return Math.sin((z-24)*0.026)*7.5; }
function walkH(z){
  const t=Math.min(1,Math.max(0,(z-24)/78));
  return 1.05 + t*2.9 + terrainH(walkX(z),z)*0.55;
}
function onWalk(x,z){ return z>23 && z<104 && Math.abs(x-walkX(z))<3.0; }
function groundH(x,z){ return onWalk(x,z) ? walkH(z) : terrainH(x,z); }

/* ── mountains and glaciers across the channel ───────────── */
function ridge(zPos, height, seed, tintLo, tintHi, segs){
  const W=2600;
  const geo=new THREE.PlaneGeometry(W, height, segs, 1);
  const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    if(pos.getY(i) <= 0) continue;                  // only lift the top edge
    const x=pos.getX(i);
    let h=0;
    h+=Math.sin(x*0.0032+seed)*0.30;
    h+=Math.sin(x*0.0081+seed*2.1)*0.20;
    h+=Math.sin(x*0.0193+seed*3.7)*0.10;
    h+=Math.sin(x*0.0402+seed*1.3)*0.045;
    pos.setY(i, height*0.5 + h*height*0.62);
  }
  pos.needsUpdate=true; geo.computeVertexNormals();
  const mat=new THREE.ShaderMaterial({
    uniforms:{ uLo:{value:new THREE.Color(tintLo)}, uHi:{value:new THREE.Color(tintHi)},
               uFogCol:{value:FOG_COL}, uMix:{value:0} },
    depthWrite:true,
    vertexShader:['varying float vY; varying float vX;',
      'void main(){ vec4 wp=modelMatrix*vec4(position,1.0);',
      '  vY=wp.y; vX=wp.x;',
      '  gl_Position=projectionMatrix*viewMatrix*wp; }'].join('\n'),
    fragmentShader:['uniform vec3 uLo; uniform vec3 uHi; uniform vec3 uFogCol; uniform float uMix;',
      'varying float vY; varying float vX;',
      'float b2(vec2 a){ a=floor(a); return fract(dot(a, vec2(0.5, a.y*0.75))); }',
      'float b4(vec2 a){ return b2(0.5*a)*0.25+b2(a); }',
      'void main(){',
      '  float t=clamp(vY/170.0,0.0,1.0);',
      '  float band=floor(t*7.0)/7.0;',                 // hard PS1 steps
      '  vec3 c=mix(uLo,uHi,band);',
      /* glacier tongues: cold blue where the valleys run */
      '  float ice=smoothstep(0.55,0.95,sin(vX*0.021)*0.5+0.5) * smoothstep(0.30,0.72,t);',
      '  c=mix(c, vec3(0.760,0.870,0.918), ice*0.7);',
      '  c=mix(c, uFogCol, uMix);',
      '  float d=b4(gl_FragCoord.xy)/0.9375;',
      '  gl_FragColor=vec4(floor(c*31.0+d)/31.0,1.0);',
      '}'].join('\n')
  });
  const m=new THREE.Mesh(geo,mat);
  m.position.set(0, 0, zPos);
  scene.add(m);
  return m;
}

/* Merging the static scenery into a handful of geometries. Without this
   the spruce alone are 440 separate draw calls, which a phone will not
   forgive. Anything clickable stays its own mesh so it can flash. */
const _q=new THREE.Quaternion(), _e=new THREE.Euler(),
      _v=new THREE.Vector3(), _sc=new THREE.Vector3();
function mat(x,y,z,rx,ry,rz){
  _e.set(rx||0,ry||0,rz||0); _q.setFromEuler(_e);
  _v.set(x,y,z); _sc.set(1,1,1);
  return new THREE.Matrix4().compose(_v,_q,_sc);
}
function mergeAll(items){
  let vc=0;
  const gs=items.map(function(it){
    const g = it.geo.index ? it.geo.toNonIndexed() : it.geo.clone();
    g.applyMatrix4(it.m);
    vc += g.attributes.position.count;
    return g;
  });
  const pos=new Float32Array(vc*3), nor=new Float32Array(vc*3), uvs=new Float32Array(vc*2);
  let po=0, uo=0;
  gs.forEach(function(g){
    pos.set(g.attributes.position.array, po);
    if(g.attributes.normal) nor.set(g.attributes.normal.array, po);
    if(g.attributes.uv)     uvs.set(g.attributes.uv.array, uo);
    po += g.attributes.position.count*3;
    uo += g.attributes.position.count*2;
    g.dispose();
  });
  const out=new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos,3));
  out.setAttribute('normal',   new THREE.BufferAttribute(nor,3));
  out.setAttribute('uv',       new THREE.BufferAttribute(uvs,2));
  return out;
}
function bake(items, material){
  if(!items.length) return null;
  const m=new THREE.Mesh(mergeAll(items), material);
  m.frustumCulled=false;
  scene.add(m);
  return m;
}

}

  const coverMat=ps1({map:T.cover, cutout:0.34, transparent:true,
                      side:THREE.DoubleSide, ambient:0.58, fireReach:14});
  const logMat  =ps1({map:tiled(T.mosslog,2,1), ambient:0.46, fireReach:16});

  const F=[], S=[], B=[], C=[], L=[];

  /* how thick the green is at a given point: nothing on the gravel,
     thickening as the trees close in, and thickest right at the edge
     of the boardwalk where the light gets in */
  function density(x,z){
    if(z<40) return 0;
    let d=Math.min(1,(z-40)/26);                       // in from the beach
    d*=0.55+0.45*Math.sin(x*0.031+z*0.017);            // patchy, not even
    const edge=Math.abs(x-walkX(z));
    if(z>23&&z<104&&edge<11) d*=1.0+0.55*(1-edge/11);  // brighter by the path
    return Math.max(0,Math.min(1.4,d));
  }
  function drop(arr,x,z,w,hgt,lift){
    if(onWalk(x,z)) return;
    if(Math.hypot(x-FIRE.x,z-FIRE.z)<4.5) return;
    const y=terrainH(x,z)+(lift||0), ry=rnd(0,3);
    for(let i=0;i<2;i++)
      arr.push({geo:new THREE.PlaneGeometry(w,hgt),
                m:mat(x,y+hgt*0.46,z,0,ry+i*Math.PI/2,0)});
  }
  function scatter(arr,n,zLo,zHi,wLo,wHi,hLo,hHi,lift){
    let placed=0, guard=0;
    while(placed<n && guard++<n*6){
      const x=rnd(-150,150), z=rnd(zLo,zHi);
      if(Math.random()>density(x,z)) continue;
      const w=rnd(wLo,wHi);
      drop(arr,x,z,w,rnd(hLo,hHi),lift);
      placed++;
    }
  }
  /* knee-high sword fern, the loudest thing down there */
  scatter(F,1150, 44,246, 2.2,4.2, 1.7,3.1, 0);
  /* salal and huckleberry standing over it */
  scatter(S, 760, 48,246, 2.0,3.8, 1.5,2.8, 0);
  scatter(B, 520, 52,246, 2.4,4.6, 1.8,3.4, 0);
  /* and a low mat of green under everything */
  scatter(C, 980, 42,246, 1.6,3.0, 0.7,1.4, 0);

  /* nurse logs, gone to moss, with fern growing out of the top */
  for(let i=0;i<46;i++){
    const x=rnd(-140,140), z=rnd(56,240);
    if(onWalk(x,z)) continue;
    const len=rnd(5,13), r=rnd(0.5,1.05), a=rnd(0,Math.PI);
    L.push({geo:new THREE.CylinderGeometry(r,r*rnd(0.7,1),len,6,1),
            m:mat(x,terrainH(x,z)+r*0.75,z,Math.PI/2,a,rnd(-0.06,0.06))});
    const n=2+(Math.random()*3|0);
    for(let j=0;j<n;j++){
      const t=rnd(-0.42,0.42)*len;
      drop(F, x+Math.sin(a)*t, z+Math.cos(a)*t, rnd(1.6,2.8), rnd(1.2,2.0), r*1.3);
    }
  }
  bake(C,coverMat); bake(F,fernMat); bake(S,salalMat); bake(B,shrubMat); bake(L,logMat);

  /* two of the ferns answer back */
  [[-9,58],[13,66]].forEach(function(p,i){
    const g=new THREE.Group();
    for(let k=0;k<2;k++){
      const q=new THREE.Mesh(new THREE.PlaneGeometry(3.4,2.6),fernMat);
      q.rotation.y=k*Math.PI/2; q.position.y=1.2; g.add(q);
    }
    g.position.set(p[0],terrainH(p[0],p[1]),p[1]);
    place(g,'plant',i+3);
  });
})();

/* ══════════════════════════════════════════════════════════════
   THE TROLLER
   A salmon boat working her way up the channel: red topsides, cream
   house forward, and the poles up. Built once, merged per material,
   then walked across the inlet forever.
   ══════════════════════════════════════════════════════════════ */
const BOAT=(function(){
  const LEN=15.0, BEAM=4.6, DEPTH=2.5;

  /* a hull from a box, with the bow drawn in and lifted and the
     quarters tucked — cheaper than a lathe and reads correctly */
  function hullGeo(){
    const g=new THREE.BoxGeometry(BEAM,DEPTH,LEN,2,2,6);
    const p=g.attributes.position, half=LEN/2;
    for(let i=0;i<p.count;i++){
      const x=p.getX(i), y=p.getY(i), z=p.getZ(i);
      const f=Math.max(0, z/half);            // 0 midships → 1 at the stem
      const a=Math.max(0,-z/half);            // 0 midships → 1 at the transom
      let nx=x*(1-Math.pow(f,1.7)*0.80)*(1-Math.pow(a,2.2)*0.22);
      let ny=y;
      ny += Math.pow(f,2.0)*DEPTH*0.62;       // sheer sweeps up forward
      ny += Math.pow(a,2.4)*DEPTH*0.14;
      if(y<0) nx*=1-Math.pow(f,1.4)*0.30;     // a finer entry below the rail
      p.setXYZ(i,nx,ny,z);
    }
    p.needsUpdate=true; g.computeVertexNormals();
    return g;
  }

  const g=new THREE.Group();
  const hull=[], house=[], roof=[], rig=[], deck=[];

  hull.push({geo:hullGeo(), m:mat(0,0,0,0,0,0)});
  /* the rail, standing proud of the deck all round */
  deck.push({geo:new THREE.BoxGeometry(BEAM*0.90,0.14,LEN*0.80), m:mat(0,DEPTH*0.5,-0.6,0,0,0)});
  [-1,1].forEach(function(s){
    hull.push({geo:new THREE.BoxGeometry(0.16,0.52,LEN*0.74),
               m:mat(s*BEAM*0.45,DEPTH*0.62,-0.9,0,0,0)});
  });

  /* the house — set forward, as a troller's is */
  house.push({geo:new THREE.BoxGeometry(BEAM*0.74,2.05,4.5), m:mat(0,DEPTH*0.5+1.02,2.3,0,0,0)});
  roof.push ({geo:new THREE.BoxGeometry(BEAM*0.80,0.22,4.9), m:mat(0,DEPTH*0.5+2.15,2.3,0,0,0)});
  /* the little wheelhouse cap on top */
  house.push({geo:new THREE.BoxGeometry(BEAM*0.46,0.86,1.9), m:mat(0,DEPTH*0.5+2.6,2.0,0,0,0)});
  roof.push ({geo:new THREE.BoxGeometry(BEAM*0.52,0.18,2.2), m:mat(0,DEPTH*0.5+3.08,2.0,0,0,0)});
  /* stack */
  rig.push({geo:new THREE.CylinderGeometry(0.22,0.24,1.5,6,1), m:mat(-0.7,DEPTH*0.5+2.9,0.7,0,0,0)});
  /* the hatch and a couple of totes aft */
  deck.push({geo:new THREE.BoxGeometry(1.9,0.42,2.2), m:mat(0.2,DEPTH*0.5+0.28,-3.4,0,0,0)});
  deck.push({geo:new THREE.BoxGeometry(0.9,0.7,0.9), m:mat(-1.3,DEPTH*0.5+0.42,-5.0,0,0.3,0)});

  /* mast amidships, with the trolling poles up in the crutch */
  rig.push({geo:new THREE.BoxGeometry(0.20,7.6,0.20), m:mat(0,DEPTH*0.5+4.0,0.2,0,0,0)});
  rig.push({geo:new THREE.BoxGeometry(2.6,0.14,0.14),  m:mat(0,DEPTH*0.5+6.5,0.2,0,0,0)});
  [-1,1].forEach(function(s){
    /* poles raked out and up, the way they ride when she's running */
    rig.push({geo:new THREE.BoxGeometry(0.16,10.5,0.16),
              m:mat(s*1.1,DEPTH*0.5+4.6,-0.4, 0.10, 0, s*0.42)});
    /* stays */
    rig.push({geo:new THREE.BoxGeometry(0.07,5.6,0.07),
              m:mat(s*1.5,DEPTH*0.5+3.0,1.4, -0.34, 0, s*0.30)});
  });
  rig.push({geo:new THREE.BoxGeometry(0.07,6.2,0.07), m:mat(0,DEPTH*0.5+4.2,-2.6, 0.40,0,0)});
  /* boom over the cockpit */
  rig.push({geo:new THREE.BoxGeometry(0.14,4.6,0.14), m:mat(0,DEPTH*0.5+5.2,-1.9, 1.16,0,0)});

  const hullMat =ps1({map:tiled(T.hull,3,1), ambient:0.60, fogFar:470, fireReach:0.001});
  const houseMat=ps1({map:tiled(T.cabin,2,1), ambient:0.70, fogFar:470, fireReach:0.001});
  const roofMat =ps1({map:tiled(T.roof,2,1), ambient:0.58, fogFar:470, fireReach:0.001});
  const rigMat  =ps1({map:T.rig, ambient:0.42, fogFar:470, fireReach:0.001});
  const deckMat =ps1({map:tiled(T.deckwood,2,2), ambient:0.56, fogFar:470, fireReach:0.001});
  g.add(new THREE.Mesh(mergeAll(hull), hullMat));
  g.add(new THREE.Mesh(mergeAll(house),houseMat));
  g.add(new THREE.Mesh(mergeAll(roof), roofMat));
  g.add(new THREE.Mesh(mergeAll(rig),  rigMat));
  g.add(new THREE.Mesh(mergeAll(deck), deckMat));

  /* the wake, laid flat on the water and trailing astern */
  const wakeMat=ps1({map:T.wake, cutout:0.02, transparent:true, ambient:1, glow:0.9,
                     depthWrite:false, side:THREE.DoubleSide, fogFar:470});
  const wake=new THREE.Mesh(new THREE.PlaneGeometry(13,46), wakeMat);
  wake.rotation.x=-Math.PI/2; wake.position.set(0,-DEPTH*0.5+0.16,-24);
  wake.renderOrder=3; g.add(wake);

  /* and the water she is pushing out of the way */
  const sprayMat=ps1({map:T.spray, cutout:0.02, transparent:true, ambient:1, glow:1,
                      depthWrite:false, side:THREE.DoubleSide, fogFar:470});
  const bow=[];
  for(let i=0;i<5;i++){
    const q=new THREE.Mesh(new THREE.PlaneGeometry(3.0,2.0), sprayMat);
    q.position.set(rnd(-1.9,1.9), -DEPTH*0.2+rnd(0,0.5), LEN*0.44+rnd(-0.8,0.6));
    q.userData={ph:rnd(0,6.28), sc:rnd(0.8,1.5)};
    q.renderOrder=4; g.add(q); bow.push(q);
  }

  g.rotation.y=Math.PI/2;                       /* heading east, to start */
  g.position.set(-260, 0, -60);
  scene.add(g);

  /* an invisible box you can actually hit at that range */
  const hit=new THREE.Mesh(new THREE.BoxGeometry(LEN,11,BEAM*2.4),
            new THREE.MeshBasicMaterial({visible:false}));
  hit.position.copy(g.position); hit.position.y=3;
  place(hit,'boat',4);

  return { g:g, hit:hit, bow:bow, wake:wake, dir:1, x:-260, z:-60, DEPTH:DEPTH, horn:0 };
})();

/* ══════════════════════════════════════════════════════════════
   THE HUMPBACKS
   Down, up, blow, and down again. The cycle is one number per whale:
   a bump for how much of her is out of the water, and a rotation
   that takes the head under and stands the flukes up on the sound.
   ══════════════════════════════════════════════════════════════ */
const whaleMat=ps1({map:tiled(T.whale,2,1), ambient:0.52, fogFar:470, fireReach:0.001});
const flukeMat=ps1({map:tiled(T.whale,1,1), ambient:0.50, side:THREE.DoubleSide,
                    fogFar:470, fireReach:0.001});
const WHALES=[];
function humpback(x,z,head,period,phase,scale,deg){
  const g=new THREE.Group();
  const body=[], fins=[];
  /* body: a long spindle, fattest a third of the way back */
  const L=13.0;
  const seg=9;                       /* 9 stations, 8 barrels between them */
  /* girth curve — blunt head, thick shoulders, narrow peduncle. Clamped
     because a fractional power of a negative number is NaN, and one NaN
     vertex takes the whole merged geometry with it. */
  function girth(u){
    const c=Math.min(1,Math.max(0,u));
    return Math.max(0.12, Math.sin(Math.pow(1-c,0.72)*Math.PI)*1.62+0.16);
  }
  for(let i=0;i<seg-1;i++){
    const u0=i/(seg-1), u1=(i+1)/(seg-1);
    const zc=(u0-0.5)*L, dl=L/(seg-1);
    body.push({geo:new THREE.CylinderGeometry(girth(u1),girth(u0),dl,7,1),
               m:mat(0,0,zc+dl/2,Math.PI/2,0,0)});
  }
  /* the hump and the little hooked dorsal that names her */
  body.push({geo:new THREE.BoxGeometry(0.9,0.62,2.0), m:mat(0,1.15,-1.6,0,0,0)});
  fins.push({geo:new THREE.PlaneGeometry(1.15,0.95), m:mat(0,1.85,-2.0,0,0,-0.22)});
  /* pectorals — a third of her length, which is the whole point */
  [-1,1].forEach(function(s){
    fins.push({geo:new THREE.PlaneGeometry(4.4,1.15),
               m:mat(s*1.5,-0.35,1.2, 0.30, s*0.55, s*0.22)});
  });
  /* flukes */
  fins.push({geo:new THREE.PlaneGeometry(5.4,1.9), m:mat(0,0.05,-L*0.52,-0.16,0,0)});
  const bm=new THREE.Mesh(mergeAll(body), whaleMat);
  const fm=new THREE.Mesh(mergeAll(fins), flukeMat);
  g.add(bm); g.add(fm);
  g.scale.setScalar(scale);
  g.position.set(x,-6,z);
  g.rotation.y=head;
  scene.add(g);

  const hit=new THREE.Mesh(new THREE.BoxGeometry(6,7,L*scale),
            new THREE.MeshBasicMaterial({visible:false}));
  hit.rotation.y=head;
  place(hit,'whale',deg);

  const w={ g:g, hit:hit, x:x, z:z, head:head, period:period, phase:phase,
            scale:scale, blown:false, spd:rnd(1.5,2.6) };
  WHALES.push(w);
  return w;
}
humpback(-42,  -70,  Math.PI*0.52, 24, 0.00, 1.05, 1);
humpback( 34,  -96,  Math.PI*0.44, 29, 0.40, 1.20, 5);
humpback(-10, -130,  Math.PI*0.58, 33, 0.70, 0.92, 3);

/* the blow — a column of it, hanging for a moment before it goes */
const blowMat=ps1({map:T.spray, cutout:0.02, transparent:true, ambient:1, glow:1,
                   depthWrite:false, side:THREE.DoubleSide, fogFar:470});
const blows=[];
for(let i=0;i<26;i++){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(1,1), blowMat);
  m.visible=false; m.renderOrder=5; scene.add(m);
  blows.push({m:m, t:0, life:1, s:1, vy:1, drift:0});
}
function blow(x,y,z,n,scale){
  let made=0;
  for(let i=0;i<blows.length && made<n;i++){
    const p=blows[i];
    if(p.m.visible) continue;
    p.m.visible=true;
    p.m.position.set(x+rnd(-0.5,0.5), y, z+rnd(-0.5,0.5));
    p.t=0; p.life=rnd(2.2,3.6); p.s=rnd(1.4,2.6)*(scale||1);
    p.vy=rnd(3.4,5.2)*(scale||1); p.drift=rnd(-0.5,0.5);
    made++;
  }
}
/* the sound of it: a hard breath out, then the intake */
function whaleBlow(pos,amt){
  if(!ready) return;
  const t=ac.currentTime+0.02;
  const p=panner(pos.x,pos.y,pos.z,90); p.connect(master);
  const pv=ac.createGain(); pv.gain.value=0.85; p.connect(pv); pv.connect(verbIn);
  const n=Math.floor(ac.sampleRate*1.5), b=ac.createBuffer(1,n,ac.sampleRate);
  const d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const s=ac.createBufferSource(); s.buffer=b;
  const f=ac.createBiquadFilter(); f.type='bandpass'; f.Q.value=0.9;
  f.frequency.setValueAtTime(240,t);
  f.frequency.linearRampToValueAtTime(1150,t+0.10);
  f.frequency.exponentialRampToValueAtTime(320,t+1.0);
  const g2=ac.createGain();
  g2.gain.setValueAtTime(0.0001,t);
  g2.gain.linearRampToValueAtTime(0.30*(amt||1),t+0.05);
  g2.gain.exponentialRampToValueAtTime(0.0001,t+1.15);
  s.connect(f); f.connect(g2); g2.connect(p); s.start(t); s.stop(t+1.5);
}

/* ══════════════════════════════════════════════════════════════
   THE DOOR
   The same door that stands in the house, lifted out of its wall
   and left standing here in the open. Touch it and it swings
   onto white, and the white takes everything.
   ══════════════════════════════════════════════════════════════ */
const DOOR=(function(){
  const GOES_TO='cathedral.html';  /* what this door opens */
  const PLATE  ='CATHEDRAL';       /* what the sign over it reads */
  const GLASS  =[0.32,0.62,0.36];  /* the tint of its leaded light */
  const DW=3.5, DH=6.4, SIGNH=1.15, CW=0.55;
  const dmat=ps1;

  /* ── the house's own textures, so it is the same door ──── */
  function dtex(w,h,draw){
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    draw(c.getContext('2d'),w,h);
    const t=new THREE.CanvasTexture(c);
    t.magFilter=t.minFilter=THREE.NearestFilter;
    t.generateMipmaps=false; t.wrapS=t.wrapT=THREE.RepeatWrapping;
    return t;
  }
  function drep(t,rx,ry){ const c=t.clone(); c.needsUpdate=true; c.repeat.set(rx,ry); return c; }
  function r(a,b){ return a+Math.random()*(b-a); }

  /* fumed oak — dark, with the ray fleck quartersawn is prized for */
  const oak=dtex(64,64,function(g,w,h){
    g.fillStyle='#3A2716'; g.fillRect(0,0,w,h);
    for(let i=0;i<90;i++){
      const y=r(0,h), a=r(.06,.3);
      g.strokeStyle='rgba('+(r(70,120)|0)+','+(r(46,80)|0)+','+(r(22,44)|0)+','+a+')';
      g.lineWidth=r(.6,2.2); g.beginPath();
      g.moveTo(0,y);
      for(let x=0;x<=w;x+=8) g.lineTo(x, y+Math.sin(x*0.16+i)*1.7);
      g.stroke();
    }
    for(let i=0;i<26;i++){                       // ray flecks
      g.fillStyle='rgba(150,110,62,'+r(.1,.3)+')';
      g.fillRect(r(0,w)|0, r(0,h)|0, r(2,7)|0, 1);
    }
  });
  const oakLit=dtex(64,64,function(g,w,h){
    g.fillStyle='#5A3E22'; g.fillRect(0,0,w,h);
    for(let i=0;i<80;i++){
      g.strokeStyle='rgba('+(r(96,150)|0)+','+(r(66,104)|0)+','+(r(34,60)|0)+','+r(.08,.3)+')';
      g.lineWidth=r(.6,2); g.beginPath();
      const y=r(0,h); g.moveTo(0,y);
      for(let x=0;x<=w;x+=8) g.lineTo(x, y+Math.sin(x*0.2+i)*1.4);
      g.stroke();
    }
  });
  /* nothing at all, behind an open door */
  const white=dtex(4,4,function(g,w,h){ g.fillStyle='#fff'; g.fillRect(0,0,w,h); });

  /* leaded art glass — squares and a stylised rose, tinted to the
     colour of wherever it goes */
  const glass=dtex(64,96,function(g,w,h){
    const c='rgb('+(GLASS[0]*255|0)+','+(GLASS[1]*255|0)+','+(GLASS[2]*255|0)+')';
    g.fillStyle=c; g.fillRect(0,0,w,h);
    g.fillStyle='rgba(255,255,255,.16)';
    for(let y=0;y<h;y+=12) for(let x=0;x<w;x+=12)
      if(((x/12)+(y/12))%2===0) g.fillRect(x,y,12,12);
    g.fillStyle='rgba(255,246,220,.4)';
    g.fillRect(w*0.34, h*0.30, w*0.32, h*0.22);
    g.fillStyle='rgba(0,0,0,.34)';
    g.fillRect(w*0.42, h*0.38, w*0.16, h*0.07);
    g.strokeStyle='rgba(28,18,10,.8)'; g.lineWidth=2;         // came lines
    for(let y=0;y<=h;y+=12){ g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); }
    for(let x=0;x<=w;x+=12){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke(); }
    g.strokeStyle='rgba(28,18,10,.95)'; g.lineWidth=3;
    g.strokeRect(1,1,w-2,h-2);
  });

  /* the carved sign — letters set one at a time, so a long name
     gives back its tracking rather than running off the plate */
  const sign=dtex(320,80,function(g,w,h){
    g.fillStyle='#4E3519'; g.fillRect(0,0,w,h);
    for(let i=0;i<200;i++){
      g.strokeStyle='rgba('+(r(76,124)|0)+','+(r(50,84)|0)+','+(r(24,44)|0)+',.3)';
      g.lineWidth=r(.5,2); const y=r(0,h);
      g.beginPath(); g.moveTo(0,y);
      for(let x=0;x<=w;x+=16) g.lineTo(x,y+Math.sin(x*0.05+i)*2.4);
      g.stroke();
    }
    g.strokeStyle='rgba(22,14,6,.8)'; g.lineWidth=4; g.strokeRect(6,6,w-12,h-12);
    const FAM='Copperplate, "Copperplate Gothic Light", "Trajan Pro", Optima, serif';
    const chars=PLATE.split(''), avail=w-46;
    let size=40, base=0;
    for(let pass=0; pass<14; pass++){
      g.font='600 '+size+'px '+FAM;
      base=0;
      for(let i=0;i<chars.length;i++) base+=g.measureText(chars[i]).width;
      if(base<=avail || size<=16) break;
      size-=2;
    }
    let track=chars.length>1 ? (avail-base)/(chars.length-1) : 0;
    track=Math.max(0, Math.min(13, track));
    g.textAlign='center'; g.textBaseline='middle';
    let x=(w-(base+track*(chars.length-1)))/2;
    for(let i=0;i<chars.length;i++){
      const cw=g.measureText(chars[i]).width;
      g.fillStyle='rgba(18,10,4,.85)';                       // carved shadow
      g.fillText(chars[i], x+cw/2+2, h/2+2);
      g.fillStyle='#FFD9A0';
      g.fillText(chars[i], x+cw/2, h/2);
      x+=cw+track;
    }
  });

  /* ── where it stands ────────────────────────────────────── */
  const DX=-3, DZ=52;                         /* below you, off the boardwalk */
  const DY=groundH(DX,DZ)+DH/2-0.15;
  const DROT=Math.atan2(0-DX, 74-DZ);         /* turned to face where you start */

  const grp=new THREE.Group();
  grp.position.set(DX, DY, DZ);
  grp.rotation.y=DROT;

  const caseMat=dmat({map:drep(oakLit,1.4,3), ambient:.5});
  const slabMat=dmat({map:drep(oak,1.2,2.4), ambient:.44});
  const panMat =dmat({map:drep(oakLit,1,.6), ambient:.46});
  const glMat  =dmat({map:glass, ambient:1, glow:0.82, jitter:1});
  const knobMat=dmat({map:oakLit, tint:new THREE.Color(1.4,1.1,.6), ambient:.7});
  const signMat=dmat({map:sign, ambient:.72});
  const voidMat=dmat({map:white, ambient:1, glow:1});

  /* casing */
  [[-(DW/2+CW/2),0,CW,DH+CW*2],[ (DW/2+CW/2),0,CW,DH+CW*2],
   [0, DH/2+CW/2, DW+CW*2, CW]].forEach(function(p){
    const m=new THREE.Mesh(new THREE.BoxGeometry(p[2],p[3],0.34), caseMat);
    m.position.set(p[0],p[1],0.04); grp.add(m);
  });

  /* slab + three lower panels + art glass light on top. Out here you
     can walk round behind it, so the panels and the glass are set on
     both faces and the door is a door from either side. */
  const pivot=new THREE.Object3D();
  pivot.position.set(-DW/2, 0, 0);
  grp.add(pivot);

  const slab=new THREE.Mesh(new THREE.BoxGeometry(DW,DH,0.2), slabMat);
  slab.position.x=DW/2;
  pivot.add(slab);
  for(let i=0;i<3;i++){
    [0.12,-0.12].forEach(function(z){
      const p=new THREE.Mesh(new THREE.BoxGeometry(DW*0.74, DH*0.155, 0.08), panMat);
      p.position.set(DW/2, -DH*0.34 + i*DH*0.19, z); pivot.add(p);
    });
  }
  [[0.12,0],[-0.12,Math.PI]].forEach(function(s){
    const gl=new THREE.Mesh(new THREE.PlaneGeometry(DW*0.7, DH*0.26), glMat);
    gl.position.set(DW/2, DH*0.28, s[0]); gl.rotation.y=s[1]; pivot.add(gl);
  });
  const kn=new THREE.Mesh(new THREE.SphereGeometry(0.15,6,5), knobMat);
  kn.position.set(DW*0.86, -0.2, 0.2); pivot.add(kn);

  /* Pure white behind the slab. Wider and taller than the opening so
     the casing hides its edges. Glow 1 means the shader neither shades
     nor fogs it, so it stays pure white at any distance. */
  const vd=new THREE.Mesh(new THREE.PlaneGeometry(DW+0.28, DH+0.14), voidMat);
  vd.position.set(0, 0.07, -0.13);
  vd.visible=false;
  grp.add(vd);

  /* the sign, sitting on the head casing — in the house it hangs on
     the wall above, and out here there is no wall to hang it on */
  const sg=new THREE.Mesh(new THREE.BoxGeometry(DW*1.06, SIGNH, 0.2), signMat);
  sg.position.set(0, DH/2+CW+SIGNH/2, 0.06); grp.add(sg);

  grp.userData={ kind:'door', deg:0, flash:0, flashScale:0, extraMat:null };
  targets.push(grp); scene.add(grp);

  const wp=new THREE.Vector3(DX, DY, DZ);
  let leaving=false, sway=0;

  /* ── going through ──────────────────────────────────────── */
  function enter(){
    if(leaving) return;
    leaving=true;
    sway=0.0001;
    grp.userData.flash=1;
    touchSound('stone', wp, 0);
    setTimeout(function(){ touchSound('fire', wp, 4); }, 130);
    const n=document.getElementById('name');
    if(n){
      n.textContent='the door';
      n.style.color='#FFD9A0';
      n.classList.remove('show'); void n.offsetWidth; n.classList.add('show');
    }
    /* hold the fade back a moment, so you see the door open onto the
       white before the white takes the whole screen */
    const fd=document.getElementById('fade');
    setTimeout(function(){ if(fd) fd.classList.add('on'); }, 340);
    setTimeout(function(){ location.href=GOES_TO; }, 1150);
  }

  function update(dt,t){
    glMat.userData.uni.uGlow.value=0.82+Math.sin(t*0.9)*0.07;   // the glass breathes
    if(sway>0){                        // the door swings before you go through
      vd.visible=true;
      sway=Math.min(1, sway+dt*1.15);
      const e=1-Math.pow(1-sway,3);    // ease out, like a heavy door
      pivot.rotation.y=-e*1.25;
    }
  }

  return { group:grp, enter:enter, update:update };
})();

/* ══════════════════════════════════════════════════════════════
   INPUT
   ══════════════════════════════════════════════════════════════ */
let yaw=Math.PI, pitch=-0.03;
const move={x:0,y:0};
let stickId=null, lookId=null, lx=0, ly=0, moved=0, at=0;
const stick=document.getElementById('stick'), knob=document.getElementById('knob'), R=44;

function stickSet(t){
  const r=stick.getBoundingClientRect();
  let dx=t.clientX-(r.left+r.width/2), dy=t.clientY-(r.top+r.height/2);
  const d=Math.hypot(dx,dy);
  if(d>R){ dx=dx/d*R; dy=dy/d*R; }
  knob.style.transform='translate('+dx+'px,'+dy+'px)';
  move.x=dx/R; move.y=dy/R;
}
function stickClear(){ knob.style.transform=''; move.x=move.y=0;
  stick.classList.remove('on'); stickId=null; }
stick.addEventListener('touchstart',function(e){
  e.preventDefault(); e.stopPropagation();
  const t=e.changedTouches[0]; stickId=t.identifier; stick.classList.add('on'); stickSet(t);
},{passive:false});
stick.addEventListener('touchmove',function(e){
  e.preventDefault(); e.stopPropagation();
  for(const t of e.changedTouches) if(t.identifier===stickId) stickSet(t);
},{passive:false});
['touchend','touchcancel'].forEach(function(ev){
  stick.addEventListener(ev,function(e){
    e.preventDefault(); e.stopPropagation();
    for(const t of e.changedTouches) if(t.identifier===stickId) stickClear();
  },{passive:false});
});

cv.addEventListener('touchstart',function(e){
  e.preventDefault(); if(lookId!==null) return;
  const t=e.changedTouches[0];
  lookId=t.identifier; lx=t.clientX; ly=t.clientY; moved=0; at=performance.now();
},{passive:false});
cv.addEventListener('touchmove',function(e){
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier!==lookId) continue;
    const dx=t.clientX-lx, dy=t.clientY-ly;
    moved+=Math.hypot(dx,dy);
    yaw-=dx*0.0042; pitch-=dy*0.0042;
    pitch=Math.max(-1.15,Math.min(0.95,pitch));
    lx=t.clientX; ly=t.clientY;
  }
},{passive:false});
['touchend','touchcancel'].forEach(function(ev){
  cv.addEventListener(ev,function(e){
    e.preventDefault();
    for(const t of e.changedTouches){
      if(t.identifier!==lookId) continue;
      if(moved<12 && performance.now()-at<380) shoot(t.clientX,t.clientY);
      lookId=null;
    }
  },{passive:false});
});
document.addEventListener('gesturestart',function(e){ e.preventDefault(); });

const keys={};
addEventListener('keydown',function(e){ keys[e.key.toLowerCase()]=true; });
addEventListener('keyup',function(e){ keys[e.key.toLowerCase()]=false; });
let md=false,mx=0,my=0,mm=0;
cv.addEventListener('mousedown',function(e){ md=true; mx=e.clientX; my=e.clientY; mm=0; });
cv.addEventListener('mousemove',function(e){
  if(!md) return;
  const dx=e.clientX-mx, dy=e.clientY-my; mm+=Math.hypot(dx,dy);
  yaw-=dx*0.0042; pitch-=dy*0.0042;
  pitch=Math.max(-1.15,Math.min(0.95,pitch));
  mx=e.clientX; my=e.clientY;
});
addEventListener('mouseup',function(e){ if(md&&mm<8) shoot(e.clientX,e.clientY); md=false; });

/* ── tapping ─────────────────────────────────────────────── */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
const PRIORITY={fire:6,star:5,anemone:5,whale:5,boat:5,plant:5,stone:4,tree:3,water:1};
function owner(o){ while(o){ if(o.userData&&o.userData.kind) return o; o=o.parent; } return null; }

function shoot(cx,cy){
  ndc.x=(cx/innerWidth)*2-1; ndc.y=-(cy/innerHeight)*2+1;
  ray.setFromCamera(ndc,cam);
  const hits=ray.intersectObjects(targets.concat([water]),true);
  /* the door answers first, but only when it is the nearest thing
     under your finger — whatever stands in front of it still speaks */
  const near0 = hits.length ? owner(hits[0].object) : null;
  if(near0 && near0.userData.kind === 'door'){ DOOR.enter(); return; }
  let best=null,bp=-1;
  for(let i=0;i<hits.length;i++){
    const o=owner(hits[i].object); if(!o) continue;
    const p=PRIORITY[o.userData.kind]||0;
    if(p>bp){ bp=p; best=o; if(p>=6) break; }
  }
  if(!best) return;
  const k=best.userData.kind, wp=new THREE.Vector3();
  if(k==='water'){
    for(let i=0;i<hits.length;i++)
      if(owner(hits[i].object)===best){ wp.copy(hits[i].point); break; }
  } else best.getWorldPosition(wp);

  touchSound(k,wp,best.userData.deg);
  best.userData.flash=1;
  if(k==='fire'){ crackle(); setTimeout(crackle,90); setTimeout(crackle,210); }
  /* the boat answers on her horn — two notes of the same scale */
  if(k==='boat'){
    setTimeout(function(){ touchSound('boat',wp,2); }, 620);
    BOAT.horn=1.2;
  }
  /* touch a whale and she goes up for air, if she isn't already */
  if(k==='whale'){
    const w=WHALES.filter(function(q){ return q.hit===best; })[0];
    if(w) w.called=1;
    setTimeout(function(){ touchSound('whale',wp,4); }, 1500);
  }
  if(k==='tree'){
    const tr=trees.filter(function(q){ return q.g===best; })[0];
    if(tr) tr.shake=1;
  }

  const n=document.getElementById('name');
  n.textContent=LABEL[k];
  n.style.color = k==='fire'?'#FF9A3C' : k==='water'?'#9FC4CC' :
                  k==='star'?'#E07A44' : k==='anemone'?'#7FD8AC' :
                  k==='plant'?'#B8CE8A' : k==='tree'?'#7FA07A' :
                  k==='boat'?'#E06A54' : k==='whale'?'#8FB0C4' : '#C4CACE';
  n.classList.remove('show'); void n.offsetWidth; n.classList.add('show');
}

/* ══════════════════════════════════════════════════════════════
   LOOP
   ══════════════════════════════════════════════════════════════ */
const clock=new THREE.Clock();
const _fw=new THREE.Vector3(), _bp=new THREE.Vector3();
let bob=0, nextCrackle=0, nextRaven=6;

function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;

  let ix=move.x, iy=move.y;
  if(keys['w']||keys['arrowup'])   iy-=1;
  if(keys['s']||keys['arrowdown']) iy+=1;
  if(keys['a']||keys['arrowleft']) ix-=1;
  if(keys['d']||keys['arrowright'])ix+=1;
  const mag=Math.min(1,Math.hypot(ix,iy));
  if(mag>0.04){
    const sp=12.0*dt*mag, den=Math.hypot(ix,iy)||1;
    const nx=ix/den, ny=iy/den;
    const fx=-Math.sin(yaw), fz=-Math.cos(yaw);
    const rx= Math.cos(yaw), rz=-Math.sin(yaw);
    cam.position.x+=(fx*(-ny)+rx*nx)*sp;
    cam.position.z+=(fz*(-ny)+rz*nx)*sp;
    bob+=sp*0.9;
  }
  cam.position.x=Math.max(-140,Math.min(140,cam.position.x));
  cam.position.z=Math.max(1.5,Math.min(210,cam.position.z));
  cam.position.y=groundH(cam.position.x,cam.position.z)+2.3+Math.sin(bob*1.9)*0.055*mag;
  cam.rotation.y=yaw; cam.rotation.x=pitch;

  sky.position.copy(cam.position);

  /* flames */
  flames.forEach(function(f){
    const u=f.userData;
    const s=u.sc*(0.72+Math.sin(t*u.sp+u.ph)*0.28+Math.random()*0.09);
    f.scale.set(s,s*(1.05+Math.sin(t*u.sp*1.7+u.ph)*0.22),1);
    f.position.y=1.1+Math.sin(t*u.sp*0.6+u.ph)*0.22;
    f.getWorldPosition(_fw);
    f.lookAt(cam.position.x, _fw.y, cam.position.z);
  });
  uFireI.value=0.86+Math.sin(t*7.3)*0.09+Math.sin(t*13.1)*0.05+Math.random()*0.04;

  /* anemones sway */
  anemones.forEach(function(a){
    a.rotation.z=Math.sin(t*0.8+a.userData_wob)*0.06;
    a.rotation.x=Math.cos(t*0.7+a.userData_wob)*0.05;
  });

  /* ── the troller, working up the channel ──────────────────── */
  (function(){
    const B=BOAT;
    B.x += B.dir*dt*6.2;
    if(B.x> 260){ B.x= 260; B.dir=-1; }
    if(B.x<-260){ B.x=-260; B.dir= 1; }
    B.g.position.x=B.x;
    B.g.rotation.y=B.dir>0?Math.PI/2:-Math.PI/2;
    /* she rides the same swell the water is drawn with */
    const sw=Math.sin(B.x*0.062+t*0.72)*0.34 + Math.sin((B.x+B.z)*0.041+t*0.47)*0.44;
    B.g.position.y=-0.2+sw*0.55+B.DEPTH*0.16;
    B.g.rotation.z=Math.sin(t*0.61+1.1)*0.045;
    B.g.rotation.x=Math.sin(t*0.83)*0.030;
    B.hit.position.set(B.x, 3, B.z);
    /* bow spray flickers rather than animates */
    B.bow.forEach(function(q){
      const s=q.userData.sc*(0.72+Math.sin(t*5.2+q.userData.ph)*0.3+Math.random()*0.14);
      q.scale.set(s,s*0.8,1);
      q.quaternion.copy(cam.quaternion);
    });
    if(boatPan){
      _bp.set(B.x,1.2,B.z); movePan(boatPan,_bp);
      const d=Math.hypot(cam.position.x-B.x, cam.position.z-B.z);
      const lvl=0.30*Math.max(0,1-d/330);
      boatGain.gain.setTargetAtTime(0.0001+lvl,ac.currentTime,0.6);
    }
    if(B.horn>0){
      B.horn-=dt;
      if(B.horn<=0 && ready) touchSound('boat',new THREE.Vector3(B.x,3,B.z),0);
    }
  })();

  /* ── the humpbacks ────────────────────────────────────────── */
  WHALES.forEach(function(w){
    /* she keeps swimming whether or not she is up */
    w.x += Math.sin(w.head)*w.spd*dt;
    w.z += Math.cos(w.head)*w.spd*dt;
    if(w.x> 150) w.x=-150; if(w.x<-150) w.x=150;
    if(w.z>-52)  w.z=-165; if(w.z<-170) w.z=-56;

    let ph=((t/w.period)+w.phase)%1;
    /* a tap brings her up early — jump the cycle to just before the blow */
    if(w.called){ w.phase=(w.phase + (0.30-ph)+1)%1; w.called=0; ph=0.30; }

    /* how much of her is out: a bump centred just after a third. At the
       peak the back, hump and dorsal are well clear of the water. */
    const d0=ph-0.42;
    const surf=Math.exp(-(d0*d0)/(2*0.098*0.098));
    let y=-6.2+8.0*surf;
    let pit=0;
    if(ph>0.28 && ph<=0.42){
      pit=-((ph-0.28)/0.14)*0.28;                    // nose up on the rise
    } else if(ph>0.50 && ph<0.72){
      const k=(ph-0.50)/0.22;
      pit=Math.sin(k*Math.PI)*1.28;                  // head down, flukes up
      y-=Math.sin(k*Math.PI)*2.0;                    // sounding as she goes
    }
    w.g.position.set(w.x, y, w.z);
    w.g.rotation.set(pit, w.head, Math.sin(t*0.5+w.phase*9)*0.07);
    w.hit.position.set(w.x, Math.max(-1.0,y)+2.4, w.z);

    /* the blowhole clears the water at about a third of the cycle */
    if(!w.blown && ph>0.355 && ph<0.44 && surf>0.66){
      w.blown=true;
      const bx=w.x+Math.sin(w.head)*1.8*w.scale;
      const bz=w.z+Math.cos(w.head)*1.8*w.scale;
      blow(bx, 1.4, bz, 6, w.scale);
      const dd=Math.hypot(cam.position.x-w.x, cam.position.z-w.z);
      whaleBlow(new THREE.Vector3(bx,1.6,bz), Math.max(0.25,1-dd/280));
    }
    if(ph<0.30) w.blown=false;
  });

  /* the blow hangs, spreads and goes */
  blows.forEach(function(p){
    if(!p.m.visible) return;
    p.t+=dt;
    const k=p.t/p.life;
    if(k>=1){ p.m.visible=false; return; }
    p.m.position.y+=p.vy*dt*(1-k*0.82);
    p.m.position.x+=p.drift*dt;
    const s=p.s*(0.5+k*2.6);
    p.m.scale.set(s,s*(1.1+k*0.5),1);
    p.m.quaternion.copy(cam.quaternion);
    p.m.material.userData.uni.uAlpha.value=(1-k)*(1-k)*0.62;
  });

  /* the trees you knocked on take a moment to settle */
  trees.forEach(function(tr){
    const base=Math.sin(t*tr.spd+tr.ph)*0.006;
    if(tr.shake>0){
      tr.shake=Math.max(0,tr.shake-dt*1.5);
      tr.g.rotation.z=base+Math.sin(t*17)*0.02*tr.shake;
      tr.g.rotation.x=Math.sin(t*13+1)*0.016*tr.shake;
    } else {
      tr.g.rotation.z=base;
      tr.g.rotation.x=Math.cos(t*tr.spd*0.8+tr.ph)*0.005;
    }
  });

  /* fire pops more often when you're near it */
  const fd=Math.hypot(cam.position.x-FIRE.x,cam.position.z-FIRE.z);
  if(ready && t>nextCrackle){
    if(fd<40) crackle();
    nextCrackle=t+rnd(0.18,0.9)*(1+fd/26);
  }
  if(ready && t>nextRaven){ raven(); nextRaven=t+rnd(16,44); }
  if(fireGain) fireGain.gain.setTargetAtTime(0.16+uFireI.value*0.04, ac.currentTime, 0.2);

  /* surf up near the water, wind up in the trees */
  if(surfGain){
    const near=1-Math.min(1,Math.max(0,(cam.position.z-2)/70));
    surfGain.gain.setTargetAtTime(0.03+near*0.11, ac.currentTime, 0.35);
  }
  if(windGain){
    const inTrees=Math.min(1,Math.max(0,(cam.position.z-45)/60));
    windGain.gain.setTargetAtTime(0.028+inTrees*0.07, ac.currentTime, 0.5);
  }

  targets.forEach(function(o){
    const u=o.userData;
    if(u.flash>0){
      u.flash=Math.max(0,u.flash-dt*2.3);
      o.traverse(function(m){
        if(m.material&&m.material.userData&&m.material.userData.uni)
          m.material.userData.uni.uFlash.value=u.flash*0.5;
      });
    }
  });

  DOOR.update(dt,t);
  allMats.forEach(function(m){ m.userData.uni.uTime.value=t; });
  updateListener(cam);
  renderer.render(scene,cam);
}

document.getElementById('go').addEventListener('click',function(){
  if(!ready){ try{ ready=initAudio(); }catch(e){ ready=false; }
    if(ready && ac.state==='suspended') ac.resume(); }
  if(ready){ try{ MUSIC.start(); }catch(e){} }
  const s=document.getElementById('start');
  s.classList.add('gone');
  setTimeout(function(){ s.style.display='none'; },1050);
});
document.addEventListener('visibilitychange',function(){
  if(!ac) return;
  if(document.hidden) ac.suspend(); else ac.resume();
});

fit(); tick();
})();
</script>
</body>
</html>
