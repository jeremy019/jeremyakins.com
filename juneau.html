  n.textContent=txt; n.style.color=col||'#FFFFFF';
  n.classList.remove('show'); void n.offsetWidth; n.classList.add('show');

function owner(o){ while(o){ if(o.userData&&o.userData.kind) return o; o=o.parent; } return null; }
function shoot(cx,cy){
  if(riding) { tryExit(); return; }
  ndc.x=(cx/innerWidth)*2-1; ndc.y=-(cy/innerHeight)*2+1;
  ray.setFromCamera(ndc,cam);
  const hits=ray.intersectObjects(targets,true);
  let best=null,bp=-1;
  for(let i=0;i<hits.length;i++){
    const o=owner(hits[i].object); if(!o) continue;
    const p=PRIORITY[o.userData.kind]||0;
    if(p>bp){ bp=p; best=o; if(p>=11) break; }
  }
  if(!best) return;
  const k=best.userData.kind, wp=new THREE.Vector3();
  best.getWorldPosition(wp);
  best.userData.flash=1;
  if(k==='tram'){ tryBoard(best); return; }
  if(k==='raven'){
    for(let i=0;i<RAVENS.length;i++) if(RAVENS[i].g===best){
      ravenSay(wp);
      setTimeout(function(){ ravenFly(RAVENS[i], cam.position.x, cam.position.z); }, 420);
      break;
    }
    flashName(LABEL.raven, COLR.raven); return;
  }
  if(k==='eagle'){ eagleCall(wp); flashName(LABEL.eagle, COLR.eagle); return; }
  if(k==='whale'){ whaleBlow(wp); flashName(LABEL.whale, COLR.whale); return; }
  if(k==='ship'){ sail(wp); return; }
  if(k==='clock'){
    clockChime(wp, 1+((Math.floor(SKY.h)+11)%12));
    flashName(LABEL.clock, COLR.clock); return;
  }
  if(k==='water'){
    flashName(TIDE.rising?'the tide is coming in':'the tide is going out', COLR.water);
    touchSound('water',wp,1); return;
  }
  touchSound(k,wp,best.userData.deg);
  flashName(LABEL[k]||k, COLR[k]||'#FFFFFF');
}

function stationOf(p){ return p<0.035 ? 0 : (p>0.965 ? 1 : -1); }
function tryBoard(hitObj){
  let C=null;
  for(let i=0;i<TRAM.cabins.length;i++) if(TRAM.cabins[i].hit===hitObj) C=TRAM.cabins[i];
  if(!C){ flashName(LABEL.tram, COLR.tram); return; }
  const st=stationOf(C.p);
  if(st<0){ flashName('wait for it to come down','#C8B08A'); return; }
  const P=(st===0)?TRAM.BASE:TRAM.TOP;
  const d=Math.hypot(cam.position.x-P.x, cam.position.z-P.z);
  if(d>26){ flashName(LABEL.tram, COLR.tram); return; }
  riding=1; rideCab=C; rideFrom=st;
  stick.classList.add('hide');
  flashName('the tram','#F07060');
  touchSound('tram',C.g.position,2);
  if(TR.dwell>1.6) TR.dwell=1.6;
}
function tryExit(){
  if(!rideCab) return;
  const st=stationOf(rideCab.p);
  if(st<0){ flashName('not yet','#C8B08A'); return; }

}
function land(st){

    cam.position.set(TRAM.TOP.x+rnd(-3,3), TRAM.TOPDECK+1.7, TRAM.TOP.z-15);

/* ══════════════════════════════════════════════════════════════
   WHAT YOU CAN STAND ON
   ══════════════════════════════════════════════════════════════ */
function standH(x,z){
  /* the top station deck */
  if(Math.abs(x-TRAM.TOP.x)<15.5 && z>TRAM.TOP.z-27 && z<TRAM.TOP.z-3.4) return TRAM.TOPDECK;
  if(z<SHORE){
    /* the boarding platform inside the tram house */
    if(x>120.6 && x<135.4 && z>-66.0 && z<-54.0) return 5.55;
    if(x>-215 && x<155 && z>-72) return 5.0;            /* the seawalk       */
    if(x>8 && x<306 && z>-85 && z<-69) return 5.0;      /* the cruise dock   */
    if(x<-152 && z>-152) return TIDE.y+1.35;            /* the harbour floats*/
    return 5.0;
  }
  /* the four steps up off the shore onto the boardwalk */
  if(z<-40.9){
    if(x>-212 && x<152) return SHORESTEP[clamp(Math.floor(-41.0-z),0,3)];
    return townH(x,z);                 /* past the end of it, just shore */
  }
  return groundH(x,z);
}

/* ══════════════════════════════════════════════════════════════
   LOOP
   ══════════════════════════════════════════════════════════════ */
const clock=new THREE.Clock();
const _tp=new THREE.Vector3(), _fog=new THREE.Color(), _sk=new THREE.Color();
const _cp=new THREE.Vector3(), _cp2=new THREE.Vector3();
let bob=0, lastStep=0, wasHour=-1;
let nextHal=8, nextGull=20, nextHud=18, hudN=0, metaS='';
const HUDLINES=[
  [((navigator.maxTouchPoints||0)>1)?'drag to look':'wasd &middot; drag to look','then look up'],
  ['tap anything','most of it answers'],
  ['the ravens here','have a lot to say'],
  ['down at the dock','the tram is running'],
  ['stay a while','the tide moves, and the light']
];
const vigEl=document.getElementById('vig'), metaEl=document.getElementById('meta');

function collide(p){
  for(let i=0;i<BOXES.length;i++){
    const b=BOXES[i];
    const dx=p.x-b[0], dz=p.z-b[1];
    const ex=b[2]+0.42, ez=b[3]+0.42;
    if(Math.abs(dx)<ex && Math.abs(dz)<ez){
      const px=ex-Math.abs(dx), pz=ez-Math.abs(dz);
      if(px<pz) p.x += (dx<0?-1:1)*px; else p.z += (dz<0?-1:1)*pz;
    }
  }
  for(let i=0;i<CIRC.length;i++){
    const c=CIRC[i];
    const dx=p.x-c.x, dz=p.z-c.z;
    const d=Math.hypot(dx,dz), rr=c.r+0.42;
    if(d<rr){
      if(d>0.0001){ p.x=c.x+dx/d*rr; p.z=c.z+dz/d*rr; }
      else { p.x=c.x+rr; p.z=c.z; }
    }
  }
}

function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;
  uTimeG.value=t;

  SKY.update(dt);
  const wind=WX.update(dt,t);

  /* ── the tide ── */
  const tph=(SKY.h/12.42)*Math.PI*2;
  const prev=TIDE.y;
  TIDE.y=(TIDE.lo+TIDE.hi)/2 + (TIDE.hi-TIDE.lo)/2*Math.sin(tph);
  TIDE.rising=TIDE.y>prev;
  uTide.value=TIDE.y;
  CHANNEL.position.y=TIDE.y;
  HARBOUR.position.y=TIDE.y;

  /* ── moving, or being moved ── */
  let mag=0;
  if(riding && rideCab){
    TRAM.at(rideCab.p,_cp);
    cam.position.set(_cp.x, _cp.y-2.05, _cp.z);
    const st=stationOf(rideCab.p);
    if(st>=0 && st!==rideFrom && TR.dwell>0.4) land(st);
    if(tramEl){
      tramEl.classList.add('on');
      const alt=Math.round(cam.position.y);
      tramEl.innerHTML='&uarr; '+alt+' m<i>tap to look &middot; tap again at the top</i>';
    }
  } else {
    let ix=move.x, iy=move.y;
    if(keys['w']||keys['arrowup'])   iy-=1;
    if(keys['s']||keys['arrowdown']) iy+=1;
    if(keys['a']||keys['arrowleft']) ix-=1;
    if(keys['d']||keys['arrowright'])ix+=1;
    mag=Math.min(1,Math.hypot(ix,iy));
    if(mag>0.04){
      const sp=11.0*dt*mag, den=Math.hypot(ix,iy)||1;
      const nx=ix/den, ny=iy/den;
      const fx=-Math.sin(yaw), fz=-Math.cos(yaw);
      const rx= Math.cos(yaw), rz=-Math.sin(yaw);
      cam.position.x+=(fx*(-ny)+rx*nx)*sp;
      cam.position.z+=(fz*(-ny)+rz*nx)*sp;
      bob+=sp*0.9;
    }
    collide(cam.position);
    /* two places you are allowed to be: the town, and the deck at the top */
    const onTop = Math.abs(cam.position.x-TRAM.TOP.x)<17 && cam.position.z>TRAM.TOP.z-32;
    if(onTop){
      cam.position.x=clamp(cam.position.x,TRAM.TOP.x-14,TRAM.TOP.x+14);
      cam.position.z=clamp(cam.position.z,TRAM.TOP.z-26.2,TRAM.TOP.z-3.8);
    } else {
      cam.position.x=clamp(cam.position.x,-282,308);
      cam.position.z=clamp(cam.position.z,-152,40);
    }
    cam.position.y=standH(cam.position.x,cam.position.z)+1.72+Math.sin(bob*1.9)*0.05*mag;
  }
  cam.rotation.y=yaw; cam.rotation.x=pitch;
  sky.position.copy(cam.position);

  const onWood = !riding && (cam.position.z<SHORE ||
                 (Math.abs(cam.position.x-TRAM.TOP.x)<15 && cam.position.z>TRAM.TOP.z-26));
  if(ready && mag>0.25 && !riding){
    const ph=Math.sin(bob*1.9);
    if(ph<-0.6 && lastStep>0){ step(onWood?1:0); lastStep=-1; }
    if(ph>0.2) lastStep=1;
  }

  /* ── haze, fog and the colour of the air ── */
  _sk.copy(uHorizon.value).lerp(uZenith.value,0.42);
  const wash=0.30*(1-uNight.value);
  _sk.setRGB(_sk.r+(1-_sk.r)*wash, _sk.g+(1-_sk.g)*wash, _sk.b+(1-_sk.b)*wash);
  _fog.copy(_sk).lerp(uCloudDrk.value, WX.cloud*0.40+WX.rain*0.26);
  uFogCol.value.copy(_fog);
  uMistCol.value.copy(_fog).lerp(uCloudLit.value, 0.34);
  const vis=1-WX.rain*0.46-WX.cloud*0.14;
  uFogNear.value=40+70*vis;
  uFogFar.value =360+1500*vis;
  renderer.setClearColor(uFogCol.value,1);
  vigEl.style.opacity=(0.16+uNight.value*0.34).toFixed(3);

  packLights(t);
  for(let i=0;i<GLOWERS.length;i++){
    const G=GLOWERS[i];
    G.u.uGlow.value=Math.min(1, G.a + G.b*uNight.value);
  }
  waterMat.uniforms.uWind.value=wind;
  for(let i=0;i<treeMats.length;i++) treeMats[i].uWind.value=wind;

  /* ── rain ── */
  RAIN.mesh.visible=WX.rain>0.012;
  if(RAIN.mesh.visible){
    RAIN.uni.uT.value=t;
    RAIN.uni.uCam.value.set(cam.position.x, cam.position.y+6, cam.position.z);
    RAIN.uni.uAmt.value=Math.min(1,WX.rain*1.15);
    RAIN.uni.uLen.value=0.9+WX.rain*1.6;
    RAIN.uni.uWind.value.set(Math.cos(2.1)*wind*2.6, Math.sin(2.1)*wind*2.6);
    RAIN.uni.uCol.value.setRGB(
      Math.min(1,uAmbCol.value.r*0.55+uSkyCol.value.r*0.7+0.20),
      Math.min(1,uAmbCol.value.g*0.55+uSkyCol.value.g*0.7+0.22),
      Math.min(1,uAmbCol.value.b*0.55+uSkyCol.value.b*0.7+0.26));
    /* whatever is over your head */
    if(riding) RAIN.uni.uRoof.value.set(cam.position.x,cam.position.z,3.2,cam.position.y+2.6);
    else if(Math.abs(cam.position.x-PAV.x)<PAV.w/2 && Math.abs(cam.position.z-PAV.z)<PAV.d/2)
      RAIN.uni.uRoof.value.set(PAV.x,PAV.z,8,PAV.y+7.8);
    else if(Math.abs(cam.position.x-CANOPY.x)<CANOPY.len/2 &&
            Math.abs(cam.position.z-CANOPY.z)<CANOPY.dep/2)
      RAIN.uni.uRoof.value.set(CANOPY.x,CANOPY.z,CANOPY.dep/2,
                               townH(CANOPY.x,CANOPY.z)+CANOPY.hi+1);
    else RAIN.uni.uRoof.value.set(0,0,0,0);
  }

  /* ── the cloud that lives on the mountain ── */
  for(let i=0;i<MIST.length;i++){
    const M=MIST[i];
    M.x += dt*M.sp*(0.4+wind*2.2);
    if(M.x>340) M.x=-340;
    const vis2=WX.band*clamp(1-Math.abs(M.y-(WX.bandY+80))/190,0,1);
    M.m.visible=vis2>0.03;
    if(M.m.visible){
      M.m.position.set(M.x, M.y+Math.sin(t*0.11+M.ph)*8, M.z);
      M.m.quaternion.copy(cam.quaternion);
      M.m.material.userData.uni.uAlpha.value=vis2*0.42;
    }
  }

  /* ── the tram ── */
  (function(){
    if(TR.dwell>0){ TR.dwell-=dt; }
    else {
      TR.p += dt/TR.RIDE*TR.dir;
      if(TR.p>=1){ TR.p=1; TR.dir=-1; TR.dwell=TR.DWELL; }
      if(TR.p<=0){ TR.p=0; TR.dir= 1; TR.dwell=TR.DWELL; }
    }
    for(let i=0;i<TRAM.cabins.length;i++){
      const C=TRAM.cabins[i];
      C.p = i===0 ? TR.p : 1-TR.p;
      TRAM.at(C.p,_cp2);
      C.g.position.copy(_cp2);
      C.hit.position.copy(_cp2); C.hit.position.y-=2.2;
      C.light.x=_cp2.x; C.light.y=_cp2.y-2.4; C.light.z=_cp2.z;
    }
    if(tramGain){
      const moving=(TR.dwell<=0)?1:0;
      tramGain.gain.setTargetAtTime(0.0001+moving*0.055, ac?ac.currentTime:0, 0.5);
      TRAM.at(clamp(TR.p,0.02,0.98),_cp2); movePan(tramPan,_cp2);
    }
  })();

  /* ── everything alive ── */
  const fw=0.5+wind*2.4;
  for(let i=0;i<FLAGS.length;i++){
    const F=FLAGS[i];
    F.root.rotation.y=Math.sin(t*F.spd*(0.7+wind*1.5)+F.ph)*0.16*fw;
    F.j.rotation.y=Math.sin(t*F.spd*(0.7+wind*1.5)+F.ph-0.9)*0.40*fw;
  }
  for(let i=0;i<RAVENS.length;i++) ravenUpdate(RAVENS[i],dt,t);
  EAGLE.t-=dt;
  EAGLE.body.rotation.y=Math.sin(t*0.35+EAGLE.ph)*0.30;
  if(EAGLE.t<=0){ EAGLE.t=rnd(30,90); if(ready) eagleCall(EAGLE.g.position); }
  for(let i=0;i<GULLS.length;i++){
    const G=GULLS[i];
    G.a += dt*G.sp;
    G.g.position.set(G.cx+Math.cos(G.a)*G.r, G.y+Math.sin(t*0.5+G.ph)*2.4,
                     G.cz+Math.sin(G.a)*G.r*0.72);
    G.g.rotation.y=-G.a+Math.PI/2;
    G.g.rotation.z=Math.sin(G.a)*0.22;
    const fl=Math.sin(t*4.6+G.ph)*0.5;
    G.wings[0].rotation.z=-fl; G.wings[1].rotation.z=fl;
  }
  nextGull-=dt;
  if(nextGull<=0){ nextGull=rnd(14,44);
    if(ready) gullCry(GULLS[(Math.random()*GULLS.length)|0].g.position); }
  agents.forEach(function(a){ a.update(dt); });

  /* ── the whale, which does not care whether you are watching ── */
  (function(){
    const W=WHALE;
    if(W.t<0){
      W.next-=dt;
      if(W.next<=0){
        W.next=rnd(70,220); W.t=0;
        W.x=rnd(-180,180); W.z=rnd(-330,-140); W.dir=Math.random()<0.5?1:-1;
        W.g.visible=true; W.hit.visible=true;
      }
      return;
    }
    W.t+=dt;
    const k=W.t/13;
    if(k>=1){ W.t=-1; W.g.visible=false; W.hit.visible=false; return; }
    /* three breaths, then the tail, then gone */
    const surf=Math.sin(clamp(k*3.4,0,1)*Math.PI)*1.0;
    const arch=Math.sin(k*Math.PI*3.0);
    W.g.position.set(W.x+W.dir*k*44, TIDE.y-1.6+arch*1.5, W.z+k*10);
    W.g.rotation.y=W.dir>0?Math.PI/2:-Math.PI/2;
    W.g.rotation.x=-arch*0.28;
    W.fluke.rotation.x=clamp((k-0.80)*7,0,1)*1.25;
    W.hit.position.copy(W.g.position);
    if(ready && W.t>0.1 && W.t<0.2) whaleBlow(W.g.position);
    if(ready && Math.abs(k-0.34)<0.008) whaleBlow(W.g.position);
    if(ready && Math.abs(k-0.60)<0.008) whaleBlow(W.g.position);
    if(W.t<0.6) puff(W.g.position.x, TIDE.y+1.4, W.g.position.z, 2.4, 2.4);
  })();

  /* ── the Beaver ── */
  (function(){
    const P=PLANE;
    if(P.t<0){
      P.next-=dt;
      if(P.next<=0){ P.next=rnd(90,240); P.t=0; P.g.visible=true; P.hit.visible=true;
        if(ready){ _tp.set(-240,4,-190); touchSound('plane',_tp,1); } }
      return;
    }
    P.t+=dt;
    const k=P.t/22;
    if(k>=1){ P.t=-1; P.g.visible=false; P.hit.visible=false; return; }
    const x=-260+k*620;
    const lift=clamp((k-0.30)/0.55,0,1);
    P.g.position.set(x, TIDE.y+1.2+lift*lift*116, -186+k*54);
    P.g.rotation.y=Math.PI/2;
    P.g.rotation.z=-lift*0.12;
    P.g.rotation.x=-lift*0.13;
    P.hit.position.copy(P.g.position);
    if(k<0.34 && Math.random()<dt*22) puff(x-4,TIDE.y+0.8,-186+k*54,3.0,1.5);
  })();

  /* ── cars on Egan ── */
  for(let i=0;i<CARS.length;i++){
    const C=CARS[i];
    C.g.position.x += C.dir*C.spd*dt;
    if(C.g.position.x>C.x1) C.g.position.x=C.x0;
    if(C.g.position.x<C.x0) C.g.position.x=C.x1;
    C.g.position.y=townH(C.g.position.x,C.z);
    if(C.lit){ C.lit.x=C.g.position.x+C.dir*3; C.lit.z=C.z; C.lit.y=C.g.position.y+1.2; }
  }

  /* ── the clock ── */
  (function(){
    const hh=(SKY.h%12)/12*Math.PI*2, mm2=(SKY.h%1)*Math.PI*2;
    for(let i=0;i<CLOCK.hands.length;i++){
      CLOCK.hands[i].h.rotation.z=-hh;
      CLOCK.hands[i].m.rotation.z=-mm2;
    }
    const hr=Math.floor(SKY.h);
    if(hr!==wasHour){
      if(wasHour>=0 && ready){
        _tp.set(CLOCK.x,CLOCK.y+6.1,CLOCK.z);
        clockChime(_tp, 1+((hr+11)%12));
      }
      wasHour=hr;
    }
  })();

  puffs.forEach(function(p){
    if(!p.m.visible) return;
    p.t+=dt;
    const k=p.t/p.life;
    if(k>=1){ p.m.visible=false; return; }
    p.m.position.y+=dt*0.9;
    const s=p.s*(0.6+k*1.8); p.m.scale.set(s,s,1);
    p.m.quaternion.copy(cam.quaternion);
    p.m.material.userData.uni.uAlpha.value=(1-k)*(1-k)*0.5;
  });

  /* ── what you can hear ── */
  if(ready){
    const now=ac.currentTime;
    const nk=uNight.value;
    airLP.frequency.setTargetAtTime(riding?1700:15000, now, 0.4);
    cabinGain.gain.setTargetAtTime(riding?0.055:0.0001, now, 0.5);
    const rn=WX.rain;
    const shelter=riding?0.25:1;
    rainLo.gain.setTargetAtTime(Math.max(0.0001, rn*0.16*shelter), now, 0.7);
    rainHi.gain.setTargetAtTime(Math.max(0.0001, rn*rn*0.075*shelter), now, 0.7);
    rainRoof.gain.setTargetAtTime(Math.max(0.0001, rn*0.05*(riding?1.6:0.5)), now, 0.6);
    rainWood.gain.setTargetAtTime(Math.max(0.0001, rn*0.075*(onWood?1:0.12)), now, 0.5);
    windGain.gain.setTargetAtTime(
      Math.max(0.0001,(0.010+WX.wind*0.075*WX.gust)*(1+cam.position.y/240)), now, 0.9);
    windFilt.frequency.setTargetAtTime(380+cam.position.y*1.6, now, 1.2);
    seaGain.gain.setTargetAtTime(0.055+WX.wind*0.045, now, 0.8);
    trafficGain.gain.setTargetAtTime((0.030-nk*0.016)*(riding?0.3:1), now, 0.7);
    townGain.gain.setTargetAtTime(Math.max(0.0005,(0.021-nk*0.012)*(riding?0.2:1)), now, 0.7);
    shipGain.gain.setTargetAtTime(SHIP.on?0.075:0.0001, now, 0.9);
    const dBar=Math.hypot(cam.position.x-56, cam.position.z+11);
    barGain.gain.setTargetAtTime(Math.max(0.0001, 0.16*clamp(1-dBar/26,0,1)*(0.4+nk*0.6)), now, 0.5);
    barLP.frequency.setTargetAtTime(600+clamp(1-dBar/16,0,1)*1900, now, 0.5);
    nextHal-=dt;
    if(nextHal<=0){ nextHal=rnd(2.5,9)/(0.4+WX.wind); halyard(); }
    /* the ship says something now and then */
    SHIP.hornT-=dt;
    if(SHIP.hornT<=0){
      SHIP.hornT=rnd(150,420);
      _tp.set(SHIP.x,40,SHIP.z); shipHorn(_tp,false);
      setTimeout(function(){ flashName('she is going','#F0E4D0'); }, 900);
    }
  }

  targets.forEach(function(o){
    const u=o.userData;
    if(u.flash>0){
      u.flash=Math.max(0,u.flash-dt*2.3);
      o.traverse(function(m){
        if(m.material&&m.material.userData&&m.material.userData.uni)
          m.material.userData.uni.uFlash.value=u.flash*0.5;
      });
    }
  });

  /* ── the corner that tells you where you are ── */
  if(metaEl){
    const hh=Math.floor(SKY.h), mm3=Math.floor((SKY.h%1)*60);
    const s2=(hh<10?'0':'')+hh+':'+(mm3<10?'0':'')+mm3;
    const wname=['clear','low cloud','rain','southeaster'][WX.mode];
    const tname=TIDE.rising?'flood':'ebb';
    const alt=Math.round(cam.position.y-1.7);
    const str=s2+'<br><b>'+wname+' &middot; '+tname+(alt>40?(' &middot; '+alt+' m'):'')+'</b>';
    if(str!==metaS){ metaEl.innerHTML=str; metaS=str; }
  }
  nextHud-=dt;
  if(nextHud<=0){
    nextHud=19;
    const el=document.getElementById('hud');
    if(el){
      el.style.opacity='0';
      setTimeout(function(){
        hudN=(hudN+1)%HUDLINES.length;
        el.innerHTML=HUDLINES[hudN][0]+'<br>'+HUDLINES[hudN][1];
        el.style.opacity='1';
      },900);
    }
  }

  updateListener(cam);
  renderer.render(scene,cam);
}

/* small white things */
const puffs=[];
for(let i=0;i<14;i++){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(1,1),
      ps1({map:T.puff, cutout:0.02, transparent:true, ambient:1, glow:1,
           depthWrite:false, side:THREE.DoubleSide, wet:0}));
  m.visible=false; m.renderOrder=6; scene.add(m);
  puffs.push({m:m, t:0, life:1, s:1});
}
function puff(x,y,z,s,life){
  for(let i=0;i<puffs.length;i++){
    const p=puffs[i];
    if(!p.m.visible){
      p.m.visible=true; p.m.position.set(x,y,z);
      p.t=0; p.life=life||1.2; p.s=s||0.8; return;
    }
  }
}

/* Sound cannot start until the browser has seen a gesture, so it
   waits here for the first touch, click or key instead of behind a
   door you have to open. */
(function(){
  let woken=false;
  function wake(){
    if(woken) return;
    woken=true;
    if(!ready){ try{ ready=initAudio(); }catch(e){ ready=false; }
      if(ready && ac.state==='suspended') ac.resume(); }
    if(ready) setTimeout(function(){ ravenSay(new THREE.Vector3(-61,6.2,-12)); }, 3200);
  }
  ['pointerdown','mousedown','touchstart','keydown'].forEach(function(ev){
    addEventListener(ev, wake, {capture:true, passive:true});
  });
})();
document.addEventListener('visibilitychange',function(){
  if(!ac) return;
  if(document.hidden) ac.suspend(); else ac.resume();
});

fit(); tick();
})();
</script>
</body>
