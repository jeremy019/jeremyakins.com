  while(i<PAL.length-2&&h>PAL[i+1].h) i++;
  const A=PAL[i], B=PAL[i+1];
  const t=clamp((h-A.h)/(B.h-A.h),0,1), s=t*t*(3-2*t);
  mix3(CUR.zen,A.zen,B.zen,s); mix3(CUR.mid,A.mid,B.mid,s);
  mix3(CUR.hor,A.hor,B.hor,s); mix3(CUR.glow,A.glow,B.glow,s);
  mix3(CUR.haze,A.haze,B.haze,s);
  CUR.cloud=lerp(A.cloud,B.cloud,s); CUR.sunI=lerp(A.sunI,B.sunI,s);
}

/* ══════════════════════════════════════════════════════════════
   THE LOOP
   ══════════════════════════════════════════════════════════════ */
const clock=new THREE.Clock();
const _p=new THREE.Vector3();
const metaEl=document.getElementById('meta'), hudEl=document.getElementById('hud'),
      vigEl=document.getElementById('vig');
const fogMat=FOGQ.length?FOGQ[0].m.material:null;
const glowU=window.__glowU;
let metaS='', stepT=0, hudN=0, nextHud=15;
let inside=0, spinLast=0, mtnSaid=0, clearSaid=0, loupeSaid=0, litSaid=0, hello=0, doorSaid=0;
const HUDLINES=[
  [QUAL.touch?'drag to look':'wasd &middot; drag to look','the stick walks'],
  ['there are stairs in the core','they go down to the floor that turns'],
  ['the telescopes work','a quarter each, and they are already paid'],
  ['lean on the glass','all forty-eight of them tilt out'],
  ['wait for the fog','it goes off like a lid coming away'],
  ['the mountain is one-five-zero','over your left shoulder, and enormous'],
  ['stay until it is dark','the whole basin comes on at once']
];
function airSay(){
  if(SKY.fog>0.72) return 'fog &middot; the city is under it';
  if(SKY.fog>0.24) return 'lifting';
  if(SKY.night>0.55) return 'clear &middot; and lit';
  if(SKY.night>0.10) return 'clear &middot; the light going';
  return 'clear &middot; ninety kilometres';
}

function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),0.05);
  const T2=clock.elapsedTime;
  U.time.value=T2;

  /* ── the hour ───────────────────────────────────────────── */
  SKY.rate=SKY.h<8.75?0.0094:0.0300;
  SKY.h+=SKY.rate*dt;
  if(SKY.h>23.45) SKY.h=23.45;
  setHour(SKY.h);
  setFog(SKY.h);
  palette(SKY.h);

  /* ── what the light is doing ────────────────────────────── */
  const day=clamp(SKY.sunY*3.2+0.32,0,1);
  const warm=1-clamp(Math.max(SKY.sunY,0)/0.42,0,1);
  _sunC.setRGB(lerp(1.04,1.54,warm), lerp(1.00,0.60,warm), lerp(0.96,0.28,warm));
  _sunC.multiplyScalar(CUR.sunI*day);
  U.sunCol.value.copy(_sunC);
  U.ambCol.value.setRGB(CUR.mid[0],CUR.mid[1],CUR.mid[2]).multiplyScalar(lerp(0.40,1.05,day));
  U.gndCol.value.setRGB(CUR.hor[0]*0.44,CUR.hor[1]*0.44,CUR.hor[2]*0.46)
              .multiplyScalar(lerp(0.18,1.0,day));
  /* after dark the top house is lit from its own soffit, not from the sky */
  /* the soffit lights are on whenever the sun is not doing the work */
  const lit=Math.max(SKY.night*0.40,(1-day)*0.26);
  U.ambCol.value.r+=0.96*lit; U.ambCol.value.g+=0.72*lit; U.ambCol.value.b+=0.44*lit;
  U.gndCol.value.r+=0.70*lit; U.gndCol.value.g+=0.52*lit; U.gndCol.value.b+=0.32*lit;
  U.hazeCol.value.setRGB(CUR.haze[0],CUR.haze[1],CUR.haze[2]).multiplyScalar(lerp(0.16,1.0,day));
  U.glowCol.value.setRGB(CUR.glow[0],CUR.glow[1],CUR.glow[2]).multiplyScalar(lerp(0.20,1.0,day));
  U.fogCol.value.setRGB(CUR.hor[0],CUR.hor[1],CUR.hor[2]).multiplyScalar(lerp(0.14,1.0,day));
  /* on the morning it is all still in, the far distance is the colour of it */
  U.hazeCol.value.lerp(U.fogCol.value,SKY.fog*0.36);
  skyU.uZen.value.setRGB(CUR.zen[0],CUR.zen[1],CUR.zen[2]).multiplyScalar(lerp(0.12,1.0,day));
  skyU.uMid.value.setRGB(CUR.mid[0],CUR.mid[1],CUR.mid[2]).multiplyScalar(lerp(0.13,1.0,day));
  skyU.uHor.value.setRGB(CUR.hor[0],CUR.hor[1],CUR.hor[2]).multiplyScalar(lerp(0.13,1.0,day));
  skyU.uGlow.value.copy(U.glowCol.value);
  skyU.uCloud.value=CUR.cloud;
  skyU.uFogK.value=SKY.fog*0.58;
  skyU.uFogC.value.copy(U.fogCol.value);
  if(glowU) glowU.uFogK.value=SKY.fog;
  renderer.setClearColor(U.fogCol.value.getHex(),1);
  vigEl.style.opacity=(0.10+SKY.night*0.44).toFixed(3);

  /* ── the floor that turns ───────────────────────────────── */
  LOUPE.spin+=dt*TAU/112;
  const dSpin=LOUPE.spin-spinLast; spinLast=LOUPE.spin;
  if(loupeRing) loupeRing.rotation.y=LOUPE.spin;

  /* ── walking ────────────────────────────────────────────── */
  let ix=move.x, iy=move.y;
  if(keys['w']||keys['arrowup'])    iy-=1;
  if(keys['s']||keys['arrowdown'])  iy+=1;
  if(keys['a']||keys['arrowleft'])  ix-=1;
  if(keys['d']||keys['arrowright']) ix+=1;
  const raw=scoped>=0?0:Math.hypot(ix,iy);
  const mag=Math.min(1,raw);
  let moved=0;
  if(mag>0.05){
    /* clamp the vector, not just its length, or diagonals run forty per
       cent faster than straight ahead */
    const k=mag/raw; ix*=k; iy*=k;
    const sp=keys['shift']?4.3:2.35;
    const sy=Math.sin(yaw), cy=Math.cos(yaw);
    const fx=-sy, fz=-cy, rx=cy, rz=-sy;
    const ox=P.x, oz=P.z;
    const c={ x:P.x+(fx*-iy+rx*ix)*sp*dt,
              z:P.z+(fz*-iy+rz*ix)*sp*dt };
    circPush(c);
    let f=floorAt(c.x,c.z,P.y,P.lvl);
    if(f){ P.x=c.x; P.z=c.z; }
    else{
      const fa=floorAt(c.x,P.z,P.y,P.lvl);
      if(fa){ P.x=c.x; f=fa; }
      else{
        const fb=floorAt(P.x,c.z,P.y,P.lvl);
        if(fb){ P.z=c.z; f=fb; }
      }
    }
    if(f){
      P.y=f.y; P.onGlass=f.glass;
      P.lvl=f.st?(f.st.t>0.5?1:0):(f.y===LOUPE.y?1:0);
    }
    moved=Math.hypot(P.x-ox,P.z-oz);
    P.dist+=moved; P.bob+=moved*2.9;
  } else P.bob+=dt*0.35;

  /* and if you are standing on the glass, the glass takes you with it */
  if(P.lvl===1){
    const rr=Math.hypot(P.x,P.z);
    if(rr>LOUPE.rSolid&&!stairAt(rr,polar(P.x,P.z))){
      /* rotation.y of +t sends a point at angle a to a-t, so the floor
         carries you the same way round it is turning */
      const ca=Math.cos(dSpin), sa=Math.sin(dSpin);
      const nx=P.x*ca+P.z*sa, nz=-P.x*sa+P.z*ca;
      P.x=nx; P.z=nz;
    }
  }
  P.ys+=(P.y-P.ys)*Math.min(1,dt*13);
  cam.position.set(P.x, P.ys+EYE+Math.sin(P.bob)*0.028, P.z);
  cam.rotation.set(pitch,yaw,0,'YXZ');
  /* the eyepiece, coming in and going out */
  fovNow+=(fovWant-fovNow)*Math.min(1,dt*(scoped>=0?3.4:5.0));
  if(Math.abs(fovNow-cam.fov)>0.01){ cam.fov=fovNow; cam.updateProjectionMatrix(); }
  stepT-=moved;
  if(stepT<=0&&moved>0.0001){ stepT=0.74; _p.set(P.x,P.y+0.1,P.z); step(_p,P.onGlass); }

  /* ── the morning, going ─────────────────────────────────── */
  if(fogMat){
    const uni=fogMat.userData.uni;
    uni.uAlpha.value=0.40*Math.pow(SKY.fog,0.7);
    const top=U.fogT.value;
    for(let i=0;i<FOGQ.length;i++){
      const Q=FOGQ[i];
      Q.m.position.x=Q.x0+Math.sin(T2*0.021+Q.ph)*Q.vx;
      Q.m.position.z=Q.z0+Math.cos(T2*0.017+Q.ph)*Q.vz;
      Q.m.position.y=top+Q.dy+Math.sin(T2*0.10+Q.ph)*3.0;
      Q.m.visible=SKY.fog>0.012;
    }
  }

  /* ── the people who came up with you ────────────────────── */
  for(let i=0;i<PEOPLE.length;i++){
    const A=PEOPLE[i];
    A.wait-=dt;
    if(A.wait<=0){ A.wait=rnd(5,18); A.spd=rnd(0.04,0.13)*(Math.random()<0.5?-1:1); }
    A.a+=A.spd*dt;
    if(A.lv===1&&A.r>LOUPE.rSolid) A.a-=dSpin;
    const x=Math.cos(A.a)*A.r, z=Math.sin(A.a)*A.r;
    A.g.position.set(x,A.y,z);
    A.g.rotation.y=-A.a+Math.PI/2;
    A.ph+=Math.abs(A.spd)*A.r*dt*3.0;
    const R=A.g.userData_rig, sw=Math.sin(A.ph)*0.44*Math.min(1,Math.abs(A.spd)*A.r*2.2);
    R.legs[0].rotation.x=sw; R.legs[1].rotation.x=-sw;
    if(!A.shot){ R.arms[0].rotation.x=-sw*0.7; R.arms[1].rotation.x=sw*0.7; }
    if(A.hit) A.hit.position.set(x,A.y+1,z);
  }

  /* ── gulls ──────────────────────────────────────────────── */
  for(let i=0;i<GULLS.length;i++){
    const B=GULLS[i];
    B.a+=B.spd*dt;
    B.ph+=dt*(5.6+Math.sin(T2*0.3+i)*1.6);
    const x=Math.cos(B.a)*B.r, z=Math.sin(B.a)*B.r;
    const y=B.y+Math.sin(T2*0.22+B.ph*0.05)*4.6;
    B.g.position.set(x,y,z);
    B.g.rotation.y=-B.a+(B.spd>0?-Math.PI/2:Math.PI/2);
    B.g.rotation.z=Math.sin(B.a*2.0)*0.22;
    B.wg.rotation.x=Math.sin(B.ph)*0.62;
    B.cry-=dt;
    if(B.cry<=0){ B.cry=rnd(6,32); if(ready&&B.r<110) gullCry(x,y,z,Math.random()<0.4); }
  }

  /* ── the bay ────────────────────────────────────────────── */
  for(let i=0;i<BOATS.length;i++){
    const S=BOATS[i];
    S.t+=S.v*dt*S.dir;
    if(S.t>1){ S.t=1; S.dir=-1; } else if(S.t<0){ S.t=0; S.dir=1; }
    const x=lerp(S.x0,S.x1,S.t);
    S.g.position.set(x,0,S.z);
    S.g.rotation.y=S.dir>0?0:Math.PI;
    S.hit.position.set(x,20,S.z);
    S.horn-=dt;
    if(S.horn<=0){ S.horn=rnd(30,90); if(ready) ferryHorn(x,S.z); }
  }

  /* ── the wheel, and the boat leaving Colman Dock ────────── */
  if(WHEEL&&WHEEL.spin) WHEEL.spin.rotation.z+=dt*0.052;
  if(!FERRY.sailing){
    FERRY.t+=dt/300;
    if(FERRY.t>1.06) FERRY.t=-0.06;
  }
  (function(){
    const d=clamp(FERRY.t,0,1)*FERRY.span;
    const x=FERRY.x0+FERRY.hx*d, z=FERRY.z0+FERRY.hz*d;
    FERRY.g.position.set(x,0,z);
    FERRY.g.rotation.y=FERRY.yaw;
    FERRY.hit.position.set(x,24,z);
    FERRY.hit.rotation.y=FERRY.yaw;
    FERRY.g.visible=FERRY.t>-0.04&&FERRY.t<1.04;
    FERRY.horn-=dt;
    if(FERRY.horn<=0){ FERRY.horn=rnd(42,110);
      if(ready&&FERRY.g.visible) ferryHorn(x,z); }
  })();

  /* ── something off the lake ─────────────────────────────── */
  if(FPLANE.active){
    FPLANE.t+=dt/46;
    if(FPLANE.t>=1){ FPLANE.active=false; FPLANE.next=rnd(26,70); FPLANE.g.visible=false;
                     FPLANE.hit.position.set(0,-9000,0); }
    else{
      const t=FPLANE.t;
      const x=lerp(240,2450,t), z=lerp(-520,-3150,t), y=lerp(34,220,Math.pow(t,0.75));
      FPLANE.g.position.set(x,y,z);
      /* nose along the run: local +x is forward */
      FPLANE.g.rotation.set(0,Math.atan2(3150-520,2450-240),-0.10);
      FPLANE.hit.position.set(x,y,z);
    }
  } else {
    FPLANE.next-=dt;
    if(FPLANE.next<=0){
      FPLANE.active=true; FPLANE.t=0; FPLANE.g.visible=true;
      if(ready) planeDrone(600,60,-900);
    }
  }

  /* ── the counterweights, going the other way ────────────── */
  for(let i=0;i<WEIGHTS.length;i++){
    const W=WEIGHTS[i];
    const u=((T2*0.045+W.ph)%1);
    const yy=LOUPE.y-3.0-(W.dir>0?u:1-u)*74;
    W.m.position.set(W.x,yy,W.z);
  }

  /* ── whatever you last touched, cooling off ─────────────── */
  for(let i=0;i<targets.length;i++){
    const u=targets[i].userData;
    if(u&&u.flash>0){
      u.flash=Math.max(0,u.flash-dt*2.2);
      const o=targets[i];
      if(o.material&&o.material.userData&&o.material.userData.uni)
        o.material.userData.uni.uFlash.value=u.flash*0.45;
      else if(o.children&&o.children.length) o.traverse(function(c){
        if(c.material&&c.material.userData&&c.material.userData.uni)
          c.material.userData.uni.uFlash.value=u.flash*0.45;
      });
    }
  }

  /* ── the sound of five hundred and twenty feet ──────────── */
  inside+=((P.lvl===1?1:0)-inside)*Math.min(1,dt*1.8);
  if(ready){
    updateListener(cam);
    const t=ac.currentTime;
    windGain.gain.setTargetAtTime(0.020+0.085*(1-inside*0.86),t,0.6);
    windFilt.frequency.setTargetAtTime(380+520*(1-inside),t,0.8);
    windHiss.gain.setTargetAtTime(0.0012+0.016*(1-inside),t,0.6);
    insideLP.frequency.setTargetAtTime(lerp(20000,1250,inside),t,0.5);
    cityGain.gain.setTargetAtTime(0.020+0.030*(1-SKY.night*0.45)*(1-SKY.fog*0.5),t,1.2);
    loupeGain.gain.setTargetAtTime(0.0001+0.052*inside,t,0.8);
    verbIn.gain.setTargetAtTime(0.12+0.24*inside,t,0.8);
  }

  /* ── the things worth saying, said once ─────────────────── */
  if(!hello&&T2>2.2){ hello=1;
    note('twenty to seven, and it is all still in',
         'the whole basin is under that &mdash; give it an hour',7.0); }
  if(!clearSaid&&SKY.fog<0.42){ clearSaid=1;
    note('it is going','the lid comes off from the south end first',6.0); }
  if(!mtnSaid&&SKY.fog<0.20){ mtnSaid=1;
    flashName('the mountain is out','#E8EEF4');
    note('the mountain is out','one-five-zero, and fourteen thousand feet of it',6.5); }
  if(!litSaid&&SKY.night>0.55){ litSaid=1;
    note('and there it is','the whole basin, all at once',6.0); }
  if(!loupeSaid&&P.lvl===1){ loupeSaid=1;
    note('five hundred feet','thirty-seven tons of glass, one turn in forty-five minutes',7.0); }
  if(!doorSaid&&P.lvl===0){
    for(let i=0;i<ST_MC.length;i++){
      const dx=P.x-Math.cos(ST_MC[i])*12.4, dz=P.z-Math.sin(ST_MC[i])*12.4;
      if(dx*dx+dz*dz<10.2){ doorSaid=1;
        note('the stairs','down to five hundred, and the floor that turns',6.0); break; }
    }
  }
  if(noteT>0){ noteT-=dt; if(noteT<=0) noteEl.classList.remove('on'); }

  /* ── the readouts ───────────────────────────────────────── */
  const hh=Math.floor(SKY.h), mi=Math.floor((SKY.h-hh)*60);
  const str=(hh<10?'0':'')+hh+':'+(mi<10?'0':'')+mi+
            '<br><b>'+(P.lvl===1?'500 ft':'520 ft')+' &middot; '+airSay()+'</b>';
  if(str!==metaS){ metaEl.innerHTML=str; metaS=str; }
  nextHud-=dt;
  if(nextHud<=0){
    nextHud=17;
    hudEl.style.opacity='0';
    setTimeout(function(){
      hudN=(hudN+1)%HUDLINES.length;
      hudEl.innerHTML=HUDLINES[hudN][0]+'<br>'+HUDLINES[hudN][1];
      hudEl.style.opacity='1';
    },900);
  }
  renderer.render(scene,cam);
}

/* Sound cannot start until the browser has seen a gesture, so it
   waits here for the first touch, click or key. */
(function(){
  let woken=false;
  function wake(){
    if(woken) return;
    woken=true;
    if(!ready){ try{ ready=initAudio(); }catch(e){ ready=false; }
      if(ready&&ac.state==='suspended') ac.resume(); }
  }
  ['pointerdown','mousedown','touchstart','keydown'].forEach(function(ev){
    addEventListener(ev,wake,{capture:true,passive:true});
  });
})();
document.addEventListener('visibilitychange',function(){
  if(!ac) return;
  if(document.hidden) ac.suspend(); else ac.resume();
});

FPLANE.g.visible=false;
setHour(SKY.h); setFog(SKY.h); palette(SKY.h);
fit();
frame();
})();
</script>
