<!DOCTYPE html>

<style>
  :root{
    --gold:#C9962C; --sound:#5D7A88; --fir:#2E4A3C; --rainier:#E8EEF4;
    --pale:#EDEFF2; --ink:#12181E; --sky:#9DB0BE;
    --display: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    height:100%; width:100%; overflow:hidden; background:#9DB0BE; color:var(--pale);
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none;
  }
  #c{ position:fixed; inset:0; display:block; touch-action:none;
      image-rendering:pixelated; image-rendering:-webkit-optimize-contrast; }
  #vig{
    position:fixed; inset:0; pointer-events:none; z-index:2; opacity:0;
    transition:opacity 2.2s ease;
    background:radial-gradient(ellipse at 50% 46%, transparent 34%, rgba(8,14,20,.70) 100%);
  }
  h1.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);
         white-space:nowrap; border:0; }
  #back{
    position:fixed; z-index:6;
    left:calc(env(safe-area-inset-left,0px) + 18px);
    top:calc(env(safe-area-inset-top,0px) + 16px);
    padding:9px 17px; background:rgba(18,24,30,.52);
    border:1px solid rgba(237,239,242,.3); color:rgba(237,239,242,.9);
    font-family:var(--mono); font-size:.58rem; letter-spacing:.2em; text-transform:uppercase;
    text-decoration:none; -webkit-appearance:none; cursor:pointer;
  }
  #back:active{ background:rgba(237,239,242,.2); }
  /* the hour, the height you are standing at, and what the air is doing */
  #meta{
    position:fixed; z-index:5; right:calc(env(safe-area-inset-right,0px) + 22px);
    top:calc(env(safe-area-inset-top,0px) + 18px); text-align:right;
    font-family:var(--mono); font-size:.66rem; letter-spacing:.20em;
    color:rgba(201,150,44,.86); pointer-events:none; line-height:1.9;
    text-shadow:0 0 12px rgba(201,150,44,.3);
  }
  #meta b{ font-weight:400; color:rgba(237,239,242,.46); }
  #name{
    position:fixed; z-index:6; left:0; right:0;
    bottom:calc(env(safe-area-inset-bottom,0px) + 176px);
    text-align:center; pointer-events:none;
    font-family:var(--display); font-style:italic; font-size:1.5rem;
    opacity:0; text-shadow:0 2px 14px rgba(8,14,20,.8); padding:0 26px;
  }
  #name.show{ animation:nm 2.6s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes nm{
    0%{opacity:0; transform:translateY(8px);} 11%{opacity:1; transform:translateY(0);}
    72%{opacity:1;} 100%{opacity:0; transform:translateY(-10px);}
  }
  #hud{
    transition:opacity .9s ease;
    position:fixed; z-index:5; right:calc(env(safe-area-inset-right,0px) + 22px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 34px); text-align:right;
    font-family:var(--mono); font-size:.58rem; letter-spacing:.18em;
    text-transform:uppercase; color:rgba(237,239,242,.5); pointer-events:none; line-height:2;
    text-shadow:0 1px 4px rgba(8,14,20,.7);
  }
  /* what the glass is standing over */
  #note{
    position:fixed; z-index:6; left:50%; transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,0px) + 112px);
    padding:10px 20px; border:1px solid rgba(237,239,242,.26);
    background:rgba(18,24,30,.5); backdrop-filter:blur(3px);
    font-family:var(--mono); font-size:.58rem; letter-spacing:.22em;
    text-transform:uppercase; color:rgba(237,239,242,.88);
    opacity:0; pointer-events:none; transition:opacity .7s ease; text-align:center;
  }
  #note.on{ opacity:1; }
  #note i{ display:block; font-style:normal; color:rgba(201,150,44,.7);
           font-size:.52rem; margin-top:5px; letter-spacing:.16em; }
  /* the coin telescope, when you have your eye to it */
  #scope{
    position:fixed; inset:0; z-index:7; pointer-events:none; opacity:0;
    transition:opacity .45s ease;
    background:radial-gradient(circle at 50% 50%, transparent 30%,
               rgba(6,10,14,.55) 40%, rgba(6,10,14,.99) 54%);
  }
  #scope.on{ opacity:1; }
  #scope b{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(62vmin,62vmin); height:min(62vmin,62vmin); border-radius:50%;
    border:1px solid rgba(237,239,242,.22); box-shadow:0 0 60px rgba(0,0,0,.6) inset;
  }
  #scope u{
    position:absolute; left:50%; top:50%; width:1px; height:26px;
    margin:-13px 0 0 0; background:rgba(237,239,242,.34); text-decoration:none;
  }
  #scope u.h{ width:26px; height:1px; margin:0 0 0 -13px; }
  #scope s{
    position:absolute; left:0; right:0; bottom:8.5%;
    text-align:center; text-decoration:none;
    font-family:var(--mono); font-size:.60rem; letter-spacing:.24em;
    text-transform:uppercase; color:rgba(201,150,44,.9);
  }
  #stick{
    position:fixed; z-index:5;
    left:calc(env(safe-area-inset-left,0px) + 22px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
    width:122px; height:122px; border-radius:50%;
    border:1px solid rgba(237,239,242,.28); background:rgba(24,34,44,.24);
    backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); touch-action:none;
    transition:opacity .5s ease;
  }
  #stick.hide{ opacity:0; pointer-events:none; }
  #knob{
    position:absolute; left:50%; top:50%; width:50px; height:50px; margin:-25px 0 0 -25px;
    border-radius:50%; border:1px solid rgba(201,150,44,.62); background:rgba(201,150,44,.16);
    transition:background .2s;
  }
  #stick.on #knob{ background:rgba(201,150,44,.34); }
  #fade{
    position:fixed; inset:0; z-index:30; background:#fff;
    opacity:0; pointer-events:none; transition:opacity .8s ease;
  }
  #fade.on{ opacity:1; }
  #err{
    position:fixed; z-index:40; left:0; right:0; top:50%; transform:translateY(-50%);
    display:none; text-align:center; padding:0 30px; pointer-events:none;
    font-family:var(--mono); font-size:.62rem; letter-spacing:.18em;
    text-transform:uppercase; opacity:.72;
  }
</style>

<body>

<h1 class="sr">Needle &mdash; the Space Needle observation deck, Seattle</h1>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="name"></div>
<div id="meta"></div>
<a id="back" href="thehouse.html">&larr; the house</a>
<div id="hud">drag to look<br>wasd or the stick to walk</div>
<div id="note"></div>
<div id="scope"><b></b><u></u><u class="h"></u><s></s></div>
<div id="stick"><div id="knob"></div></div>
<div id="fade"></div>

<div id="err"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
(function(){
if(typeof THREE==='undefined'){
  const e=document.getElementById('err');
  if(e){ e.textContent='three.js failed to load — check connection'; e.style.display='block'; }
  return;
}

function rnd(a,b){ return a+Math.random()*(b-a); }
function irnd(a,b){ return Math.floor(rnd(a,b+1)); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function sstep(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
const TAU=Math.PI*2, D2R=Math.PI/180;

/* ══════════════════════════════════════════════════════════════
   WHAT THE MACHINE CAN TAKE
   ══════════════════════════════════════════════════════════════ */
const QUAL=(function(){
  const tp=(navigator.maxTouchPoints||0)>1;
  const cores=navigator.hardwareConcurrency||4;
  const small=Math.min(innerWidth,innerHeight)<520;
  const low=tp&&(cores<=4||small);
  return { low:low, touch:tp,
           people:low?9:16, gulls:low?10:20, towers:low?1:1,
           res:low?0.54:0.68 };
})();

/* ══════════════════════════════════════════════════════════════
   WAVETABLES
   ══════════════════════════════════════════════════════════════ */
function spectrum(f,K){
  K=K||44; const real=[0], imag=[0];
  for(let k=1;k<=K;k++){ real.push(0); imag.push(f(k)); }
  return {real:real, imag:imag};
}
const WAVES={
  glass:  spectrum(function(k){ return Math.pow(k,-0.55)*(k%2?1:0.26)*Math.exp(-k/20); }),
  steel:  spectrum(function(k){ return Math.pow(k,-0.8)*Math.exp(-Math.pow((k-9)/9,2)); }),
  gold:   spectrum(function(k){
            const p=[1,2.76,5.4,8.9,13.3]; let v=0;
            for(let i=0;i<p.length;i++) if(k===Math.round(p[i])) v=Math.pow(i+1,-0.6);
            return v; }),
  floor:  spectrum(function(k){ return Math.pow(k,-1.6)*(k<7?1:0.18); }),
  scope:  spectrum(function(k){ return Math.pow(k,-0.9)*Math.exp(-Math.pow((k-6)/6,2)); }),
  city:   spectrum(function(k){ return Math.pow(k,-1.9); }),
  water:  spectrum(function(k){ return Math.pow(k,-1.2)*Math.exp(-Math.pow((k-6)/9,2)); }),
  mtn:    spectrum(function(k){ return Math.pow(k,-2.3); }),
  person: spectrum(function(k){ return Math.pow(k,-1.5)*(k<8?1:0.15); }),
  bird:   spectrum(function(k){ return Math.pow(k,-0.7)*Math.exp(-Math.pow((k-9)/8,2)); }),
  ship:   spectrum(function(k){ return Math.pow(k,-1.5)*(k<6?1:0.12); }),
  plane:  spectrum(function(k){ return Math.pow(k,-0.8)*(k<12?1:0.14); }),
  lift:   spectrum(function(k){ return Math.pow(k,-1.1)*(k<9?1:0.2); })
};
const PATCH={
  glass:  { semis: 19, dur:3.6, atk:0.004,cut:5600, q:1.1, gain:0.13, roll:9  },
  steel:  { semis:  5, dur:3.8, atk:0.01, cut:2900, q:1.8, gain:0.17, roll:11 },
  gold:   { semis:  0, dur:6.4, atk:0.004,cut:3800, q:1.2, gain:0.21, roll:12 },
  floor:  { semis:-12, dur:3.4, atk:0.02, cut: 880, q:1.5, gain:0.24, roll:10 },
  scope:  { semis:  7, dur:2.4, atk:0.01, cut:2600, q:2.0, gain:0.18, roll:8  },
  city:   { semis:-24, dur:8.0, atk:1.60, cut: 420, q:1.0, gain:0.30, roll:90 },
  water:  { semis: -5, dur:6.0, atk:0.70, cut: 760, q:1.1, gain:0.24, roll:80 },
  mtn:    { semis:-19, dur:9.5, atk:2.60, cut: 380, q:1.0, gain:0.34, roll:200},
  person: { semis: -5, dur:1.7, atk:0.01, cut:1700, q:2.0, gain:0.16, roll:8  },
  bird:   { semis: 21, dur:1.3, atk:0.01, cut:4400, q:1.6, gain:0.12, roll:14 },
  ship:   { semis:-17, dur:6.0, atk:0.30, cut: 480, q:1.2, gain:0.28, roll:120},
  plane:  { semis:  9, dur:3.2, atk:0.30, cut:1500, q:2.0, gain:0.14, roll:60 },
  lift:   { semis: -7, dur:4.4, atk:0.20, cut:1100, q:1.4, gain:0.20, roll:10 }
};
const LABEL={
  glass:'forty-eight of them, leaning out', steel:'the rail',
  gold:'the gold they never painted over', floor:'the floor, which is turning',
  scope:'a quarter, and it still works', city:'Seattle, five hundred feet down',
  water:'Elliott Bay', mtn:'the mountain is out', person:'somebody',
  bird:'a gull, up here with you', ship:'something crossing to Bainbridge',
  plane:'a float plane off the lake', lift:'the counterweight, going the other way',
  bench:'a Skyriser — lean back', oculus:'straight down the shaft',
  ferry:'the Alaska boat, going north', wheel:'the wheel on fifty-seven',
  marina:'Bell Harbor',
  roof:'the underside of the roof', core:'the way down'
};
/* D major pentatonic. It is a bright, high, ringing sort of place. */
const ROOT=50, DEG=[0,2,4,7,9,12,14,16,19,21];
function mtof(m){ return 440*Math.pow(2,(m-69)/12); }

/* ══════════════════════════════════════════════════════════════
   AUDIO
   Two rooms: out on the deck where the wind has the whole sky to
   itself, and inside the glass where it does not.
   ══════════════════════════════════════════════════════════════ */
let ac=null, ready=false, master=null, verbIn=null, airLP=null;
let windGain=null, windFilt=null, windHiss=null, cityGain=null, cityFilt=null;
let loupeGain=null, insideLP=null, outBus=null;
const WT={};

function noiseBuf(sec,smooth){
  const n=Math.floor(ac.sampleRate*sec), b=ac.createBuffer(1,n,ac.sampleRate);
  const d=b.getChannelData(0); let last=0;
  smooth=smooth===undefined?0:smooth;
  for(let i=0;i<n;i++){
    last=last*smooth+(Math.random()*2-1)*(1-smooth);
    d[i]=last*(1/(1-smooth))*0.6;
  }
  return b;
}
function band(type,f,q){
  const b=ac.createBiquadFilter(); b.type=type; b.frequency.value=f; b.Q.value=q||1; return b;
}
function panner(x,y,z,ref){
  const p=ac.createPanner();
  p.panningModel='HRTF'; p.distanceModel='inverse';
  p.refDistance=ref||12; p.maxDistance=4000; p.rolloffFactor=1;
  if(p.positionX){ p.positionX.value=x; p.positionY.value=y; p.positionZ.value=z; }
  else p.setPosition(x,y,z);
  return p;
}
function movePan(p,v){
  if(p.positionX){
    const t=ac.currentTime;
    p.positionX.setTargetAtTime(v.x,t,0.05);
    p.positionY.setTargetAtTime(v.y,t,0.05);
    p.positionZ.setTargetAtTime(v.z,t,0.05);
  } else p.setPosition(v.x,v.y,v.z);
}
function plate(sec,decay,pre){
  const n=Math.floor(ac.sampleRate*sec), b=ac.createBuffer(2,n,ac.sampleRate);
  const p=Math.floor(ac.sampleRate*(pre||0));
  for(let ch=0;ch<2;ch++){
    const d=b.getChannelData(ch);
    for(let i=p;i<n;i++){
      const t=(i-p)/(n-p);
      d[i]=(Math.random()*2-1)*Math.pow(1-t,decay)*(1-t*0.2);
    }
  }
  return b;
}
function initAudio(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return false;
  ac=new AC();
  master=ac.createGain(); master.gain.value=0.88;
  const lim=ac.createDynamicsCompressor();
  lim.threshold.value=-10; lim.knee.value=22; lim.ratio.value=6;
  lim.attack.value=0.004; lim.release.value=0.24;
  master.connect(lim); lim.connect(ac.destination);

  /* a room with a curved glass wall and a low ceiling */
  const verb=ac.createConvolver(); verb.buffer=plate(1.9,2.6,0.010);
  verbIn=ac.createGain(); verbIn.gain.value=0.22;
  const vlp=band('lowpass',4200,0.7);
  verbIn.connect(vlp); vlp.connect(verb); verb.connect(master);

  /* everything outside gets shut out when you step in through the glass */
  insideLP=band('lowpass',20000,0.5);
  outBus=ac.createGain(); outBus.gain.value=1.0;
  outBus.connect(insideLP); insideLP.connect(master);
  const ov=ac.createGain(); ov.gain.value=0.5; outBus.connect(ov); ov.connect(verbIn);

  airLP=band('lowpass',12000,0.6); airLP.connect(outBus);

  for(const k in WAVES) WT[k]=ac.createPeriodicWave(WAVES[k].real,WAVES[k].imag,{disableNormalization:false});

  /* ── the wind, which at this height is the loudest thing there is ── */
  (function wind(){
    const s=ac.createBufferSource(); s.buffer=noiseBuf(13,0.962); s.loop=true;
    windFilt=band('lowpass',520,1.3);
    windGain=ac.createGain(); windGain.gain.value=0.07;
    s.connect(windFilt); windFilt.connect(windGain); windGain.connect(outBus); s.start();
    /* and the thin edge of it, off forty-eight sheets of glass */
    const s2=ac.createBufferSource(); s2.buffer=noiseBuf(9,0.70); s2.loop=true;
    const bp=band('bandpass',2400,0.9);
    windHiss=ac.createGain(); windHiss.gain.value=0.012;
    s2.connect(bp); bp.connect(windHiss); windHiss.connect(outBus); s2.start();
    /* gusts */
    const lfo=ac.createOscillator(); lfo.frequency.value=0.071;
    const lg=ac.createGain(); lg.gain.value=0.035;
    lfo.connect(lg); lg.connect(windGain.gain); lfo.start();
    const lfo2=ac.createOscillator(); lfo2.frequency.value=0.031;
    const lg2=ac.createGain(); lg2.gain.value=180;
    lfo2.connect(lg2); lg2.connect(windFilt.frequency); lfo2.start();
  })();
  /* ── the city, a long way under your feet ── */
  (function city(){
    const s=ac.createBufferSource(); s.buffer=noiseBuf(11,0.978); s.loop=true;
    cityFilt=band('lowpass',180,0.8);
    cityGain=ac.createGain(); cityGain.gain.value=0.030;
    s.connect(cityFilt); cityFilt.connect(cityGain); cityGain.connect(outBus); s.start();
  })();
  /* ── thirty-seven tons of glass, turning ── */
  (function loupe(){
    const o=ac.createOscillator(); o.type='sine'; o.frequency.value=41;
    const o2=ac.createOscillator(); o2.type='triangle'; o2.frequency.value=82.3;
    const lp=band('lowpass',150,1.1);
    loupeGain=ac.createGain(); loupeGain.gain.value=0.0001;
    const g2=ac.createGain(); g2.gain.value=0.22;
    o.connect(lp); o2.connect(g2); g2.connect(lp);
    lp.connect(loupeGain); loupeGain.connect(master);
    o.start(); o2.start();
  })();
  return true;
}
function updateListener(cam){
  if(!ac||!ac.listener) return;
  const L=ac.listener;
  const f=new THREE.Vector3(0,0,-1).applyQuaternion(cam.quaternion);
  const u=new THREE.Vector3(0,1,0).applyQuaternion(cam.quaternion);
  if(L.positionX){
    const t=ac.currentTime;
    L.positionX.setTargetAtTime(cam.position.x,t,0.03);
    L.positionY.setTargetAtTime(cam.position.y,t,0.03);
    L.positionZ.setTargetAtTime(cam.position.z,t,0.03);
    L.forwardX.setTargetAtTime(f.x,t,0.03); L.forwardY.setTargetAtTime(f.y,t,0.03);
    L.forwardZ.setTargetAtTime(f.z,t,0.03);
    L.upX.setTargetAtTime(u.x,t,0.03); L.upY.setTargetAtTime(u.y,t,0.03);
    L.upZ.setTargetAtTime(u.z,t,0.03);
  } else {
    L.setPosition(cam.position.x,cam.position.y,cam.position.z);
    L.setOrientation(f.x,f.y,f.z,u.x,u.y,u.z);
  }
}
let voices=0;
function touchSound(kind,pos,deg){
  if(!ready||voices>16) return;
  const P=PATCH[kind]; if(!P) return;
  voices++;
  const t=ac.currentTime+0.02;
  const o=ac.createOscillator();
  if(WT[kind]) o.setPeriodicWave(WT[kind]); else o.type='triangle';
  o.frequency.value=mtof(ROOT+P.semis+DEG[deg%DEG.length]);
  const f=band('lowpass',P.cut,P.q);
  f.frequency.setValueAtTime(P.cut*0.3,t);
  f.frequency.linearRampToValueAtTime(P.cut,t+Math.max(P.atk,0.05));
  f.frequency.exponentialRampToValueAtTime(P.cut*0.28,t+P.dur);
  const g=ac.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(P.gain,t+P.atk);
  g.gain.exponentialRampToValueAtTime(0.0001,t+P.dur);
  const p=panner(pos.x,pos.y,pos.z,P.roll);
  o.connect(f); f.connect(g); g.connect(p); p.connect(airLP);
  const s=ac.createGain(); s.gain.value=0.8; p.connect(s); s.connect(verbIn);
  o.start(t); o.stop(t+P.dur+0.1);
  o.onended=function(){ voices--; };
}
/* ── a quarter going in, and the barrel turning ── */
function coin(pos){
  if(!ready) return;
  const t=ac.currentTime+0.02, p=panner(pos.x,pos.y,pos.z,5); p.connect(airLP);
  const s=ac.createGain(); s.gain.value=0.7; p.connect(s); s.connect(verbIn);
  [0,0.07,0.15].forEach(function(d,i){
    const o=ac.createOscillator(); o.type='square';
    o.frequency.value=2400+i*520+rnd(-90,90);
    const bp=band('bandpass',3000,7);
    const g=ac.createGain();
    g.gain.setValueAtTime(0.0001,t+d);
    g.gain.linearRampToValueAtTime(0.028/(1+i),t+d+0.003);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.16);
    o.connect(bp); bp.connect(g); g.connect(p); o.start(t+d); o.stop(t+d+0.2);
  });

/* ── a ferry, telling the bay it is coming ── */

/* ── gulls, which get up this high without trying ── */

/* ── a foot on glass, which does not sound like a foot on anything else ── */

/* ══════════════════════════════════════════════════════════════
   THE PIPELINE
   The usual rules — snapped vertices, affine texture coordinates,
   light worked out once per corner, everything quantised through a
   Bayer matrix on the way out.

   Two things this place needs that a street-level scene does not.
   The first is real aerial perspective: the far side of the view is
   ninety kilometres away and linear fog cannot hold both that and a
   pane of glass at arm's length, so the haze here is exponential.

   The second is a slab of fog with a top and a bottom to it, because
   at half past six in the morning the whole city is under one and you
   are standing above it.
   ══════════════════════════════════════════════════════════════ */
const U={
  res   :{value:new THREE.Vector2(320,240)},
  time  :{value:0},
  sun   :{value:new THREE.Vector3(-0.3,0.2,0.9).normalize()},
  sunCol:{value:new THREE.Color(1.30,1.06,0.80)},
  ambCol:{value:new THREE.Color(0.54,0.62,0.74)},
  gndCol:{value:new THREE.Color(0.32,0.34,0.34)},
  hazeCol:{value:new THREE.Color(0.66,0.74,0.82)},
  glowCol:{value:new THREE.Color(1.30,1.02,0.76)},
  fogCol:{value:new THREE.Color(0.80,0.85,0.90)},
  haze  :{value:0.00016},     /* how thick the air is, per metre */
  fogB  :{value:-10},         /* the underside of the morning */
  fogT  :{value:96},          /* and the top of it */
  fogD  :{value:0.0085},      /* how much of it there is */
  night :{value:0},
  lampC :{value:new THREE.Color(1.0,0.78,0.44)}
};
const allMats=[];
function ps1(o){
  o=o||{};

    uRes:U.res, uTime:U.time, uSun:U.sun, uSunCol:U.sunCol, uAmbCol:U.ambCol,
    uGndCol:U.gndCol, uHazeCol:U.hazeCol, uGlowCol:U.glowCol, uLampC:U.lampC,
    uHaze:U.haze, uFogB:U.fogB, uFogT:U.fogT, uFogD:U.fogD, uNight:U.night,
    uMap :{value:o.map||null},
    uMap2:{value:o.map2||null},
    uTint:{value:o.tint||new THREE.Color(1,1,1)},
    uJit :{value:o.jitter===undefined?1:o.jitter},
    uAff :{value:o.affine===undefined?1:o.affine},
    uAmb :{value:o.ambient===undefined?0.58:o.ambient},
    uEmis:{value:o.emissive||0},
    uCut :{value:o.cutout===undefined?-1:o.cutout},
    uAlpha:{value:o.alpha===undefined?1:o.alpha},
    uFres:{value:o.fresnel||0},
    uHazeMul:{value:o.hazeMul===undefined?1:o.hazeMul},
    uLevels:{value:o.levels||30.0},
    uFlash:{value:0}

    uniforms:uni,
    transparent:!!o.transparent,
    vertexColors:!!o.vcol,
    side:o.side||THREE.FrontSide,
    depthWrite:o.depthWrite===undefined?true:o.depthWrite,
    depthTest:o.depthTest===undefined?true:o.depthTest,
    blending:o.blending||THREE.NormalBlending,
    vertexShader:[
      'uniform vec2 uRes; uniform float uJit, uAff, uAmb, uTime;',
      'uniform vec3 uSun, uSunCol, uAmbCol, uGndCol, uHazeCol, uGlowCol;',
      'uniform float uHaze, uFogB, uFogT, uFogD, uHazeMul, uNight;',
      'varying vec2 vUv; varying float vW, vFog;',
      'varying vec3 vLit, vN, vWP, vFogC, vV;',
      '#ifdef USE_COLOR',
      'varying vec3 vCol;',
      '#endif',
      /* how much of the run from your eye to this corner is inside the slab */
      'float slabFrac(float y0,float y1,float a,float b){',
      '  float lo=min(y0,y1), hi=max(y0,y1);',
      '  float ov=max(0.0, min(hi,b)-max(lo,a));',
      '  return (hi-lo)<0.001 ? ((lo>=a&&lo<=b)?1.0:0.0) : ov/(hi-lo);',
      '}',
      o.vHead||'',
      'void main(){',
      '  vec3 p=position; vec3 nn=normal;',
      '#ifdef USE_COLOR',
      '  vCol=color;',
      '#endif',
      o.vBody||'',
      '  vec4 wp=modelMatrix*vec4(p,1.0);',
      '  vWP=wp.xyz;',
      '  vN=normalize(mat3(modelMatrix)*nn);',
      '  float sky=vN.y*0.5+0.5;',

      '  vLit=amb*uAmb + uSunCol*d*(1.0-uAmb*0.42);',
      '  vec4 mv=viewMatrix*wp;',
      '  float dist=length(mv.xyz);',
      '  vV=normalize(vWP-cameraPosition);',
      /* the air itself, and then the morning lying in the streets */

      '  float inSlab=slabFrac(cameraPosition.y,vWP.y,uFogB,uFogT);',
      '  float slab=1.0-exp(-dist*inSlab*uFogD);',

      '  vec4 cl=projectionMatrix*mv;',

      '  vec2 sn=floor((cl.xy/cl.w)*g+0.5)/g*cl.w;',

      o.map ?'uniform sampler2D uMap;':'',
      o.map2?'uniform sampler2D uMap2;':'',
      'uniform vec3 uTint, uLampC;',
      'uniform float uCut, uAlpha, uEmis, uLevels, uFlash, uNight, uFres, uTime;',
      'varying vec2 vUv; varying float vW, vFog;',
      'varying vec3 vLit, vN, vWP, vFogC, vV;',
      '#ifdef USE_COLOR',
      'varying vec3 vCol;',
      '#endif',
      'float h21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }',
      'float b2(vec2 a){ a=floor(a); return fract(dot(a,vec2(0.5,a.y*0.75))); }',
      'float b4(vec2 a){ return b2(0.5*a)*0.25+b2(a); }',

      '  vec2 uv=vUv/vW;',
      o.map ?'  vec4 tex=texture2D(uMap,uv);':'  vec4 tex=vec4(1.0);',
      o.map2?'  tex=mix(tex,texture2D(uMap2,uv),uNight);':'',

      '  vec3 base=tex.rgb*uTint;',

      '  gl_FragColor=vec4(floor(col*uLevels+d)/uLevels, a);',
      '}'].join('\n')
  });

}

/* ══════════════════════════════════════════════════════════════
   GEOMETRY PLUMBING
   ══════════════════════════════════════════════════════════════ */
const _e=new THREE.Euler(), _q=new THREE.Quaternion(),
      _v=new THREE.Vector3(), _s=new THREE.Vector3();
function mat(x,y,z,rx,ry,rz,sx,sy,sz){
  _e.set(rx||0,ry||0,rz||0,'YXZ'); _q.setFromEuler(_e);
  _v.set(x,y,z); _s.set(sx===undefined?1:sx, sy===undefined?1:sy, sz===undefined?1:sz);
  return new THREE.Matrix4().compose(_v,_q,_s);
}
function merge(items,withCol){
  let vc=0; const gs=[];
  for(let i=0;i<items.length;i++){
    const g=items[i].geo.index?items[i].geo.toNonIndexed():items[i].geo.clone();
    g.applyMatrix4(items[i].m); gs.push(g); vc+=g.attributes.position.count;
  }
  const pos=new Float32Array(vc*3), nor=new Float32Array(vc*3), uvs=new Float32Array(vc*2);
  const col=withCol?new Float32Array(vc*3):null;
  let po=0,uo=0;
  for(let i=0;i<gs.length;i++){
    const g=gs[i], n=g.attributes.position.count, it=items[i];
    pos.set(g.attributes.position.array,po);
    if(g.attributes.normal) nor.set(g.attributes.normal.array,po);
    const ua=g.attributes.uv, us=it.uv||[1,1], uf=it.uvOff||[0,0];
    if(ua) for(let k=0;k<n;k++){
      uvs[uo+k*2  ]=ua.array[k*2  ]*us[0]+uf[0];
      uvs[uo+k*2+1]=ua.array[k*2+1]*us[1]+uf[1];
    }
    if(col){ const c=it.c||[1,1,1];
      for(let k=0;k<n;k++){ col[po+k*3]=c[0]; col[po+k*3+1]=c[1]; col[po+k*3+2]=c[2]; } }
    po+=n*3; uo+=n*2; g.dispose();
  }
  const out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.BufferAttribute(pos,3));
  out.setAttribute('normal',new THREE.BufferAttribute(nor,3));
  out.setAttribute('uv',new THREE.BufferAttribute(uvs,2));
  if(col) out.setAttribute('color',new THREE.BufferAttribute(col,3));
  return out;
}

/* ══════════════════════════════════════════════════════════════

function tex(w,h,draw){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h);

  t.magFilter=THREE.NearestFilter;
  const pot=function(v){ return (v&(v-1))===0; };
  if(pot(w)&&pot(h)){
    t.minFilter=THREE.LinearMipmapLinearFilter;
    t.generateMipmaps=true; t.anisotropy=QUAL.low?2:8;

}

  });
}

/* ══════════════════════════════════════════════════════════════
   SCENE
   The Needle is the origin. +x east, -z north, so downtown is off
   to the south-south-east, the bay is west, and the mountain — if
   the mountain is out — is over your left shoulder at about
   one-five-zero.
   ══════════════════════════════════════════════════════════════ */
const cv=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(1); renderer.setClearColor(0x9DB0BE,1);
const scene=new THREE.Scene();
/* near has to hold a pane of glass at arm's length and far has to hold
   a mountain; 0.4 to 30000 is about as much range as the depth buffer
   will give without the mountain starting to z-fight with the sky */
const cam=new THREE.PerspectiveCamera(66,1,0.4,30000);
const FOV_WIDE=66, FOV_SCOPE=8.5;
let fovNow=FOV_WIDE, fovWant=FOV_WIDE;

/* the two floors of the top house */
const DECK={
  y:158.0,          /* 520 feet, the open-air deck */
  loupe:152.0,      /* 500 feet, the floor that turns */
  rIn:11.6,         /* the core, which is lifts and stairs */
  rOut:20.2,        /* where the glass starts */
  rGlass:20.6,
  h:3.3             /* to the underside of the roof */
};
const EYE=1.66;
let RW=320, RH=240;
function fit(){
  const w=innerWidth, h=innerHeight, dpr=Math.min(devicePixelRatio||1,2);
  cv.style.width=w+'px'; cv.style.height=h+'px';
  RW=Math.max(224,Math.round(w*QUAL.res*Math.min(dpr,1.2)));
  RH=Math.max(168,Math.round(h*QUAL.res*Math.min(dpr,1.2)));
  renderer.setSize(RW,RH,false);
  cam.aspect=w/Math.max(1,h); cam.updateProjectionMatrix();
  U.res.value.set(RW,RH);
}
addEventListener('resize',fit);

const targets=[];
function place(o,kind,deg){
  o.userData={kind:kind,deg:deg===undefined?0:deg,flash:0};
  targets.push(o); scene.add(o); return o;
}
const CIRC=[], BOXES=[];
function circ(x,z,r){ CIRC.push({x:x,z:z,r:r}); }
function box(x,z,hx,hz){ BOXES.push([x,z,hx,hz]); }
const LAMPS=[];
function addLamp(x,y,z,size,col){ LAMPS.push({x:x,y:y,z:z,s:size,c:col}); }
function baked(items,m,vcol){
  const g=merge(items,!!vcol);
  const mesh=new THREE.Mesh(g,m); mesh.frustumCulled=false;
  scene.add(mesh); return mesh;
}

/* ══════════════════════════════════════════════════════════════
   THE HOUR, AND THE MORNING LYING IN THE STREETS
   Twenty to seven, and the whole city is under a deck of fog with
   only the tall end of downtown coming through it. It burns off
   between about ten to seven and half past eight, and then you can
   see for ninety kilometres.
   ══════════════════════════════════════════════════════════════ */
const SKY={ h:6.63, rate:1.05/3600*3600/3600, sunY:0, night:0, fog:1 };
SKY.rate=1.05/3600;           /* slow while the fog is still worth watching */
const sunDir=new THREE.Vector3();
const _sunC=new THREE.Color(), _tmp=new THREE.Color();
function setHour(h){
  const t=clamp((h-6.35)/12.9,-0.2,1.2);
  const e=Math.sin(clamp(t,0,1)*Math.PI)*0.80+(t<0||t>1?-0.24:0);
  const az=t*Math.PI;
  sunDir.set(Math.cos(az)*Math.cos(e), Math.sin(e), Math.sin(az)*Math.cos(e)).normalize();
  U.sun.value.copy(sunDir);
  SKY.sunY=sunDir.y;
  SKY.night=clamp((0.045-sunDir.y)/0.19,0,1);
  U.night.value=SKY.night;
}
/* how much morning is still in the streets */
function setFog(h){
  const f=1-sstep(6.88,8.62,h);
  SKY.fog=f;
  U.fogB.value=-40;
  /* it lies low enough to leave the waterfront and the near towers in it
     rather than putting a lid on the whole basin */
  U.fogT.value=lerp(-30,58,f*f*(3-2*f));
  U.fogD.value=lerp(0.0,0.0105,f);
  /* the air clears through the morning and thickens again at dusk */
  const dusk=sstep(17.4,20.2,h);
  U.haze.value=lerp(lerp(0.000245,0.000092,sstep(6.9,10.0,h)),0.000175,dusk);
}

/* ══════════════════════════════════════════════════════════════
   THE SKY
   A gradient with a real sun in it, a high thin deck of cloud that
   the sun gets underneath at both ends of the day, and stars once
   the city has given up competing.
   ══════════════════════════════════════════════════════════════ */
const skyU={
  uTime:U.time, uSun:U.sun, uNight:U.night,
  uZen:{value:new THREE.Color(0.18,0.32,0.54)},
  uMid:{value:new THREE.Color(0.52,0.62,0.74)},
  uHor:{value:new THREE.Color(0.80,0.84,0.86)},
  uGlow:{value:new THREE.Color(1.40,1.06,0.70)},
  uCloud:{value:0.42}, uFogK:{value:1}, uFogC:{value:new THREE.Color(0.82,0.86,0.90)}
};
const skyMat=new THREE.ShaderMaterial({
  uniforms:skyU, side:THREE.BackSide, depthWrite:false, depthTest:false, fog:false,
  vertexShader:[
    'varying vec3 vD;',
    'void main(){ vD=position; gl_Position=projectionMatrix*viewMatrix*vec4(position+cameraPosition,1.0); }'
  ].join('\n'),
  fragmentShader:[
    'uniform vec3 uZen,uMid,uHor,uGlow,uSun,uFogC; uniform float uTime,uNight,uCloud,uFogK;',
    'varying vec3 vD;',
    'float h21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }',
    'float vn(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);',
    '  return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y); }',
    'float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<5;i++){ v+=a*vn(p); p*=2.02; a*=0.5; } return v; }',
    'float b2(vec2 a){ a=floor(a); return fract(dot(a,vec2(0.5,a.y*0.75))); }',
    'float b4(vec2 a){ return b2(0.5*a)*0.25+b2(a); }',
    'void main(){',
    '  vec3 d=normalize(vD);',
    '  float h=d.y;',
    '  float sa=max(dot(d,normalize(uSun)),0.0);',
    '  vec3 col=mix(uHor,uMid,smoothstep(-0.02,0.24,h));',
    '  col=mix(col,uZen,smoothstep(0.18,0.88,h));',
    /* the sun is low at both ends of this day and it gets everywhere */
    '  col=mix(col,uGlow,pow(sa,2.4)*0.60*(1.0-smoothstep(0.0,0.55,h)));',
    '  col=mix(col,uGlow,pow(sa,11.0)*0.62);',
    '  col+=uGlow*pow(sa,900.0)*1.5*(1.0-uNight);',
    /* a high deck of cloud, thin enough to light from underneath */
    '  if(h>-0.01){',
    '    vec2 cp=d.xz/max(h+0.22,0.22);',
    '    float c=fbm(cp*0.50+vec2(uTime*0.0042,uTime*0.0019));',
    '    float cover=smoothstep(0.76-uCloud*0.50,1.04-uCloud*0.38,c);',
    '    vec3 cc=mix(vec3(0.96,0.95,0.94),vec3(0.52,0.55,0.60),uCloud*0.6);',
    '    cc=mix(cc,cc*vec3(1.30,0.94,0.68),pow(sa,2.2)*0.85*(1.0-uNight));',
    '    cc=mix(cc,vec3(0.10,0.12,0.18),uNight*0.88);',
    '    col=mix(col,cc,cover*clamp(h*4.5,0.0,1.0));',
    '  }',
    '  if(uNight>0.02&&h>0.0){',
    '    vec2 sp=floor(d.xz/max(h,0.05)*52.0);',
    '    float s=h21(sp);',
    '    float tw=0.6+0.4*sin(h21(sp+7.0)*50.0+uTime*2.0);',
    '    col+=vec3(0.88,0.92,1.0)*step(0.9962,s)*uNight*tw*1.1*clamp(h*3.0,0.0,1.0);',
    '  }',
    /* and on the morning it is all still in, the horizon is just fog */
    '  col=mix(col,uFogC,uFogK*smoothstep(0.30,-0.02,h));',
    '  float dd=b4(gl_FragCoord.xy)/0.9375;',
    '  gl_FragColor=vec4(floor(col*30.0+dd)/30.0,1.0);',
    '}'].join('\n')
});
const skyDome=new THREE.Mesh(new THREE.SphereGeometry(20000,26,16),skyMat);
skyDome.frustumCulled=false; skyDome.renderOrder=-1000; scene.add(skyDome);

/* ══════════════════════════════════════════════════════════════
   MATERIALS OF THE TOP HOUSE
   ══════════════════════════════════════════════════════════════ */
const M={
  deck  :ps1({map:tiled(T.deck,1,1),   ambient:0.56, hazeMul:0.1,
              tint:new THREE.Color(0.88,0.88,0.90)}),
  gold  :ps1({map:tiled(T.gold,1,1),   ambient:0.60, hazeMul:0.1}),
  gold2 :ps1({map:tiled(T.gold2,1,1),  ambient:0.52, hazeMul:0.1}),
  white :ps1({map:tiled(T.white,1,1),  ambient:0.52, hazeMul:0.1,
              tint:new THREE.Color(0.84,0.85,0.87)}),
  /* the drum round the core is sheets, so it is seen from both faces */
  drum  :ps1({map:tiled(T.white,1,1),  ambient:0.52, hazeMul:0.1,
              side:THREE.DoubleSide, tint:new THREE.Color(0.84,0.85,0.87)}),
  bronze:ps1({map:T.bronze,            ambient:0.46, hazeMul:0.1}),
  steel :ps1({map:T.steel,             ambient:0.62, hazeMul:0.1}),
  soffit:ps1({map:tiled(T.soffit,2,1), ambient:0.50, hazeMul:0.05,
              tint:new THREE.Color(0.60,0.63,0.67)}),
  /* the ceiling of the Loupe is washed with light from the cove, so it
     cannot be lit by a sky it never sees */
  ceil  :ps1({map:tiled(T.soffit,1,1), ambient:0.92, emissive:0.26, hazeMul:0.05,
              side:THREE.DoubleSide, tint:new THREE.Color(0.70,0.72,0.75)}),
  /* forty-eight sheets of it, and you only really see them edge-on */
  glass :ps1({map:T.glass, transparent:true, alpha:0.055, fresnel:0.46,
              ambient:0.9, hazeMul:0.05, depthWrite:false, side:THREE.DoubleSide}),
  /* the one you stand on */
  gfloor:ps1({map:tiled(T.gfloor,3,3), transparent:true, alpha:0.20, fresnel:0.30,
              ambient:0.95, hazeMul:0.05, depthWrite:false, side:THREE.DoubleSide}),
  cloth :ps1({map:T.cloth, vcol:true,  ambient:0.62, hazeMul:0.2})
};

/* ══════════════════════════════════════════════════════════════
   FIVE TWENTY — THE OPEN-AIR DECK
   A ring of floor, and then forty-eight panes of glass tilted out
   over nothing where the pony walls and the wire cage used to be.
   Every other one has a bench hung off it, and you are invited to
   lean back on it, which is a thing people do and then regret.
   ══════════════════════════════════════════════════════════════ */
const NPANE=48, PANE_R=20.45, PANE_H=1.52, PANE_LEAN=0.30;
const BENCH=[];
(function openDeck(){
  const fl=[], ed=[], rib=[], pst=[];
  const seg=NPANE*2;
  /* the floor: one ring, cut fine enough that the affine warp has
     something to hold and the snapping has somewhere to snap */
  fl.push({geo:new THREE.RingGeometry(DECK.rIn,DECK.rOut,112,9),
           m:mat(0,DECK.y,0,-Math.PI/2,0,0), uv:[26,26]});
  /* the edge beam, and the gold ribs under it that you see through the floor */
  for(let s=0;s<seg;s++){
    const a=(s+0.5)/seg*TAU, len=TAU*DECK.rOut/seg*1.14;
    ed.push({geo:new THREE.BoxGeometry(1.5,0.46,len),
             m:mat(Math.cos(a)*(DECK.rOut+0.2),DECK.y-0.24,Math.sin(a)*(DECK.rOut+0.2),0,-a,0),
             uv:[1,len/2]});
  }
  for(let i=0;i<24;i++){
    const a=i/24*TAU;
    rib.push({geo:new THREE.BoxGeometry(DECK.rOut-DECK.rIn+0.4,0.36,0.62),
              m:mat(Math.cos(a)*((DECK.rOut+DECK.rIn)/2),DECK.y-0.52,
                    Math.sin(a)*((DECK.rOut+DECK.rIn)/2),0,-a,0),
              uv:[5,1]});
    /* and the diagonal braces, which is what you actually photograph */
    rib.push({geo:new THREE.BoxGeometry(6.6,0.30,0.42),
              m:mat(Math.cos(a+0.10)*(DECK.rOut-3.0),DECK.y-1.34,Math.sin(a+0.10)*(DECK.rOut-3.0),
                    0,-a-0.10,0.40), uv:[3,1]});
  }
  /* a hoop of gold round the outside, under the lip */
  for(let s=0;s<seg;s++){
    const a=(s+0.5)/seg*TAU, len=TAU*(DECK.rOut+0.7)/seg*1.16;
    rib.push({geo:new THREE.BoxGeometry(0.5,0.34,len),
              m:mat(Math.cos(a)*(DECK.rOut+0.7),DECK.y-1.9,Math.sin(a)*(DECK.rOut+0.7),0,-a,0),
              uv:[1,len/2]});
  }
  const f=baked(fl,M.deck); f.userData={kind:'floor',deg:0,flash:0}; targets.push(f);
  baked(ed,M.white);
  const r=baked(rib,M.gold); r.userData={kind:'gold',deg:2,flash:0}; targets.push(r);

  /* ── the forty-eight ─────────────────────────────────────── */
  const gl=[], bn=[], mull=[];
  for(let i=0;i<NPANE;i++){
    const a=(i+0.5)/NPANE*TAU;
    const w=TAU*PANE_R/NPANE*0.96;
    const cx=Math.cos(a)*(PANE_R+Math.sin(PANE_LEAN)*PANE_H*0.5);
    const cz=Math.sin(a)*(PANE_R+Math.sin(PANE_LEAN)*PANE_H*0.5);
    const cy=DECK.y+Math.cos(PANE_LEAN)*PANE_H*0.5;
    gl.push({geo:new THREE.PlaneGeometry(w,PANE_H,1,2),
             m:mat(cx,cy,cz,PANE_LEAN,-a+Math.PI/2,0), uv:[1,1]});
    /* the post between each pair, and the shoe it stands in */
    const ax=(i)/NPANE*TAU;
    mull.push({geo:new THREE.BoxGeometry(0.10,PANE_H+0.1,0.14),
               m:mat(Math.cos(ax)*(PANE_R+Math.sin(PANE_LEAN)*PANE_H*0.5),
                     cy,Math.sin(ax)*(PANE_R+Math.sin(PANE_LEAN)*PANE_H*0.5),
                     PANE_LEAN,-ax+Math.PI/2,0)});
    mull.push({geo:new THREE.BoxGeometry(0.34,0.26,0.30),
               m:mat(Math.cos(ax)*PANE_R,DECK.y+0.13,Math.sin(ax)*PANE_R,0,-ax,0)});
    /* every other one carries a bench, seven feet of glass over the drop */
    if(i%2===0){
      const br=PANE_R+0.95, by=DECK.y+0.50;
      const bx=Math.cos(a)*br, bz=Math.sin(a)*br;
      bn.push({geo:new THREE.PlaneGeometry(2.14,1.05,1,1),
               m:mat(bx,by,bz,-Math.PI/2,-a+Math.PI/2,0), uv:[1,1]});
      mull.push({geo:new THREE.BoxGeometry(0.12,0.10,1.15),
                 m:mat(Math.cos(a)*(PANE_R+0.35),by-0.06,Math.sin(a)*(PANE_R+0.35),0,-a,0)});
      BENCH.push({a:a,x:bx,z:bz,y:by});
    }
  }
  const G=baked(gl,M.glass); G.renderOrder=6;
  G.userData={kind:'glass',deg:5,flash:0}; targets.push(G);
  /* the Skyrisers are their own thing, so a tap on one is a tap on one */
  const B=baked(bn,M.glass); B.renderOrder=6;
  B.userData={kind:'bench',deg:6,flash:0}; targets.push(B);
  baked(mull,M.bronze);
})();

/* ══════════════════════════════════════════════════════════════
   THE TWO DOORWAYS
   The drum round the core is solid except here, where the stairs
   start. Both the wall and the collision have to agree about it or
   there is an invisible pane across the only way down.
   ══════════════════════════════════════════════════════════════ */
const ST_MC=[0.47,0.47+Math.PI];   /* where the openings are centred */
const ST_MW=0.100;                 /* how wide you may walk through */
const ST_MG=0.128;                 /* and how wide the hole in the wall is */
function inMouth(a){
  for(let i=0;i<ST_MC.length;i++){
    const d=Math.abs(((a-ST_MC[i]+Math.PI*3)%TAU)-Math.PI);
    if(d<ST_MW) return true;
  }
  return false;
}

/* ══════════════════════════════════════════════════════════════
   THE ROOF, AND THE CORE IT SITS ON
   ══════════════════════════════════════════════════════════════ */
(function roofAndCore(){
  const so=[], rib=[], core=[], wh=[];
  const RY=DECK.y+DECK.h;
  const seg=48;
  /* a shallow saucer of a roof, ribbed underneath */
  (function(){
    const g=new THREE.RingGeometry(DECK.rIn,22.4,128,13);
    const pa=g.attributes.position;
    for(let i=0;i<pa.count;i++){
      const rr=Math.hypot(pa.getX(i),pa.getY(i));
      pa.setZ(i, 0.55-Math.pow(rr/22.4,2)*1.35);
    }
    g.computeVertexNormals();
    so.push({geo:g, m:mat(0,RY,0,-Math.PI/2,0,0), uv:[6,6]});
  })();
  for(let i=0;i<24;i++){
    const a=i/24*TAU;
    rib.push({geo:new THREE.BoxGeometry(22.4-DECK.rIn,0.22,0.40),
              m:mat(Math.cos(a)*((22.4+DECK.rIn)/2),RY+0.30,Math.sin(a)*((22.4+DECK.rIn)/2),0,-a,-0.06),
              uv:[5,1]});
  }
  /* the top surface of it, and the lip */
  for(let s=0;s<seg;s++){
    const a=(s+0.5)/seg*TAU, len=TAU*22.4/seg*1.14;
    wh.push({geo:new THREE.BoxGeometry(0.9,0.5,len),
             m:mat(Math.cos(a)*22.4,RY+0.10,Math.sin(a)*22.4,0,-a,0), uv:[1,len/2]});
  }
  wh.push({geo:new THREE.CylinderGeometry(22.2,DECK.rIn,0.5,48,1),
           m:mat(0,RY+1.25,0,0,0,0), uv:[8,1]});
  /* the core: lifts, stairs, and the only wall up here that is not glass */
  /* the wall is a drum of panels, with a way through it at the head of
     each stair — otherwise there is no getting down to the floor that turns */
  const MOUTH=ST_MC, nseg=48, HH=DECK.h+0.7, LINT=2.35;
  for(let s=0;s<nseg;s++){
    const a=(s+0.5)/nseg*TAU, len=TAU*DECK.rIn/nseg*1.16;
    let open=false;
    for(let i=0;i<MOUTH.length;i++){
      const d=Math.abs(((a-MOUTH[i]+Math.PI*3)%TAU)-Math.PI);
      if(d<ST_MG) open=true;
    }
    const hh=open?HH-LINT:HH, yy=DECK.y+(open?LINT:0)+hh/2;
    core.push({geo:new THREE.PlaneGeometry(len,hh,1,2),
               m:mat(Math.cos(a)*DECK.rIn,yy,Math.sin(a)*DECK.rIn,0,-a+Math.PI/2,0),
               uv:[len/2,hh/2]});
    if(open){
      /* a jamb either side, so the opening reads as a door */
      [-1,1].forEach(function(k){
        const aj=a+k*ST_MG;
        core.push({geo:new THREE.PlaneGeometry(0.34,LINT,1,1),
                   m:mat(Math.cos(aj)*DECK.rIn,DECK.y+LINT/2,Math.sin(aj)*DECK.rIn,0,-aj+Math.PI/2,0),
                   uv:[1,2]});
      });
    }
  }
  const c=baked(core,M.drum);
  c.userData={kind:'core',deg:4,flash:0}; targets.push(c);
  const s2=baked(so,M.soffit); s2.material.side=THREE.DoubleSide;
  s2.userData={kind:'roof',deg:6,flash:0}; targets.push(s2);
  baked(rib,M.gold2); baked(wh,M.white);
  /* the lights they wash the underside with */
  for(let i=0;i<12;i++){
    const a=i/12*TAU;
    addLamp(Math.cos(a)*18,RY-0.2,Math.sin(a)*18,5.5,[1.0,0.84,0.52]);
  }
  /* and a few inside the drum, where no daylight gets */
  for(let i=0;i<7;i++){
    const a=i/7*TAU;
    addLamp(Math.cos(a)*5.6,DECK.y+2.9,Math.sin(a)*5.6,3.4,[1.0,0.86,0.58]);
  }
})();

/* ══════════════════════════════════════════════════════════════
   THE OCULUS STAIRS
   Twin half-moons down to five hundred, with a piece of floored
   glass at the bottom of them looking straight down the shaft at
   the counterweights going the other way.
   ══════════════════════════════════════════════════════════════ */
const STAIRS=[{a0:0.42,a1:1.72},{a0:0.42+Math.PI,a1:1.72+Math.PI}];
const ST_RIN=8.0, ST_ROUT=11.6;
function stairAt(r,a){
  if(r<ST_RIN||r>ST_ROUT) return null;
  for(let i=0;i<STAIRS.length;i++){
    const S=STAIRS[i];
    let d=a-S.a0; while(d<0) d+=TAU; while(d>=TAU) d-=TAU;
    let w=S.a1-S.a0; while(w<0) w+=TAU;
    if(d<=w){
      const t=d/w;
      const n=14, k=Math.floor(t*n)/n;
      return { t:t, y:lerp(DECK.y,DECK.loupe,k) };
    }
  }
  return null;
}
function stairArc(a){
  for(let i=0;i<STAIRS.length;i++){
    const S=STAIRS[i];
    let dd=a-S.a0; while(dd<0) dd+=TAU; while(dd>=TAU) dd-=TAU;
    let w=S.a1-S.a0; while(w<0) w+=TAU;
    if(dd<=w) return true;
  }
  return false;
}
(function stairs(){
  const tr=[], rail=[];
  STAIRS.forEach(function(S){
    const w=S.a1-S.a0, n=14;
    for(let k=0;k<=n;k++){
      const a=S.a0+w*(k+0.5)/n, y=lerp(DECK.y,DECK.loupe,k/n);
      const rm=(ST_RIN+ST_ROUT)/2, len=w/n*rm*1.2;
      tr.push({geo:new THREE.BoxGeometry(ST_ROUT-ST_RIN,0.5,len),
               m:mat(Math.cos(a)*rm,y-0.25,Math.sin(a)*rm,0,-a,0), uv:[2,1]});
      if(k%2===0){
        [ST_RIN-0.1,ST_ROUT+0.1].forEach(function(rr){
          rail.push({geo:new THREE.CylinderGeometry(0.035,0.035,1.05,6),
                     m:mat(Math.cos(a)*rr,y+0.52,Math.sin(a)*rr,0,0,0)});
          rail.push({geo:new THREE.BoxGeometry(0.06,0.06,len*2.2),
                     m:mat(Math.cos(a)*rr,y+1.02,Math.sin(a)*rr,
                           -Math.atan2(lerp(DECK.y,DECK.loupe,2/n)-DECK.y,len*2),-a,0)});
        });
      }
    }
  });
  baked(tr,M.deck); baked(rail,M.steel);
})();

/* ══════════════════════════════════════════════════════════════
   THE LOBBY INSIDE THE CORE
   Where the lift puts you down, and the floor round it — which is
   everywhere the stairwell is not.
   ══════════════════════════════════════════════════════════════ */
(function lobby(){
  const fl=[], sk=[];
  fl.push({geo:new THREE.CircleGeometry(ST_RIN,48),
           m:mat(0,DECK.y,0,-Math.PI/2,0,0), uv:[7,7]});
  STAIRS.forEach(function(S,i){
    const g0=STAIRS[i].a1;
    const g1=STAIRS[(i+1)%STAIRS.length].a0+(i===STAIRS.length-1?TAU:0);
    let len=g1-g0; while(len<0) len+=TAU;
    fl.push({geo:new THREE.RingGeometry(ST_RIN,ST_ROUT+0.1,28,3,g0,len),
             m:mat(0,DECK.y,0,-Math.PI/2,0,0), uv:[9,9]});
  });
  baked(fl,M.deck);
  /* a kerb round the two openings so you can see where the floor stops */
  STAIRS.forEach(function(S){
    [S.a0,S.a1].forEach(function(aa){
      sk.push({geo:new THREE.BoxGeometry(ST_ROUT-ST_RIN+0.1,0.16,0.20),
               m:mat(Math.cos(aa)*(ST_RIN+ST_ROUT)/2,DECK.y+0.08,
                     Math.sin(aa)*(ST_RIN+ST_ROUT)/2,0,-aa,0), uv:[2,1]});
    });
    const n=12, w=S.a1-S.a0;
    for(let s=0;s<n;s++){
      const a=S.a0+w*(s+0.5)/n, ln=w/n*ST_RIN*1.3;
      sk.push({geo:new THREE.BoxGeometry(0.20,0.16,ln),
               m:mat(Math.cos(a)*ST_RIN,DECK.y+0.08,Math.sin(a)*ST_RIN,0,-a,0)});
    }
  });
  baked(sk,M.bronze);
})();

/* ══════════════════════════════════════════════════════════════
   FIVE HUNDRED — THE LOUPE
   Thirty-seven tons of glass floor, ten layers of it, turning once
   round every forty-five minutes on twelve motors and forty-eight
   rollers. The inner third is solid, which is where people stand
   when they have decided they would rather not.
   ══════════════════════════════════════════════════════════════ */
const LOUPE={ rSolid:6.4, rOut:18.6, rGlass:19.4, y:DECK.loupe, ceil:157.6, spin:0 };
let loupeRing=null;
(function loupe(){
  const solid=[], glass=[], wall=[], mull=[], lam=[], ceil=[];
  const seg=48;
  /* the third of it you can stand on without thinking about it */
  solid.push({geo:new THREE.CircleGeometry(LOUPE.rSolid,64),
              m:mat(0,LOUPE.y,0,-Math.PI/2,0,0), uv:[10,10]});
  const sf=baked(solid,M.deck); sf.userData={kind:'floor',deg:1,flash:0}; targets.push(sf);
  /* and the two thirds you can */
  glass.push({geo:new THREE.RingGeometry(LOUPE.rSolid,LOUPE.rOut,112,9),
              m:mat(0,LOUPE.y+0.02,0,-Math.PI/2,0,0), uv:[11,11]});
  /* you can count the laminations at every joint */
  for(let s=0;s<seg;s++){
    const a0=s/seg*TAU, rm=(LOUPE.rSolid+LOUPE.rOut)/2;
    lam.push({geo:new THREE.BoxGeometry(LOUPE.rOut-LOUPE.rSolid,0.10,0.09),
              m:mat(Math.cos(a0)*rm,LOUPE.y+0.01,Math.sin(a0)*rm,0,-a0,0)});
  }
  const ring=new THREE.Group();
  const gm=new THREE.Mesh(merge(glass),M.gfloor); gm.frustumCulled=false; gm.renderOrder=7;
  const mm=new THREE.Mesh(merge(lam),M.bronze); mm.frustumCulled=false;
  ring.add(gm); ring.add(mm); scene.add(ring);
  loupeRing=ring;
  gm.userData={kind:'floor',deg:7,flash:0}; targets.push(gm);
  /* the wall: floor to ceiling, and leaning out over the city */
  const WLEAN=0.16, WH=LOUPE.ceil-LOUPE.y-0.2;
  for(let i=0;i<seg;i++){
    const a=(i+0.5)/seg*TAU, w=TAU*LOUPE.rGlass/seg*0.97;
    const rr=LOUPE.rGlass+Math.sin(WLEAN)*WH*0.5;
    wall.push({geo:new THREE.PlaneGeometry(w,WH,1,3),
               m:mat(Math.cos(a)*rr,LOUPE.y+Math.cos(WLEAN)*WH*0.5,Math.sin(a)*rr,
                     WLEAN,-a+Math.PI/2,0), uv:[1,1]});
    const ax=i/seg*TAU;
    mull.push({geo:new THREE.BoxGeometry(0.09,WH+0.2,0.13),
               m:mat(Math.cos(ax)*rr,LOUPE.y+Math.cos(WLEAN)*WH*0.5,Math.sin(ax)*rr,
                     WLEAN,-ax+Math.PI/2,0)});
  }
  const W=baked(wall,M.glass); W.renderOrder=6;
  W.userData={kind:'glass',deg:3,flash:0}; targets.push(W);
  baked(mull,M.bronze);
  /* the ceiling, which is the underside of the deck above */
  /* two slots are cut out of it, one over each flight, and the rest of
     the ceiling closes back up — otherwise the stairs run into a slab */
  const CIN=ST_RIN-0.4, COUT=ST_ROUT+0.1;
  ceil.push({geo:new THREE.CircleGeometry(CIN,48),
             m:mat(0,LOUPE.ceil,0,Math.PI/2,0,0), uv:[4,4]});
  ceil.push({geo:new THREE.RingGeometry(COUT,LOUPE.rGlass,96,5),
             m:mat(0,LOUPE.ceil,0,Math.PI/2,0,0), uv:[10,10]});
  STAIRS.forEach(function(S,i){
    const gap0=STAIRS[i].a1, gap1=STAIRS[(i+1)%STAIRS.length].a0+(i===STAIRS.length-1?TAU:0);
    let len=gap1-gap0; while(len<0) len+=TAU;
    ceil.push({geo:new THREE.RingGeometry(CIN,COUT,26,3,gap0,len),
               m:mat(0,LOUPE.ceil,0,Math.PI/2,0,0), uv:[6,6]});
  });
  /* a bronze kerb round the opening so the edge reads as an edge */
  const kerb=[];
  STAIRS.forEach(function(S){
    const n=13, w=S.a1-S.a0;
    for(let s=0;s<n;s++){
      const a=S.a0+w*(s+0.5)/n;
      [CIN,COUT].forEach(function(rr){
        const ln=w/n*rr*1.25;
        kerb.push({geo:new THREE.BoxGeometry(0.22,0.22,ln),
                   m:mat(Math.cos(a)*rr,LOUPE.ceil-0.11,Math.sin(a)*rr,0,-a,0)});
      });
    }
    /* and across each end of the slot */
    [S.a0,S.a1].forEach(function(aa){
      kerb.push({geo:new THREE.BoxGeometry(COUT-CIN,0.22,0.24),
                 m:mat(Math.cos(aa)*(CIN+COUT)/2,LOUPE.ceil-0.11,
                       Math.sin(aa)*(CIN+COUT)/2,0,-aa,0), uv:[2,1]});
    });
  });
  baked(kerb,M.bronze);
  baked(ceil,M.ceil);
  for(let i=0;i<10;i++){
    const a=i/10*TAU;
    addLamp(Math.cos(a)*15,LOUPE.ceil-0.3,Math.sin(a)*15,4.0,[1.0,0.86,0.58]);
  }
})();

/* ══════════════════════════════════════════════════════════════
   THE OCULUS
   Nineteen feet by eleven of floored glass at the foot of the

   ══════════════════════════════════════════════════════════════ */

    sh.push({geo:new THREE.BoxGeometry(0.34,7.2,0.34), m:mat(ox+Math.cos(a)*2.6,y-3.6,oz+Math.sin(a)*2.6,0,-a,0), uv:[1,3]});
    sh.push({geo:new THREE.BoxGeometry(0.34,7.2,0.34), m:mat(ox-Math.cos(a)*2.6,y-3.6,oz-Math.sin(a)*2.6,0,-a,0), uv:[1,3]});
  }

/* ══════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════
   WHAT THE NEEDLE IS STANDING ON
   You can see most of this through the floor, so it has to be there.
   ══════════════════════════════════════════════════════════════ */
const CM={

function shoreX(z){ return -1180 + clamp(z,-1400,4200)*0.30; }

(function theNeedleItself(){

  /* the core, all the way down */
  w.push({geo:new THREE.CylinderGeometry(3.1,4.6,DECK.loupe-3,14,1),
          m:mat(0,(DECK.loupe-3)/2,0,0,0,0), uv:[6,30], c:[1,1,1]});

  for(let i=0;i<3;i++){
    const a=i/3*TAU+0.5;
    for(let k=0;k<11;k++){
      const t0=k/11, t1=(k+1)/11;
      const r0=5.5+Math.pow(t0,1.7)*24, r1=5.5+Math.pow(t1,1.7)*24;
      const y0=DECK.loupe-8-t0*(DECK.loupe-10), y1=DECK.loupe-8-t1*(DECK.loupe-10);

      w.push({geo:new THREE.BoxGeometry(2.4,L*1.04,2.0),

              uv:[1,L/6], c:[1,1,1]});
    }
    /* the ring beams that hold them together */
    [0.30,0.58,0.82].forEach(function(t){
      const r=5.5+Math.pow(t,1.7)*24, y=DECK.loupe-8-t*(DECK.loupe-10);
      for(let s=0;s<3;s++){
        const b0=s/3*TAU+0.5, b1=(s+1)/3*TAU+0.5;
        const bm=(b0+b1)/2, len=(b1-b0)*r*1.05;
        g.push({geo:new THREE.BoxGeometry(0.8,0.8,len),

  w.push({geo:new THREE.CylinderGeometry(0.10,0.30,9.0,6),
          m:mat(0,DECK.y+DECK.h+13.0,0,0,0,0), uv:[1,3], c:[1,1,1]});

  addLamp(0,DECK.y+DECK.h+17,0,3.0,[1.0,0.30,0.22]);
})();

(function land(){
  const it=[], wt=[];
  const S=260, N=46;
  for(let i=-N;i<N;i++){
    for(let j=-N;j<N;j++){
      const x=i*S+S/2, z=j*S+S/2;
      const d=Math.hypot(x,z);
      if(d>7000) continue;
      const isWater = x < shoreX(z);
      /* the land rises to the north — Queen Anne is a real hill */
      const hill = Math.max(0,-z-200)*0.055 + Math.max(0,(x-1400))*0.02;
      const g=[0.46,0.48,0.44];
      if(isWater){
        wt.push({geo:new THREE.PlaneGeometry(S,S,1,1),
                 m:mat(x,-0.5,z,-Math.PI/2,0,0), uv:[1,1], c:[1,1,1]});
      } else {
        const shade=0.82+((i*7+j*13)%5)*0.06;
        it.push({geo:new THREE.PlaneGeometry(S,S,1,1),
                 m:mat(x,Math.max(2.0,Math.min(hill,110)),z,-Math.PI/2,0,0), uv:[S/26,S/26],
                 c:[g[0]*shade,g[1]*shade,g[2]*shade]});
      }
    }
  }
  /* the far ground, coarse, so the mountain is not standing in the sea */
  const S2=1500, N2=15;
  for(let i=-N2;i<=N2;i++){
    for(let j=-N2;j<=N2;j++){
      const x=i*S2+S2/2, z=j*S2+S2/2;
      const d=Math.hypot(x,z);
      if(d<=7000||d>22000) continue;
      if(x<shoreX(z)) continue;
      const shade=0.80+((i*5+j*11)%4)*0.05;
      it.push({geo:new THREE.PlaneGeometry(S2,S2,1,1),
               m:mat(x,Math.min(3+Math.max(0,d-7000)*0.008,150),z,-Math.PI/2,0,0), uv:[S2/60,S2/60],
               c:[0.44*shade,0.47*shade,0.42*shade]});
    }
  }
  /* and the Sound, going on past everything */
  wt.push({geo:new THREE.PlaneGeometry(52000,52000,1,1),
           m:mat(-9000,-26,1500,-Math.PI/2,0,0), uv:[120,120], c:[0.86,0.92,0.98]});
  baked(it,CM.grnd,true);
  const W=baked(wt,CM.water,true);
  W.userData={kind:'water',deg:0,flash:0}; targets.push(W);
})();

/* ══════════════════════════════════════════════════════════════
   A CITY, LAID OUT ON TWO DIFFERENT GRIDS
   Downtown is turned about thirty degrees off north, which is why
   it never lines up with anything around it.
   ══════════════════════════════════════════════════════════════ */
const BLD={tower:[],conc:[],brick:[],roof:[]};
function district(o){
  const rot=o.rot||0, cs=Math.cos(rot), sn=Math.sin(rot);
  const bx=o.block||118, st=o.street||26;
  const nx=Math.ceil(o.w/bx), nz=Math.ceil(o.d/bx);
  for(let i=0;i<nx;i++){
    for(let j=0;j<nz;j++){
      const lx=(i+0.5-nx/2)*bx, lz=(j+0.5-nz/2)*bx;
      const rr=Math.hypot(lx,lz)/Math.max(o.w,o.d)*2;
      if(Math.random()>o.dens*(1-rr*(o.fall||0))) continue;
      const x=o.x+lx*cs-lz*sn, z=o.z+lx*sn+lz*cs;
      if(x<shoreX(z)+40) continue;
      if(Math.hypot(x,z)<(o.keep||60)) continue;
      /* the tallest ones in the middle, tapering out */
      const k=Math.pow(clamp(1-rr*1.1,0,1),o.pow||1.6)*(0.55+Math.random()*0.75);
      let h=o.hMin+(o.hMax-o.hMin)*k;
      if(Math.random()<0.06) h*=1.35;
      const w=bx-st-rnd(0,16), d=bx-st-rnd(0,16);
      const base=(o.hill?Math.max(0,-z-200)*0.055:0);
      const tall=h>62;
      const list = tall?BLD.tower : (Math.random()<(o.brick||0.2)?BLD.brick:BLD.conc);
      /* not every one of them is the same grey: glass reads green-blue, the
         concrete ones warm, and one in ten downtown is nearly black */
      const sh=0.80+Math.random()*0.34;
      let c;
      if(tall){
        const r=Math.random();
        c = r<0.11 ? [sh*0.40,sh*0.43,sh*0.48]
          : r<0.40 ? [sh*0.78,sh*0.92,sh*0.95]
          : r<0.62 ? [sh*1.02,sh*1.00,sh*0.94]
          : r<0.80 ? [sh*0.90,sh*0.94,sh*1.04]
          :          [sh*0.98,sh*0.96,sh*0.90];
      } else {
        const r=Math.random();
        c = r<0.34 ? [sh*1.04,sh*1.00,sh*0.92]
          : r<0.62 ? [sh*0.94,sh*0.96,sh*0.98]
          :          [sh*1.00,sh*0.98,sh*0.96];
      }
      list.push({geo:new THREE.BoxGeometry(w,h,d),
                 m:mat(x,base+h/2,z,0,-rot,0), uv:[w/16,h/16], c:c});
      BLD.roof.push({geo:new THREE.PlaneGeometry(w,d,1,1),
                 m:mat(x,base+h+0.2,z,-Math.PI/2,0,-rot), uv:[w/22,d/22],
                 c:[c[0]*0.84,c[1]*0.84,c[2]*0.82]});
      /* something on the roof, because there always is */
      if(tall){
        BLD.conc.push({geo:new THREE.BoxGeometry(w*0.34,rnd(5,16),d*0.34),
                   m:mat(x,base+h+rnd(2.5,8),z,0,-rot,0), uv:[1,1],
                   c:[c[0]*0.8,c[1]*0.8,c[2]*0.82]});
        if(h>150) addLamp(x,base+h+8,z,7,[1.0,0.24,0.18]);
      }
    }
  }
}

/* ══════════════════════════════════════════════════════════════

const SHA=Math.atan2(0.30,1);                    /* how the shore runs */
const ALG=[Math.sin(SHA),Math.cos(SHA)];         /* along it, going south */
const OFF=[-Math.cos(SHA),Math.sin(SHA)];        /* and out into the water */
function shorePt(z,d,s){
  s=s||0;
  return { x:shoreX(z)+OFF[0]*d+ALG[0]*s, z:z+OFF[1]*d+ALG[1]*s };
}
const WATERY=0.0, QUAY=3.6, ROADY=2.5;

const WM=ps1({map:T.foam, transparent:true, cutout:0.01, ambient:1, emissive:0.60,

/* ── the piers, and the sheds that sit on half of them ──────────────── */

  LIST.forEach(function(P){

      dk.push({geo:new THREE.BoxGeometry(44,1.6,P.w),
               m:mat(a.x,QUAY,a.z,0,SHA+Math.PI/2,0), uv:[3,P.w/18],
               c:[0.56,0.54,0.52]});
      [-1,1].forEach(function(t){

/* ── the wheel on fifty-seven ───────────────────────────────────────── */
const WHEEL=(function(){
  const P=PIER.filter(function(p){ return p.wheel; })[0];
  const c=shorePt(P.z,P.len-46);
  const R=26, CY=QUAY+R+8;
  const grp=new THREE.Group();
  grp.position.set(c.x,CY,c.z);
  grp.rotation.y=-(Math.PI/2-SHA);            /* its axle points out to sea */
  const spin=new THREE.Group(); grp.add(spin); scene.add(grp);
  const it=[];
  [-2.6,2.6].forEach(function(zz){
    it.push({geo:new THREE.TorusGeometry(R,0.42,5,44),
             m:mat(0,0,zz,0,0,0), uv:[14,1], c:[0.92,0.93,0.95]});
  });
  for(let i=0;i<30;i++){
    const a=i/30*TAU;
    it.push({geo:new THREE.BoxGeometry(0.26,R*2,0.26),
             m:mat(0,0,0,0,0,a), uv:[1,8], c:[0.88,0.89,0.92]});
  }
  it.push({geo:new THREE.CylinderGeometry(1.5,1.5,7,8),
           m:mat(0,0,0,Math.PI/2,0,0), uv:[2,1], c:[0.80,0.82,0.85]});
  /* forty-two of them, and they turn with it, which at this range is fine */
  for(let i=0;i<42;i++){
    const a=i/42*TAU;
    it.push({geo:new THREE.BoxGeometry(2.6,2.8,3.6),
             m:mat(Math.cos(a)*(R-1.4),Math.sin(a)*(R-1.4),0,0,0,0), uv:[1,1],
             c:[0.86,0.88,0.92]});
  }
  const m=new THREE.Mesh(merge(it,true),CM.steel);
  m.frustumCulled=false; spin.add(m);
  /* the A-frame it stands in, which does not turn */
  const legs=[];
  [-1,1].forEach(function(s){
    [-1,1].forEach(function(t){
      const b=shorePt(P.z,P.len-46+t*15,s*10);
      const dx=b.x-c.x, dz=b.z-c.z;
      const run=Math.hypot(dx,dz), rise=CY-QUAY;
      legs.push({geo:new THREE.BoxGeometry(1.5,Math.hypot(run,rise),1.5),
                 m:mat((b.x+c.x)/2,(QUAY+CY)/2,(b.z+c.z)/2,0,
                       -Math.atan2(dz,dx),Math.atan2(run,rise)), uv:[1,6],
                 c:[0.84,0.86,0.88]});
    });
  });
  baked(legs,CM.steel,true);
  for(let i=0;i<8;i++){
    const a=i/8*TAU;
    addLamp(c.x+Math.cos(a)*R*0.8,CY+Math.sin(a)*R*0.8,c.z,7,[0.72,0.84,1.0]);
  }
  const hit=new THREE.Mesh(new THREE.BoxGeometry(60,66,22),
            new THREE.MeshBasicMaterial({visible:false}));
  hit.position.set(c.x,CY,c.z); place(hit,'wheel',4);
  return { spin:spin, x:c.x, z:c.z, y:CY };
})();

/* ── Bell Harbor: the breakwater, the docks, and four dozen masts ───── */
(function marina(){
  const P=PIER.filter(function(p){ return p.marina; })[0];
  const dk=[], hull=[], cab=[], mast=[], bw=[], wat=[];
  /* laying a plane flat but square to the shore: local X runs out to sea,
     local Y runs south down the quay */
  const FLAT=Math.PI+SHA;

  /* ── the basin ──────────────────────────────────────────────
     Inside the breakwater the water is flat and a shade paler than
     the Sound, and you want to be able to see most of it — so the
     docks are thin, the rows are far apart, and half the slips are
     empty, which in September they are. */
  const bc=shorePt(P.z,P.len*0.54);
  wat.push({geo:new THREE.PlaneGeometry(P.len*0.98,P.w*0.96,4,4),
            m:mat(bc.x,-0.16,bc.z,-Math.PI/2,0,FLAT), uv:[5,4],
            c:[1.50,1.54,1.44]});

  /* the breakwater, with the way in left open at the north end */
  for(let i=0;i<11;i++){
    if(i===7||i===8) continue;                 /* the entrance */
    const q=shorePt(P.z,P.len-6,-P.w/2+6+i*((P.w-12)/10));
    bw.push({geo:new THREE.BoxGeometry(22,7,14),
             m:mat(q.x,1.2,q.z,0,SHA+rnd(-0.08,0.08),0), uv:[2,1],
             c:[0.56,0.55,0.52]});
  }
  /* a light on the end of it */
  const lg=shorePt(P.z,P.len-6,-P.w/2+6+6.6*((P.w-12)/10));
  mast.push({geo:new THREE.CylinderGeometry(0.5,0.7,9,6),
             m:mat(lg.x,6.5,lg.z,0,0,0), uv:[1,3], c:[0.94,0.90,0.70]});
  addLamp(lg.x,11.5,lg.z,6,[0.40,1.0,0.52]);

  /* ── the docks: one walkway, seven fingers, and that is all ── */
  const NF=7, SP=(P.w-44)/(NF-1);
  const w0=shorePt(P.z,P.len*0.33,-P.w/2+22), w1=shorePt(P.z,P.len*0.33,P.w/2-22);
  dk.push({geo:new THREE.BoxGeometry(Math.hypot(w1.x-w0.x,w1.z-w0.z),0.9,3.6),
           m:mat((w0.x+w1.x)/2,1.5,(w0.z+w1.z)/2,0,SHA,0), uv:[10,1],
           c:[1.34,1.32,1.26]});
  /* and the ramp down to it from the quay */
  const rp0=shorePt(P.z,P.len*0.12,0), rp1=shorePt(P.z,P.len*0.33,0);
  dk.push({geo:new THREE.BoxGeometry(Math.hypot(rp1.x-rp0.x,rp1.z-rp0.z),0.7,4.4),
           m:mat((rp0.x+rp1.x)/2,2.4,(rp0.z+rp1.z)/2,0,SHA+Math.PI/2,-0.16), uv:[4,1],
           c:[1.30,1.28,1.22]});

  for(let i=0;i<NF;i++){
    const s=-P.w/2+22+i*SP;
    const a=shorePt(P.z,P.len*0.35,s), b=shorePt(P.z,P.len*0.88,s);
    dk.push({geo:new THREE.BoxGeometry(Math.hypot(b.x-a.x,b.z-a.z),0.7,2.2),
             m:mat((a.x+b.x)/2,1.45,(a.z+b.z)/2,0,SHA+Math.PI/2,0), uv:[8,1],
             c:[1.30,1.28,1.22]});
    /* and what is tied to it — four berths a side, a third of them empty */
    for(let k=0;k<4;k++){
      for(let side=-1;side<=1;side+=2){
        if(Math.random()<0.34) continue;
        const d=P.len*0.42+k*(P.len*0.42/3);
        const q=shorePt(P.z,d,s+side*5.0);
        const sail=Math.random()<0.62;
        const L=sail?rnd(8,12.5):rnd(9,14), W=rnd(2.5,3.3);
        const wh=[1.02,1.03,1.04];
        hull.push({geo:new THREE.BoxGeometry(L,2.2,W),
                   m:mat(q.x,1.05,q.z,0,SHA+Math.PI/2,0), uv:[2,1], c:wh});
        hull.push({geo:new THREE.BoxGeometry(L*0.90,1.0,W*0.66),
                   m:mat(q.x,-0.25,q.z,0,SHA+Math.PI/2,0), uv:[2,1],
                   c:[0.18,0.26,0.30]});
        cab.push({geo:new THREE.BoxGeometry(L*(sail?0.40:0.48),sail?1.4:2.3,W*0.72),
                  m:mat(q.x,sail?2.85:3.25,q.z,0,SHA+Math.PI/2,0), uv:[1,1],
                  c:sail?[0.98,0.98,0.94]:[1.00,1.00,1.02]});
        if(sail){
          mast.push({geo:new THREE.CylinderGeometry(0.10,0.14,rnd(12,17),5),
                     m:mat(q.x,rnd(10,12.5),q.z,0,0,0), uv:[1,6], c:[0.94,0.95,0.98]});
          mast.push({geo:new THREE.BoxGeometry(L*0.36,0.13,0.13),
                     m:mat(q.x,4.8,q.z,0,SHA+Math.PI/2,0), c:[0.90,0.91,0.94]});
        } else {
          cab.push({geo:new THREE.BoxGeometry(L*0.28,1.3,W*0.46),
                    m:mat(q.x,4.7,q.z,0,SHA+Math.PI/2,0), uv:[1,1], c:[1.00,1.00,1.02]});
        }
      }
    }
  }
  baked(wat,CM.water,true);
  baked(bw,CM.rock,true);
  baked(dk,CM.grnd,true);
  baked(hull,CM.conc,true); baked(cab,CM.conc,true); baked(mast,CM.steel,true);
  const c=shorePt(P.z,P.len*0.6);
  const hit=new THREE.Mesh(new THREE.BoxGeometry(P.len,40,P.w),
            new THREE.MeshBasicMaterial({visible:false}));
  hit.position.set(c.x,10,c.z); hit.rotation.y=SHA+Math.PI/2;
  place(hit,'marina',2);
  for(let i=0;i<8;i++){
    const q=shorePt(P.z,P.len*0.34,-P.w/2+24+i*((P.w-48)/7));
    addLamp(q.x,5,q.z,4,[1.0,0.86,0.56]);
  }
})();

    const bk=put(u,-118+52);
    gan.push({geo:new THREE.BoxGeometry(6,4,72),

    gan.push({geo:new THREE.BoxGeometry(10,13,13),
              m:mat(p.x,71,p.z,0,-ANG,0), uv:[1,1], c:[0.74,0.38,0.12]});
    /* the A of cable over the top */
    [-1,1].forEach(function(t){

  baked(wharf,CM.conc,true); baked(gan,CM.steel,true); baked(box,CM.conc,true);

/* ══════════════════════════════════════════════════════════════
   EVERY LIGHT IN THE CITY, ONCE IT IS DARK ENOUGH TO MATTER
   ══════════════════════════════════════════════════════════════ */
(function glows(){
  /* a scatter of street lighting across the whole basin */
  for(let i=0;i<(QUAL.low?520:980);i++){
    const a=rnd(0,TAU), r=Math.pow(Math.random(),0.5)*4200+70;
    const x=Math.cos(a)*r, z=Math.sin(a)*r;
    if(x<shoreX(z)) continue;
    addLamp(x,rnd(4,34),z,rnd(16,54),[1.0,0.80,0.46]);
  }
  /* and the part of it that never turns anything off */
  for(let i=0;i<(QUAL.low?120:240);i++){
    const a=rnd(0,TAU), r=Math.pow(Math.random(),0.6)*900;
    const x=560+Math.cos(a)*r, z=1620+Math.sin(a)*r;
    if(x<shoreX(z)) continue;
    addLamp(x,rnd(8,140),z,rnd(14,46),[1.0,0.86,0.58]);
  }
  /* the fairground at the foot of it */
  for(let i=0;i<40;i++){
    const a=rnd(0,TAU), r=rnd(60,220);
    addLamp(Math.cos(a)*r,rnd(4,16),Math.sin(a)*r,rnd(5,13),[1.0,0.78,0.40]);
  }
  const pos=new Float32Array(LAMPS.length*3), siz=new Float32Array(LAMPS.length),
        col=new Float32Array(LAMPS.length*3);
  LAMPS.forEach(function(L,i){
    pos[i*3]=L.x; pos[i*3+1]=L.y; pos[i*3+2]=L.z;
    siz[i]=L.s; col[i*3]=L.c[0]; col[i*3+1]=L.c[1]; col[i*3+2]=L.c[2];
  });
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('siz',new THREE.BufferAttribute(siz,1));
  g.setAttribute('col',new THREE.BufferAttribute(col,3));
  const m=new THREE.ShaderMaterial({
    uniforms:{uTex:{value:T.spark},uNight:U.night,uFogT:U.fogT,uFogK:{value:1}},
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    vertexShader:[
      'attribute float siz; attribute vec3 col; varying vec3 vC; varying float vA;',
      'uniform float uNight,uFogT,uFogK;',
      'void main(){ vC=col;',
      '  vA=1.0-uFogK*step(position.y,uFogT);',   /* the ones still under the fog do not show */
      '  vec4 mv=modelViewMatrix*vec4(position,1.0);',
      '  gl_PointSize=clamp(siz*150.0/max(-mv.z,1.0),1.0,22.0)*(0.10+0.90*uNight);',
      '  gl_Position=projectionMatrix*mv; }'
    ].join('\n'),
    fragmentShader:[
      'uniform sampler2D uTex; uniform float uNight; varying vec3 vC; varying float vA;',
      'void main(){ vec4 t=texture2D(uTex,gl_PointCoord);',
      '  gl_FragColor=vec4(vC*t.rgb,t.a*(0.05+0.95*uNight)*vA); }'
    ].join('\n')
  });
  const pts=new THREE.Points(g,m); pts.frustumCulled=false; pts.renderOrder=8;
  scene.add(pts);
  window.__glowU=m.uniforms;
})();

const stickEl=document.getElementById('stick'), knobEl=document.getElementById('knob'), SR=44;
const move={x:0,y:0};
let stickId=null, lookId=null, lx=0, ly=0, lm=0;
function sens(){ return 0.0045*Math.max(0.10,fovNow/FOV_WIDE); }

function stickSet(t){
  const r=stickEl.getBoundingClientRect();

  const d=Math.hypot(dx,dy);

  for(let i=0;i<e.changedTouches.length;i++){

    else if(t.identifier===lookId){
      const dx=t.clientX-lx, dy=t.clientY-ly;

},{passive:true});

    const t=e.changedTouches[i];

let md=false, mx=0, my=0, mm=0, lastTouch=0;

/* ══════════════════════════════════════════════════════════════
   WHERE THE FLOOR IS
   Two discs and a pair of spiral stairs between them. You can only
   change level by walking the stairs, and you can only get onto the
   stairs from an end, because the rest of them is over your head.
   ══════════════════════════════════════════════════════════════ */
function polar(x,z){ let a=Math.atan2(z,x); if(a<0) a+=TAU; return a; }
const STEP_UP=0.75;
function floorAt(x,z,curY,lvl){
  const r=Math.hypot(x,z), a=polar(x,z);
  const st=stairAt(r,a);
  if(st&&Math.abs(st.y-curY)<=STEP_UP) return {y:st.y, r:r, st:st, glass:false};
  /* under the stairs is still the lower floor, which is the nice thing
     about having built them out of one long flight */
  if(lvl===1||(st&&st.y-curY>1.0)){
    if(r<=LOUPE.rOut-0.80&&Math.abs(LOUPE.y-curY)<=STEP_UP)
      return {y:LOUPE.y, r:r, st:null, glass:r>LOUPE.rSolid+0.15};
    return null;
  }
  if(Math.abs(DECK.y-curY)>STEP_UP) return null;
  const FL={y:DECK.y, r:r, st:null, glass:false};
  /* the deck ring itself */
  if(r>=DECK.rIn+0.36&&r<=DECK.rOut-0.62) return FL;
  /* the sill in each doorway: the drum has no wall here, and without this
     there is a hand's width of nothing between the deck and the stairs */
  if(r>=ST_ROUT-0.30&&r<DECK.rIn+0.36&&inMouth(a)) return FL;
  /* the lobby in the middle of the core, and the floor round it wherever
     there is no stairwell cut out of it */
  if(r<=ST_RIN-0.05) return FL;
  if(r<=ST_ROUT-0.30&&!stairArc(a)) return FL;
  return null;
}
function circPush(p){
  if(P.lvl!==0) return;
  for(let i=0;i<CIRC.length;i++){
    const c=CIRC[i], dx=p.x-c.x, dz=p.z-c.z;
    const d=Math.hypot(dx,dz), rr=c.r+0.38;
    if(d<rr){
      if(d>0.0001){ p.x=c.x+dx/d*rr; p.z=c.z+dz/d*rr; }
      else p.x=c.x+rr;
    }
  }
}

const scopeEl=document.getElementById('scope'), scopeName=scopeEl.querySelector('s');

/* ══════════════════════════════════════════════════════════════
   TOUCHING THINGS
   ══════════════════════════════════════════════════════════════ */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
ray.far=26000;
/* what you meant to touch beats what happened to be behind it — but the
   glass is not what you meant, it is what you are looking through */
const PRIORITY={ ferry:15, scope:14, lift:12, oculus:11,
                 person:10, bench:10, bird:10,
                 wheel:11, marina:11, mtn:9, ship:9, plane:9, city:8, water:8,
                 steel:7, gold:7, floor:6, roof:5, core:5, glass:4 };
const COLR={ ferry:'#DCC46A', wheel:'#DCE6F0', marina:'#CBD8DE', scope:'#C9962C', lift:'#B9C2C8', oculus:'#BFD8E8', person:'#E8D8C0',
             bench:'#BFD8E8', glass:'#BFD8E8', steel:'#C4CCD2', gold:'#E8B84E',
             floor:'#CFD6D2', roof:'#D8DCE0', core:'#E4E7EA', plane:'#D6DEE6',
             ship:'#A8C0CC', mtn:'#E8EEF4', city:'#E0C88A', water:'#A9C6D4',
             bird:'#DDE2E8' };
function owner(o){ while(o){ if(o.userData&&o.userData.kind) return o; o=o.parent; } return null; }
/* what stops a ray: glass and everything past it does not */
const SOLID={ ferry:0, wheel:0, marina:0, scope:1, lift:1, oculus:0, person:1, bench:0, bird:1, glass:0,
              steel:1, gold:1, floor:1, roof:1, core:1,
              plane:0, ship:0, mtn:0, city:0, water:0 };
const SAYS={
  person:['somebody','they are looking for their own house',
          'they have been up here twenty minutes and not said anything',
          'they nod, and go back to the window'],
  glass:['forty-eight of them, leaning out','it is an inch and a quarter thick',
         'nothing between you and Fifth Avenue'],
  floor:['the floor, which is turning','one revolution, forty-five minutes',
         'thirty-seven tons of it'],
  deck :['five hundred and twenty feet of poured terrazzo',
         'the whole house turns on twelve motors — this floor is not one of them',
         'two inches of it, and then six hundred feet']
};
const SND={ core:'lift', roof:'gold', bench:'glass', oculus:'lift',
            wheel:'steel', marina:'water', ferry:'ship' };
const _wp=new THREE.Vector3();
function shoot(cx,cy){
  if(boarding) return;
  if(scoped>=0){ dropScope(); return; }
  ndc.x=(cx/innerWidth)*2-1; ndc.y=-(cy/innerHeight)*2+1;
  ray.setFromCamera(ndc,cam);
  const hits=ray.intersectObjects(targets,true);
  /* nothing behind the nearest solid thing is in play — otherwise a tap on
     the drum reads the lift doors on its far side */
  let dSolid=Infinity;
  for(let i=0;i<hits.length;i++){
    const o=owner(hits[i].object); if(!o) continue;
    if(SOLID[o.userData.kind]&&hits[i].distance<dSolid) dSolid=hits[i].distance;
  }
  let best=null, bp=-1, bpt=null;
  for(let i=0;i<hits.length;i++){
    const o=owner(hits[i].object); if(!o) continue;
    if(hits[i].distance>dSolid+0.02) continue;
    const p=PRIORITY[o.userData.kind]||0;
    if(p>bp){ bp=p; best=o; bpt=hits[i].point; }
  }
  if(!best) return;
  let k=best.userData.kind;
  best.getWorldPosition(_wp);
  if(bpt) _wp.copy(bpt);
  best.userData.flash=1;

  /* a telescope */
  if(k==='scope'){
    for(let i=0;i<SCOPES.length;i++) if(SCOPES[i].hit===best){ useScope(i); return; }
  }
  if(k==='bench'){
    touchSound('glass',_wp,6);
    flashName(pick(['a Skyriser — lean back','people lie back on these and regret it',
                    'the drop starts about four inches past your shoulder']),COLR.bench);
    return;
  }
  if(k==='lift'){
    touchSound('lift',_wp,best.userData.deg);
    flashName(pick(['forty-one seconds to the ground','it is on its way up',
                    'ten miles an hour, straight down']),COLR.lift);
    return;
  }
  if(k==='oculus'){
    touchSound('lift',_wp,2);
    flashName('straight down the shaft',COLR.oculus);
    note('five hundred feet of nothing','and a counterweight coming the other way',4.5);
    return;
  }
  if(k==='mtn'){
    touchSound('mtn',_wp,0);
    flashName(SKY.fog>0.45?'the mountain, over the top of the morning':'the mountain is out',COLR.mtn);
    return;
  }
  if(k==='person'){
    touchSound('person',_wp,best.userData.deg);
    flashName(pick(SAYS.person),COLR.person); return;
  }
  if(k==='glass'||k==='floor'){
    touchSound('floor'===k?'floor':'glass',_wp,best.userData.deg);
    /* the one up here does not turn; the one downstairs is the whole point */
    flashName(pick(SAYS[k==='floor'&&_wp.y>156?'deck':k]),COLR[k]); return;
  }
  /* ── and the one that is actually going somewhere ─────── */
  if(k==='ferry'){ board(); return; }
  if(k==='wheel'){
    touchSound('steel',_wp,4);
    flashName(pick(['the wheel on fifty-seven','a hundred and seventy-five feet of it',
                    'it goes round three times and that is your ticket']),COLR.wheel);
    return;
  }
  if(k==='marina'){
    touchSound('water',_wp,1);
    flashName(pick(['Bell Harbor, and everything tied up in it',
                    'a forest of masts and nobody going anywhere',
                    'somebody down there is varnishing something']),COLR.marina);
    return;
  }
  if(k==='ship'){
    touchSound('ship',_wp,best.userData.deg);
    flashName(pick(['something crossing to Bainbridge','the 7:10, and it is late',
                    'Elliott Bay, and everything on it']),COLR.ship);
    return;
  }
  if(k==='plane'){
    touchSound('plane',_wp,3);
    flashName('a float plane off the lake',COLR.plane); return;
  }
  if(k==='bird'){
    gullCry(_wp.x,_wp.y,_wp.z,Math.random()<0.5);
    flashName(pick(['a gull, up here with you','it has been up here longer than you have',
                    'it came up without an elevator']),COLR.bird);
    return;
  }
  /* a couple of surfaces have a caption but no note of their own */
  touchSound(SND[k]||k,_wp,best.userData.deg);
  flashName(LABEL[k]||k,COLR[k]||'#EDEFF2');
}
